name: assure-main-ad191d8
# Evidence-only exact-main post-merge assurance.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  exact-main:
    if: github.event.pull_request.head.ref == 'assurance/main-ad191d8'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ad191d8227ba847f127c2c5f563895c2315f81a3
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Record exact identity
        if: always()
        shell: bash
        run: |
          echo "expected_main=ad191d8227ba847f127c2c5f563895c2315f81a3"
          echo "checked_out=$(git rev-parse HEAD)"
