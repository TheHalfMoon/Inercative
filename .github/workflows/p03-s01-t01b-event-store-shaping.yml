name: p03-s01-t01b-event-store-shaping

on:
  push:
    branches:
      - p03/s01-t01b-event-store-shaping
    paths:
      - .github/workflows/p03-s01-t01b-event-store-shaping.yml

permissions:
  contents: write

jobs:
  shape:
    if: ${{ !contains(github.event.head_commit.message, '[shaped]') }}
    runs-on: ubuntu-latest
    env:
      CANONICAL_BASE: 28a90933d361599c4409f7d8ddcccdafd90e7a39
      SPEC_GRAIN_SOURCE: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
    steps:
      - name: Checkout shaping branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$CANONICAL_BASE" HEAD)" = "$CANONICAL_BASE"

      - name: Install exact SpecGrain source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps "https://github.com/TheHalfMoon/SpecGrain/archive/${SPEC_GRAIN_SOURCE}.zip"
          specgrain --help >/dev/null

      - name: Draft with native SpecGrain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _shaping
          specgrain draft . \
            --title "IN-P03-S01-T01B provider-neutral append-only Run event-store contract" \
            --outcome "The Harness Kernel has a deterministic provider-neutral EventStore contract and reference semantics for validated EventRecord append/replay, with zero-based contiguous per-Run ordering, immutable history, conflict rejection, and no capability authority before any durable database adapter is introduced." \
            --rationale "SG-000011 defined EventRecord wire validation, SG-000038 shaped Run lifecycle/continuation semantics, and the current session shell already emits per-Run zero-based sequences in memory. P03-S01 still lacks a canonical event-store boundary. The smallest safe next step is to define append/replay semantics independently from Supabase, network, providers, artifacts, and budgets so durable persistence can be implemented and reviewed as a later adapter Grain." \
            --json | tee _shaping/draft.json
          SPEC_ID="$(python -c 'import json; print(json.load(open("_shaping/draft.json"))["spec_id"])')"
          test "$SPEC_ID" = "SG-000039"
          echo "SPEC_ID=$SPEC_ID" >> "$GITHUB_ENV"

      - name: Shape bounded Grain
        shell: bash
        run: |
          set -euo pipefail
          specgrain shape "$SPEC_ID" . \
            --scope-in "Introduce the minimal P03 Harness Kernel package boundary needed to own provider-neutral Run event-store semantics without moving or redefining SG-000011 protocol records." \
            --scope-in "Define an EventStore port over validated EventRecord values with append and per-Run ordered read/replay behavior; the store must not invent, repair, or silently coerce invalid protocol records." \
            --scope-in "Define canonical per-Run ordering as zero-based contiguous sequence values: the first persisted event for a Run is sequence 0 and each subsequent event is exactly the prior persisted sequence plus one." \
            --scope-in "Make event history append-only and immutable: reject duplicate event identities, duplicate per-Run sequence positions, sequence gaps, sequence regression, and any attempt to overwrite or mutate an already accepted event." \
            --scope-in "Require deterministic Run isolation and replay: reading a Run returns only that Run's accepted events in ascending sequence order, independent of insertion/query implementation details or other Runs." \
            --scope-in "Allow a deterministic in-memory reference implementation for contract qualification while explicitly preserving that it is not durable persistence and does not close the parent P03-S01 task by itself." \
            --scope-out "No Supabase/Postgres/database schema, migration, durable storage adapter, network call, secret, browser storage, filesystem persistence, queue, cache, or hosted service operation." \
            --scope-out "No change to EventRecord or RunRecord wire schemas, no new timestamps/cost/provider fields, no lifecycle state mutation, and no automatic derivation of Run state from event presence." \
            --scope-out "No artifact store, budget governor, model/provider/tool routing, retry execution, scheduler, capability grant, evidence PASS authority, release/deployment behavior, or P02 changes." \
            --acceptance "The Harness package exposes a small provider-neutral EventStore contract that consumes existing validated EventRecord values and has no dependency on a concrete database, model/provider, browser, or UI framework." \
            --acceptance "Focused tests prove the zero-based contiguous sequence invariant for each Run, independent Run isolation, immutable append-only history, and deterministic ascending replay." \
            --acceptance "Duplicate event identity, duplicate sequence position, skipped sequence, regressed sequence, cross-Run substitution, and invalid EventRecord input fail closed with stable machine-readable error/result semantics and cannot mutate accepted history." \
            --acceptance "Repeated reads/replay of the same accepted history are deterministic, do not mutate stored records, and preserve exact EventRecord identity/content." \
            --acceptance "The implementation and evidence explicitly state that the in-memory reference is not durable persistence; a later bounded adapter Grain is required before parent IN-P03-S01-T01 can close." \
            --acceptance "Any implementation candidate must pass repository format/lint/typecheck/tests, truthful Diffcipline proof, checksum-verified Alibaba Open Code Review, required credentialed Jev semantic review, exact-head CI, normal merge, and fresh-main CI before closure." \
            --dependency SG-000011 \
            --dependency SG-000038 \
            --risk-level medium \
            --recovery "Revert only the new Harness EventStore contract/reference implementation and exports; SG-000011 protocol records, SG-000038 Run lifecycle shaping, and existing session-shell behavior remain intact." \
            --context-budget 8500 \
            --context-estimate 6200 \
            --change-surface "packages/harness/**" \
            --change-surface "docs/evidence/**" \
            --change-surface "specs/CURRENT.md" \
            --evidence "Exact base/head/merge-base and complete changed-file accounting." \
            --evidence "Focused append/replay invariant tests plus full repository format/lint/typecheck/test suites." \
            --evidence "Diffcipline proof, Alibaba OCR evidence, credentialed Jev semantic review, exact-head semantic review, and post-merge fresh-main CI." \
            --minimality-choice reuse-existing \
            --minimality-rationale "Reuse SG-000011 EventRecord validation and SG-000038 Run semantics. Define only the provider-neutral append/replay boundary and deterministic reference behavior now; defer durable storage and operational adapters to an independently reviewable Grain." \
            --safety-status requirements-defined \
            --safety-requirement "Event presence, sequence position, or successful append never grants capability, authorization, credential, network, provider, release, deployment, or PASS authority." \
            --safety-requirement "Accepted event history is immutable and fail-closed under identity/sequence conflict; no silent overwrite, gap repair, or cross-Run substitution is allowed." \
            --safety-requirement "The reference implementation is deterministic and side-effect bounded; durable persistence is explicitly deferred rather than simulated or fabricated." \
            --json | tee _shaping/shape.json
          specgrain refine "$SPEC_ID" . --json | tee _shaping/refine.json
          specgrain grain "$SPEC_ID" . --json | tee _shaping/grain.json
          specgrain check . --json | tee _shaping/check.json

      - name: Persist only SpecGrain state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p03-s01-t01b-event-store-shaping.yml
          git status --short
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add .specgrain .github/workflows/p03-s01-t01b-event-store-shaping.yml
          git commit -m "spec(p03): shape append-only Run event-store contract [shaped]"
          git push origin HEAD:p03/s01-t01b-event-store-shaping
