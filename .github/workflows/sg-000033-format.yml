name: sg-000033-format

on:
  push:
    branches:
      - p02/s05-t01a-user-view-projections
    paths:
      - .github/workflows/sg-000033-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Canonicalize candidate formatting
        run: pnpm exec prettier --write packages/product-graph/src/user-views.ts packages/product-graph/src/user-views.test.ts packages/product-graph/src/index.ts
      - name: Persist formatted candidate and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sg-000033-format.yml
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add packages/product-graph/src/user-views.ts packages/product-graph/src/user-views.test.ts packages/product-graph/src/index.ts .github/workflows/sg-000033-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(product-graph): canonicalize SG-000033 candidate [formatted]"
          git push origin HEAD:p02/s05-t01a-user-view-projections
