name: p02-s01-t01b-shape

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  shape:
    if: github.event.pull_request.head.ref == 'p02/s01-t01b-relational-product-graph'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned SpecGrain
        run: python -m pip install "git+https://github.com/TheHalfMoon/SpecGrain.git@5de7d6499bb0a9e3a191fc0934399cf099d1980a"

      - name: Shape bounded Grain
        shell: bash
        run: |
          set -euo pipefail
          specgrain draft . \
            --title "IN-P02-S01-T01B Prototype normalized relational Product Graph snapshot" \
            --outcome "A private deterministic normalized-relational Product Graph prototype proves canonical row normalization, round-trip, revision binding, and bounded query semantics without selecting the production v1 representation." \
            | tee /tmp/draft.txt
          specgrain shape SG-000016 . \
            --scope-in "Implement one private normalized-relational Product Graph snapshot prototype over the current canonical graph semantics." \
            --scope-in "Bind revision, node, and edge rows to graph identity and semantic revision, rejecting mismatches fail-closed." \
            --scope-in "Provide focused deterministic round-trip, row-order normalization, bounded query, and malformed-row tests." \
            --scope-out "No cross-representation comparison or Product Graph v1 selection." \
            --scope-out "No public Product Graph v1 contract, database schema, Supabase migration, graph database, or remote side effect." \
            --acceptance "Normalized-relational persistence round-trips to the same canonical semantic graph." \
            --acceptance "Equivalent graph and row insertion-order permutations produce identical canonical serialization and semantic revision." \
            --acceptance "Node lookup, outgoing-edge lookup, and one-hop slice queries are deterministic on the representative fixture." \
            --acceptance "Malformed attributes plus graphId/revision row mismatches are rejected fail-closed." \
            --acceptance "Focused tests, Diffcipline R1 exact-candidate proof, Alibaba OCR accounting/review, and exact-head Ubuntu/Windows repository CI are recorded before merge." \
            --dependency SG-000015 \
            --risk-level medium \
            --recovery "Revert SG-000016 and the private normalized-relational prototype; no public contract or external state is changed." \
            --context-budget 6000 \
            --context-estimate 3200 \
            --change-surface "packages/product-graph-lab/**" \
            --change-surface "docs/evidence/**" \
            --change-surface "specs/CURRENT.md" \
            --evidence "Focused normalized-relational prototype tests for round-trip, canonical row ordering, revision binding, queries, and malformed rows." \
            --evidence "Diffcipline R1 exact-candidate PASS plus Alibaba OCR exact-diff accounting/review." \
            --evidence "Exact-head Ubuntu and Windows repository CI." \
            --minimality-choice new-code \
            --minimality-rationale "Extend the private Product Graph lab with one dependency-free normalized-relational prototype instead of selecting production storage or introducing a database dependency." \
            --safety-status requirements-defined \
            --safety-requirement "Keep the prototype private and non-authoritative; do not expose it as the public Product Graph v1 contract." \
            | tee /tmp/shape.txt
          specgrain refine SG-000016 . | tee /tmp/refine.txt
          specgrain grain SG-000016 . | tee /tmp/grain.txt
          specgrain check . | tee /tmp/check.txt
          specgrain next . | tee /tmp/next.txt

      - name: Record shaping evidence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence
          {
            echo "# P02-S01-T01B — SpecGrain Shaping Evidence"
            echo
            echo "**Task:** IN-P02-S01-T01B"
            echo "**SpecGrain:** SG-000016"
            echo "**Date:** 2026-09-21"
            echo "**Canonical baseline:** 7749a229c8530f06fd079cc1bd0aa2786b9f50ce"
            echo "**SpecGrain source:** TheHalfMoon/SpecGrain@5de7d6499bb0a9e3a191fc0934399cf099d1980a"
            echo "**GitHub Actions run:** ${GITHUB_RUN_ID}"
            echo
            echo "## Tool execution"
            echo
            echo '~~~text'
            cat /tmp/draft.txt /tmp/shape.txt /tmp/refine.txt /tmp/grain.txt /tmp/check.txt /tmp/next.txt
            echo '~~~'
            echo
            echo "The SpecNode was produced by the pinned SpecGrain CLI. No lifecycle or verification state beyond the observed CLI output is claimed."
            echo
            echo "## Decomposition continuation"
            echo
            echo "SG-000015 / IN-P02-S01-T01A is canonically complete through PR #23 and fresh-main CI #155. This Grain continues IN-P02-S01-T01 as an independently verifiable normalized-relational prototype before any cross-representation comparison or v1 selection."
          } > docs/evidence/P02_S01_T01B_SPECGRAIN_SHAPING_2026-09-21.md
          rm .github/workflows/p02-s01-t01b-shape.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(p02): shape relational Product Graph grain"
          git push origin HEAD:${GITHUB_HEAD_REF}
