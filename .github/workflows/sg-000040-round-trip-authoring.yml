name: sg-000040-round-trip-authoring

on:
  push:
    branches:
      - p03/s01-t01c-durable-round-trip

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 30910a158c0dc5122c200c244a5d9fdb6e978a23
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: p03/s01-t01c-durable-round-trip
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Normalize candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write packages/control-plane/src/durable-round-trip.test.ts
      - name: Verify repository
        shell: bash
        run: |
          set -euo pipefail
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          git diff --check "$BASE_SHA..HEAD"
      - name: Enforce bounded test-only surface
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(packages/control-plane/src/durable-round-trip.test.ts|.github/workflows/sg-000040-round-trip-authoring.yml)$'
          bad="$(git diff --name-only "$BASE_SHA"; git ls-files --others --exclude-standard)"
          if printf '%s\n' "$bad" | sed '/^$/d' | grep -Ev "$allowed"; then
            echo 'Unexpected SG-000040 round-trip path detected.' >&2
            exit 1
          fi
          additions="$(git diff --numstat "$BASE_SHA" | awk '{a += $1} END {print a + 0}')"
          echo "bounded_additions=$additions"
          test "$additions" -le 600
      - name: Persist verified candidate and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TheHalfMoon'
          git config user.email 'alshehriofficial@gmail.com'
          git add packages/control-plane/src/durable-round-trip.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'test(control-plane): normalize durable round-trip proof'
          fi
          git rm .github/workflows/sg-000040-round-trip-authoring.yml
          git commit -m 'chore(authoring): remove durable round-trip workflow'
          git push origin HEAD:p03/s01-t01c-durable-round-trip
