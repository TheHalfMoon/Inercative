name: sg-000040-stack

on:
  push:
    branches:
      - stack/p03-s01-t01c-durable-run-event
    paths:
      - .github/workflows/sg-000040-stack.yml

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stack branch
        uses: actions/checkout@v4
        with:
          ref: stack/p03-s01-t01c-durable-run-event
          fetch-depth: 0

      - name: Compose exact SG-000038 candidate without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git fetch origin p03/s01-t01a-run-lifecycle-implementation
          test "$(git rev-parse origin/p03/s01-t01a-run-lifecycle-implementation)" = "d21ac82de1c905bddbc68a60bdeec1ae150666c0"
          git merge --no-ff --no-edit origin/p03/s01-t01a-run-lifecycle-implementation

      - name: Remove temporary stack workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sg-000040-stack.yml
          git add .github/workflows/sg-000040-stack.yml
          git commit -m "chore(stack): remove temporary SG-000040 composer"
          git push origin HEAD:stack/p03-s01-t01c-durable-run-event
