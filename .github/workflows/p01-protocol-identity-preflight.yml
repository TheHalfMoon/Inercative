name: P01 one-shot protocol identity preflight

on:
  push:
    branches:
      - p01/s02-t01-protocol-identity-revisions
    paths:
      - .github/workflows/p01-protocol-identity-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format candidate files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write             packages/protocol/src/identity-revision.ts             packages/protocol/src/identity-revision.test.ts             packages/protocol/src/index.ts             packages/protocol/package.json             docs/canonical/PROTOCOL_IDENTITY_REVISION.md             docs/evidence/P01_S02_T01_PROTOCOL_IDENTITY_REVISION_2026-09-20.md             specs/CURRENT.md
          pnpm exec prettier --check             packages/protocol/src/identity-revision.ts             packages/protocol/src/identity-revision.test.ts             packages/protocol/src/index.ts             packages/protocol/package.json             docs/canonical/PROTOCOL_IDENTITY_REVISION.md             docs/evidence/P01_S02_T01_PROTOCOL_IDENTITY_REVISION_2026-09-20.md             specs/CURRENT.md
          git diff --check
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Focused tests
        run: pnpm exec vitest run packages/protocol/src/identity-revision.test.ts
      - name: Commit formatting and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p01-protocol-identity-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/protocol/src/identity-revision.ts             packages/protocol/src/identity-revision.test.ts             packages/protocol/src/index.ts             packages/protocol/package.json             docs/canonical/PROTOCOL_IDENTITY_REVISION.md             docs/evidence/P01_S02_T01_PROTOCOL_IDENTITY_REVISION_2026-09-20.md             specs/CURRENT.md
          git commit -m "style(p01): format protocol identity primitives"
          git push origin "HEAD:${GITHUB_REF_NAME}"
