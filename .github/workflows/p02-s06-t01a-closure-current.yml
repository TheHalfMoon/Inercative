name: p02-s06-t01a-closure-current

on:
  push:
    branches:
      - p02/s06-t01a-reference-nodes-closure
    paths:
      - .github/workflows/p02-s06-t01a-closure-current.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[current-reconciled]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonical current frontier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('specs/CURRENT.md')
          s = p.read_text()
          replacements = {
              '**Date:** 2026-09-24': '**Date:** 2026-09-26',
              '| SG-000029 | IN-P02-S06-T01A | Semantic reference node contracts | GRAIN / SHAPED (PR #70) | `docs/evidence/P02_S06_T01A_SPECGRAIN_SHAPING_2026-09-26.md` |':
              '| SG-000029 | IN-P02-S06-T01A | Semantic reference node contracts | DONE (PR #72) | `docs/evidence/P02_S06_T01A_CLOSURE_2026-09-26.md` |',
              '3. **SG-000029 / IN-P02-S06-T01A is canonically shaped through PR #70** and is independently implementation-ready for semantic reference node contracts. Later S06 relation semantics remain outside SG-000029.':
              '3. **SG-000029 / IN-P02-S06-T01A is canonically complete through PR #72** with exact-head CI, Diffcipline R2, Alibaba OCR delegation review, and fresh-main Ubuntu/Windows CI. Later S06 relation semantics remain outside SG-000029.'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/p02-s06-t01a-closure-current.yml
          git diff --check
          git diff -- specs/CURRENT.md
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add specs/CURRENT.md .github/workflows/p02-s06-t01a-closure-current.yml
          git commit -m "docs(p02): reconcile SG-000029 canonical closure [current-reconciled]"
          git push origin HEAD:p02/s06-t01a-reference-nodes-closure
