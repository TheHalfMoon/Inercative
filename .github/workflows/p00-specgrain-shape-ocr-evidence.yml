name: P00 SpecGrain one-shot shape OCR evidence

on:
  push:
    branches:
      - p00/s05-t02-ocr-evidence-contract
    paths:
      - .github/workflows/p00-specgrain-shape-ocr-evidence.yml

permissions:
  contents: write

jobs:
  shape:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SPECGRAIN_SHA: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
      BASELINE_SHA: bdfd53c348d98fb2cacda70ec02fab5729aedd59
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact SpecGrain source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps "https://github.com/TheHalfMoon/SpecGrain/archive/${SPECGRAIN_SHA}.zip"
          specgrain --help >/dev/null

      - name: Draft SG-000008
        shell: bash
        run: |
          set -euo pipefail
          specgrain draft .             --title "IN-P00-S05-T02 Define OCR review evidence and file-accounting contract"             --outcome "Every OCR-attached change has one deterministic exact-head evidence record that completely accounts for changed files, rules, semantic-review state, findings, and dispositions without converting NOT RUN into PASS."             --rationale "Canonical P00-S05-T02 frontier after SG-000007 completion."             --json | tee /tmp/draft.json
          test "$(python -c 'import json; print(json.load(open("/tmp/draft.json"))["spec_id"])')" = "SG-000008"

      - name: Shape SG-000008
        shell: bash
        run: |
          set -euo pipefail
          specgrain shape SG-000008 .             --scope-in "Define a machine-readable OCR review evidence schema bound to exact base/head/merge-base and OCR tool provenance."             --scope-in "Define deterministic changed-file accounting across reviewed, deterministically excluded, and separately reviewed material files."             --scope-in "Define semantic review state so RUN, BLOCKED, and NOT_RUN remain distinguishable and fail closed."             --scope-in "Define structured finding disposition and stale-head reconciliation requirements."             --scope-in "Add a deterministic validator with positive and negative fixtures."             --scope-out "Do not provision or commit an LLM credential."             --scope-out "Do not claim semantic OCR review executed when it has not."             --scope-out "Do not implement the future P10 normalized cross-engine Finding kernel."             --acceptance "Evidence is invalid unless base, head, merge-base, OCR version/config provenance, and changed-file accounting are present."             --acceptance "Every changed file is represented exactly once as reviewed, excluded-with-reason, or separately reviewed."             --acceptance "Semantic BLOCKED or NOT_RUN evidence requires an explicit blocker/reason and cannot contain semantic findings."             --acceptance "Semantic RUN evidence requires machine-readable finding capture metadata and every material finding has a disposition."             --acceptance "Evidence whose reviewed head differs from the candidate head is stale unless an explicit reconciliation binds the newer head."             --acceptance "Focused tests and exact-head Ubuntu and Windows repository CI pass."             --dependency SG-000006             --risk-level medium             --recovery "Revert SG-000008 and the bounded OCR evidence contract/validator; no external OCR or LLM side effect is authorized."             --context-budget 9000             --context-estimate 4500             --change-surface "packages/ocr-evidence/**"             --change-surface "docs/engineering/ALIBABA_OCR.md"             --change-surface "docs/canonical/QUALITY_AND_REVIEW.md"             --change-surface "docs/evidence/**"             --change-surface "specs/CURRENT.md"             --evidence "Focused validator tests for file-accounting, semantic-state, disposition, and stale-head negative fixtures."             --evidence "Exact changed-file accounting for the SG-000008 candidate."             --evidence "Exact-head Ubuntu and Windows repository CI."             --minimality-choice new-code             --minimality-rationale "A provider-specific private validation package keeps OCR evidence semantics out of the provider-neutral core protocol while adding no runtime dependency."             --safety-status requirements-defined             --safety-requirement "NOT RUN and BLOCKED must never be normalized into PASS or semantic-review completion."             --safety-requirement "No secret, token, endpoint credential, or model configuration may be committed by this Grain."             --json | tee /tmp/shape.json

      - name: Refine and promote SG-000008
        shell: bash
        run: |
          set -euo pipefail
          specgrain refine SG-000008 . --json | tee /tmp/refine.json
          specgrain check . --json | tee /tmp/check-refining.json
          specgrain grain SG-000008 . --json | tee /tmp/grain.json
          specgrain check . --json | tee /tmp/check-grain.json
          specgrain next . --json | tee /tmp/next.json

      - name: Assert known lifecycle boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          data = json.load(open("/tmp/next.json", encoding="utf-8"))
          candidates = {entry["node_id"]: entry for entry in data["candidates"]}
          candidate = candidates["SG-000008"]
          if candidate["waiting_on"] != ["SG-000006"]:
              raise SystemExit("unexpected waiting_on: " + repr(candidate["waiting_on"]))
          print("known-boundary: SG-000008 waits on SG-000006 because CLI completion transitions are not modeled")
          PY

      - name: Record shaping evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .specgrain/tmp/pregrain-mutation.lock
          mkdir -p docs/evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(name):
              return json.loads(Path("/tmp/" + name).read_text(encoding="utf-8"))

          draft=load("draft.json")
          shape=load("shape.json")
          refine=load("refine.json")
          grain=load("grain.json")
          check=load("check-grain.json")
          nxt=load("next.json")
          candidate=next(item for item in nxt["candidates"] if item["node_id"]=="SG-000008")

          lines=[
              "# P00-S05-T02 — SpecGrain Shaping Evidence",
              "",
              "Task: IN-P00-S05-T02",
              "SpecGrain: SG-000008",
              "Date: 2026-09-20",
              "Canonical baseline: " + os.environ["BASELINE_SHA"],
              "SpecGrain source: TheHalfMoon/SpecGrain@" + os.environ["SPECGRAIN_SHA"],
              "GitHub Actions run: " + os.environ["GITHUB_RUN_ID"],
              "",
              "## Tool execution",
              "",
              "- draft state: " + draft["state"],
              "- shaped revision: " + shape["revision_digest"],
              "- refine state: " + refine["state"],
              "- grain state: " + grain["state"],
              "- final revision: " + grain["revision_digest"],
              "- project check valid: " + str(check["valid"]).lower(),
              "- next waiting_on: " + ",".join(candidate["waiting_on"]),
              "",
              "The SpecNode was produced by the real pinned SpecGrain CLI; it was not hand-authored.",
              "",
              "## Truth boundary",
              "",
              "Semantic Alibaba OCR review remains NOT RUN because no scoped LLM endpoint/token is provisioned.",
              "This Grain defines evidence/accounting semantics only and must not convert the blocker into a review PASS.",
              "",
          ]
          Path("docs/evidence/P00_S05_T02_SPECGRAIN_SHAPING_2026-09-20.md").write_text("\n".join(lines),encoding="utf-8")
          PY

      - name: Commit tool-produced state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
            ".specgrain/specs/SG-000008.json",
            "docs/evidence/P00_S05_T02_SPECGRAIN_SHAPING_2026-09-20.md",
          }
          output=subprocess.check_output(["git","status","--porcelain=v1"],text=True)
          changed={line[3:] for line in output.splitlines() if line}
          if changed != allowed:
              raise SystemExit("unexpected changed paths=" + repr(sorted(changed)) + "; expected=" + repr(sorted(allowed)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .specgrain/specs/SG-000008.json docs/evidence/P00_S05_T02_SPECGRAIN_SHAPING_2026-09-20.md
          git commit -m "chore(p00): shape OCR evidence contract grain"
          git push origin "HEAD:${GITHUB_REF_NAME}"
