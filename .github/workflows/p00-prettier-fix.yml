name: P00 one-shot Prettier fix

on:
  push:
    branches:
      - p00/s04-t03-provenance-admission
    paths:
      - .github/workflows/p00-prettier-fix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format exact files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write             packages/provenance/schema/notice-inventory.schema.json             packages/provenance/src/index.test.ts             packages/provenance/src/index.ts
          pnpm exec prettier --check             packages/provenance/schema/notice-inventory.schema.json             packages/provenance/src/index.test.ts             packages/provenance/src/index.ts
          git diff --check

      - name: Commit format-only repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p00-prettier-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/provenance/schema/notice-inventory.schema.json             packages/provenance/src/index.test.ts             packages/provenance/src/index.ts
          git commit -m "style(p00): format provenance admission"
          git push origin "HEAD:${GITHUB_REF_NAME}"
