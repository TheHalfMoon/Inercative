name: assure-p02-s01-t01a-7c1b84e

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  exact-candidate:
    if: github.event.pull_request.head.ref == 'assurance/p02-s01-t01a-7c1b84e'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7c1b84ebfa8acfb41d1092fbed2b9bed81ec9a19
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused Product Graph verification
        run: |
          pnpm exec tsc --noEmit -p packages/product-graph-lab/tsconfig.json
          pnpm exec vitest run packages/product-graph-lab/src/structured.test.ts

      - name: Alibaba OCR deterministic accounting
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @alibaba-group/open-code-review@1.12.7
          ocr --version
          ocr delegate preview --from ec1a8209c8f6164b41b55e77e5d41db5856b14e9 --to 7c1b84ebfa8acfb41d1092fbed2b9bed81ec9a19 --format json | tee /tmp/ocr-preview.json
          ocr delegate rule packages/product-graph-lab/src/structured.ts packages/product-graph-lab/src/structured.test.ts | tee /tmp/ocr-rules.txt

      - name: Diffcipline exact-candidate proof
        uses: TheHalfMoon/Diffcipline@5cb1c77340b75649f6168e0e8f66479ea047ea96
        with:
          base: ec1a8209c8f6164b41b55e77e5d41db5856b14e9
          risk: R1
          run-verification: "true"

      - name: Record exact identities
        if: always()
        shell: bash
        run: |
          echo "base=ec1a8209c8f6164b41b55e77e5d41db5856b14e9"
          echo "candidate=7c1b84ebfa8acfb41d1092fbed2b9bed81ec9a19"
          echo "checked_out=$(git rev-parse HEAD)"
