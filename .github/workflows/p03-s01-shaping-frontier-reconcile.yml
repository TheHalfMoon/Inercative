name: p03-s01-shaping-frontier-reconcile

on:
  push:
    branches:
      - docs/2026-09-29-p03-s01-shaping-frontier
    paths:
      - .github/workflows/p03-s01-shaping-frontier-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      CANONICAL_BASE: 091ac844f918627fb64b9582482eda81851f1ee8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$CANONICAL_BASE" HEAD)" = "$CANONICAL_BASE"

      - name: Reconcile CURRENT and evidence
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/p03-s01-shaping-frontier-reconcile.py

      - name: Verify documentation-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort)"
          expected="$(printf '%s\n' docs/evidence/P03_S01_SHAPING_FRONTIER_2026-09-29.md specs/CURRENT.md)"
          test "$changed" = "$expected"

      - name: Persist reconciled documentation and self-delete authoring assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          rm .github/workflows/p03-s01-shaping-frontier-reconcile.yml .github/scripts/p03-s01-shaping-frontier-reconcile.py
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' .github/scripts/p03-s01-shaping-frontier-reconcile.py .github/workflows/p03-s01-shaping-frontier-reconcile.yml docs/evidence/P03_S01_SHAPING_FRONTIER_2026-09-29.md specs/CURRENT.md | sort)"
          test "$changed" = "$expected"
          git commit -m "docs(frontier): close P03-S01 shaping frontier [reconciled]"
          git push origin HEAD:docs/2026-09-29-p03-s01-shaping-frontier
