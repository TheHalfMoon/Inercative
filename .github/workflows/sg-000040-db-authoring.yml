name: sg-000040-db-authoring

on:
  push:
    branches:
      - p03/s01-t01c-durable-db
    paths:
      - .github/workflows/sg-000040-db-authoring.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout database packet
        uses: actions/checkout@v4
        with:
          ref: p03/s01-t01c-durable-db
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format bounded test file
        run: pnpm exec prettier --write packages/control-plane/src/run-event-migration.test.ts
      - name: Verify full repository
        shell: bash
        run: |
          set -euo pipefail
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          git diff --check
      - name: Persist verified packet and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          rm .github/workflows/sg-000040-db-authoring.yml
          git add -A
          changed="$(git diff --cached --name-only)"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/sg-000040-db-authoring.yml|packages/control-plane/src/run-event-migration.test.ts) ;;
              *) echo "Unexpected database authoring path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          if [ -n "$changed" ]; then
            git commit -m "test(control-plane): format SG-000040 database packet"
            git push origin HEAD:p03/s01-t01c-durable-db
          fi
