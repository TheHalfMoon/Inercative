name: sg-000040-db-integration

on:
  push:
    branches:
      - evidence/sg-000040-db-integration

permissions:
  contents: read

jobs:
  postgres-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ineractive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ineractive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CANDIDATE_SHA: fb8cc7cf3e26b25b9ed13841df7d820719210f24
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ineractive_test
      PGPASSWORD: postgres
      OWNER_ID: 11111111-1111-4111-8111-111111111111
      EDITOR_ID: 22222222-2222-4222-8222-222222222222
      VIEWER_ID: 33333333-3333-4333-8333-333333333333
      OUTSIDER_ID: 44444444-4444-4444-8444-444444444444
      PROJECT_ID: 55555555-5555-4555-8555-555555555555
      RUN_A: ineractive:run:018f9f3a-7b2a-7f11-8a4c-123456789201
      RUN_B: ineractive:run:018f9f3a-7b2a-7f11-8a4c-123456789202
      RUN_C: ineractive:run:018f9f3a-7b2a-7f11-8a4c-123456789203
      TARGET_ID: ineractive:productrevision:018f9f3a-7b2a-7f11-8a4c-123456789204
      TARGET_REV: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      SOURCE_ID: ineractive:tool:018f9f3a-7b2a-7f11-8a4c-123456789205
    steps:
      - name: Checkout exact database candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --check "origin/p03/s01-t01b-event-store-implementation..$CANDIDATE_SHA"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version
          pg_isready -h localhost -p 5432 -U postgres -d ineractive_test

      - name: Bootstrap Supabase-compatible auth surface
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create table auth.users (id uuid primary key);
          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          grant usage on schema auth to anon, authenticated;
          grant execute on function auth.uid() to anon, authenticated;
          SQL

      - name: Apply canonical control-plane and SG-000040 migrations
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f packages/control-plane/supabase/migrations/20260920192409_control_plane_user_project_store.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f packages/control-plane/supabase/migrations/20260929175000_control_plane_run_event_store.sql

      - name: Seed users, project, and membership roles
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -v owner="$OWNER_ID" -v editor="$EDITOR_ID" -v viewer="$VIEWER_ID" \
            -v outsider="$OUTSIDER_ID" -v project="$PROJECT_ID" <<'SQL'
          insert into auth.users(id) values
            (:'owner'::uuid), (:'editor'::uuid), (:'viewer'::uuid), (:'outsider'::uuid);
          insert into public.ineractive_projects(id, owner_user_id, name, slug)
          values (:'project'::uuid, :'owner'::uuid, 'SG-000040 Integration', 'sg-000040-integration');
          insert into public.ineractive_project_memberships(project_id, project_owner_user_id, user_id, role)
          values
            (:'project'::uuid, :'owner'::uuid, :'editor'::uuid, 'editor'),
            (:'project'::uuid, :'owner'::uuid, :'viewer'::uuid, 'viewer');
          SQL

      - name: Prove RLS role and tenant boundaries
        shell: bash
        run: |
          set -euo pipefail
          run_as() {
            local uid="$1"
            shift
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v uid="$uid" "$@"
          }

          run_as "$OWNER_ID" -v project="$PROJECT_ID" -v run="$RUN_A" -v target="$TARGET_ID" -v rev="$TARGET_REV" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          insert into public.ineractive_runs(id, project_id, target_identity, target_revision, state)
          values (:'run', :'project'::uuid, :'target', :'rev', 'PLANNED');
          SQL

          run_as "$EDITOR_ID" -v project="$PROJECT_ID" -v run="$RUN_B" -v target="$TARGET_ID" -v rev="$TARGET_REV" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          insert into public.ineractive_runs(id, project_id, target_identity, target_revision, state)
          values (:'run', :'project'::uuid, :'target', :'rev', 'PLANNED');
          SQL

          owner_count="$(run_as "$OWNER_ID" -At -v project="$PROJECT_ID" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          select count(*) from public.ineractive_runs where project_id = :'project'::uuid;
          SQL
          )"
          test "${owner_count##*$'\n'}" = "2"

          viewer_count="$(run_as "$VIEWER_ID" -At -v project="$PROJECT_ID" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          select count(*) from public.ineractive_runs where project_id = :'project'::uuid;
          SQL
          )"
          test "${viewer_count##*$'\n'}" = "2"

          outsider_count="$(run_as "$OUTSIDER_ID" -At -v project="$PROJECT_ID" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          select count(*) from public.ineractive_runs where project_id = :'project'::uuid;
          SQL
          )"
          test "${outsider_count##*$'\n'}" = "0"

          if run_as "$VIEWER_ID" -v project="$PROJECT_ID" -v run="$RUN_C" -v target="$TARGET_ID" -v rev="$TARGET_REV" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          insert into public.ineractive_runs(id, project_id, target_identity, target_revision, state)
          values (:'run', :'project'::uuid, :'target', :'rev', 'PLANNED');
          SQL
          then
            echo 'viewer unexpectedly created a Run' >&2
            exit 1
          fi

          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          set role anon;
          select count(*) from public.ineractive_runs;
          SQL
          then
            echo 'anon unexpectedly read durable Runs' >&2
            exit 1
          fi

      - name: Prove lifecycle atomicity and immutable identity fields
        shell: bash
        run: |
          set -euo pipefail
          owner_sql() {
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v uid="$OWNER_ID" "$@"
          }

          if owner_sql -v project="$PROJECT_ID" -v run="ineractive:run:018f9f3a-7b2a-7f11-8a4c-123456789206" -v target="$TARGET_ID" -v rev="$TARGET_REV" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          insert into public.ineractive_runs(id, project_id, target_identity, target_revision, state)
          values (:'run', :'project'::uuid, :'target', :'rev', 'RUNNING');
          SQL
          then
            echo 'non-PLANNED Run creation unexpectedly succeeded' >&2
            exit 1
          fi

          owner_sql -v run="$RUN_A" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          update public.ineractive_runs set state = 'RUNNING' where id = :'run';
          update public.ineractive_runs set state = 'COMPLETED' where id = :'run';
          SQL

          if owner_sql -v run="$RUN_A" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          update public.ineractive_runs set state = 'RUNNING' where id = :'run';
          SQL
          then
            echo 'terminal Run transition unexpectedly succeeded' >&2
            exit 1
          fi

          state="$(owner_sql -At -v run="$RUN_A" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          select state from public.ineractive_runs where id = :'run';
          SQL
          )"
          test "${state##*$'\n'}" = "COMPLETED"

          if owner_sql -v run="$RUN_A" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          update public.ineractive_runs
          set target_revision = 'sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          where id = :'run';
          SQL
          then
            echo 'immutable Run target unexpectedly changed' >&2
            exit 1
          fi

      - name: Prove append-only sequence semantics and viewer read-only access
        shell: bash
        run: |
          set -euo pipefail
          editor_sql() {
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v uid="$EDITOR_ID" "$@"
          }
          viewer_sql() {
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v uid="$VIEWER_ID" "$@"
          }

          editor_sql -v project="$PROJECT_ID" -v run="$RUN_B" -v source="$SOURCE_ID" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          insert into public.ineractive_run_events(
            id, project_id, run_id, sequence, kind, source, references_json
          ) values (
            'ineractive:event:018f9f3a-7b2a-7f11-8a4c-123456789301',
            :'project'::uuid, :'run', 0, 'tool.observed', :'source', '["artifact:first"]'::jsonb
          );
          SQL

          if editor_sql -v project="$PROJECT_ID" -v run="$RUN_B" -v source="$SOURCE_ID" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          insert into public.ineractive_run_events(
            id, project_id, run_id, sequence, kind, source, references_json
          ) values (
            'ineractive:event:018f9f3a-7b2a-7f11-8a4c-123456789302',
            :'project'::uuid, :'run', 2, 'tool.observed', :'source', '[]'::jsonb
          );
          SQL
          then
            echo 'sequence gap unexpectedly succeeded' >&2
            exit 1
          fi

          editor_sql -v project="$PROJECT_ID" -v run="$RUN_B" -v source="$SOURCE_ID" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          insert into public.ineractive_run_events(
            id, project_id, run_id, sequence, kind, source, references_json
          ) values (
            'ineractive:event:018f9f3a-7b2a-7f11-8a4c-123456789303',
            :'project'::uuid, :'run', 1, 'tool.observed', :'source', '["artifact:second"]'::jsonb
          );
          SQL

          if editor_sql <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          update public.ineractive_run_events set kind = 'tool.changed'
          where id = 'ineractive:event:018f9f3a-7b2a-7f11-8a4c-123456789301';
          SQL
          then
            echo 'accepted Event history unexpectedly updated' >&2
            exit 1
          fi

          if editor_sql <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          delete from public.ineractive_run_events
          where id = 'ineractive:event:018f9f3a-7b2a-7f11-8a4c-123456789301';
          SQL
          then
            echo 'accepted Event history unexpectedly deleted' >&2
            exit 1
          fi

          viewer_count="$(viewer_sql -At -v run="$RUN_B" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          select count(*) from public.ineractive_run_events where run_id = :'run';
          SQL
          )"
          test "${viewer_count##*$'\n'}" = "2"

          if viewer_sql -v project="$PROJECT_ID" -v run="$RUN_B" -v source="$SOURCE_ID" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          insert into public.ineractive_run_events(
            id, project_id, run_id, sequence, kind, source, references_json
          ) values (
            'ineractive:event:018f9f3a-7b2a-7f11-8a4c-123456789304',
            :'project'::uuid, :'run', 2, 'tool.observed', :'source', '[]'::jsonb
          );
          SQL
          then
            echo 'viewer unexpectedly appended an Event' >&2
            exit 1
          fi

      - name: Prove conflicting concurrent appends serialize and fail closed
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -v uid="$OWNER_ID" -v project="$PROJECT_ID" -v run="$RUN_C" \
            -v target="$TARGET_ID" -v rev="$TARGET_REV" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          insert into public.ineractive_runs(id, project_id, target_identity, target_revision, state)
          values (:'run', :'project'::uuid, :'target', :'rev', 'PLANNED');
          SQL

          first_log="$RUNNER_TEMP/sg000040-concurrent-first.log"
          second_log="$RUNNER_TEMP/sg000040-concurrent-second.log"

          (
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -v uid="$OWNER_ID" -v project="$PROJECT_ID" -v run="$RUN_C" -v source="$SOURCE_ID" <<'SQL'
            set role authenticated;
            select set_config('request.jwt.claim.sub', :'uid', false);
            begin;
            insert into public.ineractive_run_events(
              id, project_id, run_id, sequence, kind, source, references_json
            ) values (
              'ineractive:event:018f9f3a-7b2a-7f11-8a4c-123456789305',
              :'project'::uuid, :'run', 0, 'tool.observed', :'source', '[]'::jsonb
            );
            select pg_sleep(2);
            commit;
            SQL
          ) >"$first_log" 2>&1 &
          first_pid=$!
          sleep 0.4

          set +e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -v uid="$OWNER_ID" -v project="$PROJECT_ID" -v run="$RUN_C" -v source="$SOURCE_ID" <<'SQL' >"$second_log" 2>&1
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          insert into public.ineractive_run_events(
            id, project_id, run_id, sequence, kind, source, references_json
          ) values (
            'ineractive:event:018f9f3a-7b2a-7f11-8a4c-123456789306',
            :'project'::uuid, :'run', 0, 'tool.observed', :'source', '[]'::jsonb
          );
          SQL
          second_status=$?
          set -e

          wait "$first_pid"
          test "$second_status" -ne 0
          grep -q 'ineractive_event_sequence_regression' "$second_log"

          count="$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -v uid="$OWNER_ID" -v run="$RUN_C" <<'SQL'
          set role authenticated;
          select set_config('request.jwt.claim.sub', :'uid', false);
          select count(*) from public.ineractive_run_events where run_id = :'run';
          SQL
          )"
          test "${count##*$'\n'}" = "1"

      - name: Record exact PostgreSQL proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "candidate=$CANDIDATE_SHA"
            psql --version
            echo 'scope=RLS+lifecycle+append-only+concurrency'
          } > "$RUNNER_TEMP/sg000040-db-proof.txt"

      - name: Upload database proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg-000040-real-postgres-proof
          path: |
            ${{ runner.temp }}/sg000040-db-proof.txt
            ${{ runner.temp }}/sg000040-concurrent-first.log
            ${{ runner.temp }}/sg000040-concurrent-second.log
          if-no-files-found: warn
