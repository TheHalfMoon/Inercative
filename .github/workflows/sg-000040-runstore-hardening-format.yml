name: sg-000040-runstore-hardening-format

on:
  push:
    branches:
      - p03/s01-t01c-run-store-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: p03/s01-t01c-run-store-hardening
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Normalize exact hardening test
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write packages/control-plane/src/run-store.test.ts
          pnpm exec prettier --check packages/control-plane/src/run-store.test.ts

      - name: Persist formatting and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TheHalfMoon'
          git config user.email 'alshehriofficial@gmail.com'
          git add packages/control-plane/src/run-store.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(control-plane): normalize RunStore hardening tests'
          fi
          git rm .github/workflows/sg-000040-runstore-hardening-format.yml
          git commit -m 'chore(authoring): remove RunStore hardening formatter'
          git push origin HEAD:p03/s01-t01c-run-store-hardening
