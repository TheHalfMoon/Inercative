name: p02-s01-t01c-shape

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  shape:
    if: github.event.pull_request.head.ref == 'p02/s01-t01c-product-graph-comparison'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned SpecGrain
        run: python -m pip install "git+https://github.com/TheHalfMoon/SpecGrain.git@5de7d6499bb0a9e3a191fc0934399cf099d1980a"

      - name: Shape bounded Grain
        shell: bash
        run: |
          set -euo pipefail
          specgrain draft . \
            --title "IN-P02-S01-T01C Compare Product Graph persistence prototypes" \
            --outcome "Executable deterministic evidence compares the structured-document and normalized-relational Product Graph prototypes across the canonical selection criteria without selecting Product Graph v1." \
            | tee /tmp/draft.txt
          specgrain shape SG-000017 . \
            --scope-in "Compare the structured-document and normalized-relational prototypes on one common deterministic representative fixture and one scaled deterministic fixture." \
            --scope-in "Prove semantic revision, round-trip, deterministic serialization, and bounded query parity across both representations." \
            --scope-in "Record machine-readable evidence for deterministic diff, mergeability, migration/versioning, slice/query ergonomics, testability, human inspectability, and performance/storage surface." \
            --scope-out "No Product Graph v1 selection or public contract implementation." \
            --scope-out "No production database, Supabase migration, graph database, benchmark claim based on nondeterministic wall-clock timing, or remote side effect." \
            --acceptance "Both representations produce the same semantic revision and equivalent canonical round-trips for representative and scaled fixtures." \
            --acceptance "Both representations return identical deterministic node, outgoing-edge, and one-hop slice query results." \
            --acceptance "A deterministic report records all seven canonical selection criteria plus serialized-size and relational-row measurements with selection explicitly deferred to IN-P02-S01-T02." \
            --acceptance "The committed comparison report is synchronized with the executable report generator." \
            --acceptance "Focused tests, Diffcipline R1 exact-candidate proof, Alibaba OCR accounting/review, and exact-head Ubuntu/Windows repository CI are recorded before merge." \
            --dependency SG-000016 \
            --risk-level medium \
            --recovery "Revert SG-000017 and its comparison/report artifacts; both independently qualified prototypes remain intact." \
            --context-budget 6000 \
            --context-estimate 3400 \
            --change-surface "packages/product-graph-lab/**" \
            --change-surface "docs/evidence/**" \
            --change-surface "specs/CURRENT.md" \
            --evidence "Executable parity tests across both Product Graph persistence prototypes." \
            --evidence "Deterministic machine-readable comparison report covering all canonical selection criteria." \
            --evidence "Diffcipline R1 exact-candidate PASS plus Alibaba OCR exact-diff accounting/review and exact-head Ubuntu/Windows CI." \
            --minimality-choice new-code \
            --minimality-rationale "Add one compact comparison harness over the two already-qualified prototypes rather than expanding either prototype or selecting production storage prematurely." \
            --safety-status requirements-defined \
            --safety-requirement "Keep representation selection explicitly deferred to IN-P02-S01-T02 and avoid unsupported performance claims." \
            | tee /tmp/shape.txt
          specgrain refine SG-000017 . | tee /tmp/refine.txt
          specgrain grain SG-000017 . | tee /tmp/grain.txt
          specgrain check . | tee /tmp/check.txt
          specgrain next . | tee /tmp/next.txt

      - name: Record shaping evidence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence
          {
            echo "# P02-S01-T01C — SpecGrain Shaping Evidence"
            echo
            echo "**Task:** IN-P02-S01-T01C"
            echo "**SpecGrain:** SG-000017"
            echo "**Date:** 2026-09-21"
            echo "**Canonical baseline:** ee3d06b24bbbafc507608aeb5ec81282e58e327b"
            echo "**SpecGrain source:** TheHalfMoon/SpecGrain@5de7d6499bb0a9e3a191fc0934399cf099d1980a"
            echo "**GitHub Actions run:** ${GITHUB_RUN_ID}"
            echo
            echo "## Tool execution"
            echo
            echo '~~~text'
            cat /tmp/draft.txt /tmp/shape.txt /tmp/refine.txt /tmp/grain.txt /tmp/check.txt /tmp/next.txt
            echo '~~~'
            echo
            echo "The SpecNode was produced by the pinned SpecGrain CLI. No lifecycle or verification state beyond the observed CLI output is claimed."
            echo
            echo "## Decomposition continuation"
            echo
            echo "SG-000016 / IN-P02-S01-T01B is canonically complete through PR #27 and fresh-main CI #162. This Grain completes the prototype-comparison evidence required by IN-P02-S01-T01 while leaving representation selection to IN-P02-S01-T02."
          } > docs/evidence/P02_S01_T01C_SPECGRAIN_SHAPING_2026-09-21.md
          rm .github/workflows/p02-s01-t01c-shape.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(p02): shape Product Graph comparison grain"
          git push origin HEAD:${GITHUB_HEAD_REF}
