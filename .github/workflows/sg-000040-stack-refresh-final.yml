name: sg-000040-stack-refresh-final

on:
  push:
    branches:
      - stack/p03-s01-t01c-durable-run-event
    paths:
      - .github/workflows/sg-000040-stack-refresh-final.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stack branch
        uses: actions/checkout@v4
        with:
          ref: stack/p03-s01-t01c-durable-run-event
          fetch-depth: 0
      - name: Merge exact final SG-000039 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git fetch origin p03/s01-t01b-event-store-implementation
          test "$(git rev-parse origin/p03/s01-t01b-event-store-implementation)" = "54b0ddf358ce8c93c0b8977a8d17e65b4e32b18d"
          git merge --no-ff --no-edit origin/p03/s01-t01b-event-store-implementation
      - name: Remove temporary refresh workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sg-000040-stack-refresh-final.yml
          git add .github/workflows/sg-000040-stack-refresh-final.yml
          git commit -m "chore(stack): remove final SG-000040 refresh"
          git push origin HEAD:stack/p03-s01-t01c-durable-run-event
