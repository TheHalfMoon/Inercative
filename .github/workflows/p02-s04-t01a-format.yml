name: p02-s04-t01a-format

on:
  push:
    branches:
      - p02/s04-t01a-question-gate-core
    paths:
      - .github/workflows/p02-s04-t01a-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter to SG-000031 candidate
        run: |
          pnpm exec prettier --write \
            packages/product-graph/src/question-gate.ts \
            packages/product-graph/src/question-gate.test.ts \
            packages/product-graph/src/index.ts
      - name: Persist formatted candidate without helper workflow
        run: |
          rm .github/workflows/p02-s04-t01a-format.yml
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add packages/product-graph/src .github/workflows/p02-s04-t01a-format.yml
          if git diff --cached --quiet; then
            echo "Formatter produced no changes." >&2
            exit 1
          fi
          git commit -m "style(product-graph): format SG-000031 candidate [formatted]"
          git push origin HEAD:p02/s04-t01a-question-gate-core
