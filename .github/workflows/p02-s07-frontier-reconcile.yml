name: p02-s07-frontier-reconcile

on:
  push:
    branches:
      - p02/s07-t01c-endpoint-shaping
    paths:
      - .github/workflows/p02-s07-frontier-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[frontier-reconciled]') }}
    runs-on: ubuntu-latest
    env:
      EXPECTED_BASE: 76cc78d90189195d70594b628083a5495c05252b
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ancestry and reconcile CURRENT
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          python - <<'PY'
          from pathlib import Path
          p = Path('specs/CURRENT.md')
          s = p.read_text()
          old = '| SG-000035 | IN-P02-S07-T01B | Profile, quality, seed, and synthetic semantic node contracts | GRAIN / SHAPED | `docs/evidence/P02_S07_T01B_SPECGRAIN_SHAPING_2026-09-27.md` |'
          new = '| SG-000035 | IN-P02-S07-T01B | Profile, quality, seed, and synthetic semantic node contracts | MERGED / FRESH_MAIN_PASS / JEV_BLOCKED | `docs/evidence/P02_S07_T01B_POST_MERGE_JEV_STATUS_2026-09-27.md` |\n| SG-000036 | IN-P02-S07-T01C | DataSource and Field relation endpoint contracts | GRAIN / SHAPED | `docs/evidence/P02_S07_T01C_SPECGRAIN_SHAPING_2026-09-27.md` |'
          if old not in s:
              raise SystemExit('expected SG-000035 ledger row not found')
          s = s.replace(old, new, 1)

          old_block = '''SG-000035 / `IN-P02-S07-T01B` is the active shaped unit for DataProfile, DataQualityRule, SeedDataset, and SyntheticDataset metadata contracts. It cannot profile, execute quality rules, generate or insert records, read sources, access secrets/network, call models/providers, mutate persistence, copy production data, or write environments.\n\nA later S07 relation/cross-node Grain remains required before parent `IN-P02-S07-T01` can close.'''
          new_block = '''SG-000035 / `IN-P02-S07-T01B` was implemented through PR #87 and merged as `76cc78d90189195d70594b628083a5495c05252b`; fresh-main CI `36312373576` succeeded. The strengthened Jev directive was then re-tested with pinned Jev CLI `v2026.919.0`: binary installation and SHA-256 verification succeeded, but run `36333537434` proved that neither `JEV_API_KEY` nor `TYPESAFE_API_KEY` is configured in GitHub Actions. Therefore `JEV_SEMANTIC_REVIEW = NOT_RUN / BLOCKED_MISSING_GITHUB_SECRET`; no Jev PASS is claimed.\n\nSG-000036 / `IN-P02-S07-T01C` is shaped for the missing `DataSource` and `Field` metadata endpoint contracts required before canonical S07 relation semantics can be introduced without wildcard or string-reference authority. The first shaping run `36333647889` failed on an unsupported SpecGrain minimality enum and was fixed forward; corrected run `36333743748` succeeded.\n\nAfter SG-000036 implementation, a later S07 relation/cross-node Grain remains required before parent `IN-P02-S07-T01` can close. Any meaningful code-changing merge remains subject to the required Jev gate.'''
          if old_block not in s:
              raise SystemExit('expected P02-S07 active block not found')
          s = s.replace(old_block, new_block, 1)

          old_frontier = '''The active dependency-unlocking unit is:\n\n`SG-000035 / IN-P02-S07-T01B — profile, quality, seed, and synthetic semantic node contracts`\n\nThis is the smallest bounded unit that completes the remaining non-relational V1 dataset node vocabulary. It must extend only the existing deterministic Product Graph domain metadata contract and focused tests. It must not perform profiling, generation, persistence writes, source access, provider/model calls, relation widening, ProductCompleteness work, or P02-S06 endpoint repair.\n\nAfter SG-000035 closes, S07 relation/cross-node semantics remain the next blocker before P02-S08 can become dependency-ready.\n\nP02-S06 remains a separately eligible architecture-repair frontier and must not be bundled into SG-000035.'''
          new_frontier = '''The active dependency-unlocking unit is:\n\n`SG-000036 / IN-P02-S07-T01C — DataSource and Field relation endpoint contracts`\n\nThis is the smallest bounded prerequisite for the remaining S07 relation/cross-node semantics. It must extend only the existing deterministic Product Graph node metadata vocabulary and focused tests. It must not add relations, source access, provider/model calls, persistence mutation, ProductCompleteness work, or P02-S06 endpoint repair.\n\nSG-000035 implementation is already on canonical main with fresh-main CI success, but the strengthened Jev review gate remains externally blocked by a missing GitHub Actions credential. That blocker must remain explicit and cannot be relabeled as PASS.\n\nAfter SG-000036 implementation, the next S07 Grain must add the canonical dataset relation/cross-node semantics before P02-S08 becomes dependency-ready.\n\nP02-S06 remains a separately eligible architecture-repair frontier and must not be bundled into SG-000036.'''
          if old_frontier not in s:
              raise SystemExit('expected dependency frontier block not found')
          s = s.replace(old_frontier, new_frontier, 1)

          old_jev = '- Jev on GitHub-hosted runners: `NOT_RUN / UNAVAILABLE` when the executable/runtime is absent.\n- Jev via the authorized Desktop Commander devices: `NOT_RUN / DEVICE_OFFLINE` in this 2026-09-27 execution window. Never claim Jev PASS without execution evidence.'
          new_jev = '- Jev CLI on GitHub-hosted runners: pinned binary install and checksum verification are now proven, but semantic review is `NOT_RUN / BLOCKED_MISSING_GITHUB_SECRET` until `JEV_API_KEY` or compatible `TYPESAFE_API_KEY` is privately configured.\n- Jev via the authorized Desktop Commander devices: `NOT_RUN / DEVICE_OFFLINE` in this 2026-09-27 execution window. Never claim Jev PASS without execution evidence.'
          if old_jev not in s:
              raise SystemExit('expected Jev truth block not found')
          s = s.replace(old_jev, new_jev, 1)
          p.write_text(s)
          PY

      - name: Persist frontier reconciliation and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p02-s07-frontier-reconcile.yml
          git diff --check
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add specs/CURRENT.md .github/workflows/p02-s07-frontier-reconcile.yml
          git commit -m "docs(frontier): reconcile S07 delivery and Jev blocker [frontier-reconciled]"
          git push origin HEAD:p02/s07-t01c-endpoint-shaping
