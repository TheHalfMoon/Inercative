name: sg-000032-lint-fix

on:
  push:
    branches: [evidence/sg-000032-lint-fix]

permissions:
  contents: write

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply scoped ESLint fixes
        run: >-
          pnpm exec eslint --fix
          packages/product-graph/src/assumption-ledger.ts
          packages/product-graph/src/assumption-ledger.test.ts
          packages/product-graph/src/index.ts

      - name: Reformat scoped files
        run: >-
          pnpm exec prettier --write
          packages/product-graph/src/assumption-ledger.ts
          packages/product-graph/src/assumption-ledger.test.ts
          packages/product-graph/src/index.ts

      - name: Verify scoped lint
        run: >-
          pnpm exec eslint
          packages/product-graph/src/assumption-ledger.ts
          packages/product-graph/src/assumption-ledger.test.ts
          packages/product-graph/src/index.ts

      - name: Commit fixes if needed
        shell: bash
        run: |
          if git diff --quiet -- \
            packages/product-graph/src/assumption-ledger.ts \
            packages/product-graph/src/assumption-ledger.test.ts \
            packages/product-graph/src/index.ts; then
            echo "no auto-fixable lint changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/product-graph/src/assumption-ledger.ts \
            packages/product-graph/src/assumption-ledger.test.ts \
            packages/product-graph/src/index.ts
          git commit -m "chore(lint): normalize SG-000032 candidate"
          git push origin HEAD:${GITHUB_REF_NAME}
