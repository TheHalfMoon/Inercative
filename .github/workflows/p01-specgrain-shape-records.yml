name: P01 SpecGrain one-shot shape protocol records

on:
  push:
    branches:
      - p01/s02-t02-run-event-evidence-finding
    paths:
      - .github/workflows/p01-specgrain-shape-records.yml

permissions:
  contents: write

jobs:
  shape:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SPECGRAIN_SHA: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
      BASELINE_SHA: 1a43dd45ba5dff43e6beee2b111b0dedcd210f9b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact SpecGrain source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps "https://github.com/TheHalfMoon/SpecGrain/archive/${SPECGRAIN_SHA}.zip"
          specgrain --help >/dev/null

      - name: Draft SG-000011
        shell: bash
        run: |
          set -euo pipefail
          specgrain draft .             --title "IN-P01-S02-T02 Implement run event evidence finding schemas"             --outcome "The public protocol exposes dependency-free provider-neutral Run, Event, Evidence, and Finding contracts that bind exact identities/revisions, preserve provenance and freshness, and never infer acceptance from omission."             --rationale "Canonical P01-S02-T02 frontier after SG-000010 identity/revision primitives."             --json | tee /tmp/draft.json
          test "$(python -c 'import json; print(json.load(open("/tmp/draft.json"))["spec_id"])')" = "SG-000011"

      - name: Shape SG-000011
        shell: bash
        run: |
          set -euo pipefail
          specgrain shape SG-000011 .             --scope-in "Define public provider-neutral Run identity/state records bound to existing logical identity and exact revision primitives."             --scope-in "Define append-oriented Event records with explicit event identity, run identity, sequence, kind, source, and immutable target revision where applicable."             --scope-in "Define Evidence records with producer/source identity, exact target identity/revision, evidence kind, observation status, and artifact/reference provenance."             --scope-in "Define Finding records with category, severity, confidence, location/reference, evidence links, requirement/policy mapping, status, disposition, and stale/superseded semantics."             --scope-in "Provide deterministic validators/parsers, JSON Schemas, public exports, and negative fixtures for malformed references, invalid states, stale evidence, and unresolved material findings."             --scope-out "No ModelTask or DecisionTask contracts."             --scope-out "No CapabilityRequest or CapabilityGrant contracts."             --scope-out "No persistence, database, authorization, runtime executor, timestamp clock source, provider-specific finding type, or acceptance/PASS oracle."             --scope-out "Do not export the private P00 OCR-specific evidence validator as part of the public provider-neutral protocol."             --acceptance "Run/Event/Evidence/Finding values round-trip through canonical public contracts and reuse SG-000010 identity/revision primitives rather than introducing parallel IDs."             --acceptance "Events are explicitly bound to a run and deterministic sequence; malformed or negative ordering fields fail validation."             --acceptance "Evidence distinguishes observation status and exact target revision; missing evidence cannot be represented as PASS."             --acceptance "Findings preserve severity/confidence/status/disposition separately and unresolved or blocking status is explicit rather than inferred."             --acceptance "Freshness is explicit: evidence/findings can be CURRENT, STALE, or SUPERSEDED without silently rewriting historical records."             --acceptance "JSON Schema and TypeScript validators remain semantically aligned for acceptance-critical constraints."             --acceptance "Package remains dependency-free and exact-head Ubuntu/Windows CI passes."             --dependency SG-000010             --risk-level medium             --recovery "Revert SG-000011 public Run/Event/Evidence/Finding exports, schemas, tests, docs, and evidence; no persistence migration or external side effect is authorized."             --context-budget 12000             --context-estimate 6500             --change-surface "packages/protocol/**"             --change-surface "docs/canonical/**"             --change-surface "docs/evidence/**"             --change-surface "specs/CURRENT.md"             --evidence "Focused protocol tests for valid round-trip plus malformed identity/revision/state/freshness/finding negative fixtures."             --evidence "JSON Schema/TypeScript validator parity checks and manifest proof of zero runtime dependencies."             --evidence "Exact-head Ubuntu and Windows repository CI."             --minimality-choice new-code             --minimality-rationale "Extend the existing dependency-free @ineractive/protocol package with only the dependency-ordered public records required before the workspace shell."             --safety-status requirements-defined             --safety-requirement "No Evidence or Finding state may grant acceptance merely because required evidence is absent."             --safety-requirement "Provider-specific review payloads remain adapters/private records and do not leak into the public provider-neutral protocol."             --json | tee /tmp/shape.json

      - name: Refine and promote
        shell: bash
        run: |
          set -euo pipefail
          specgrain refine SG-000011 . --json | tee /tmp/refine.json
          specgrain check . --json | tee /tmp/check-refining.json
          specgrain grain SG-000011 . --json | tee /tmp/grain.json
          specgrain check . --json | tee /tmp/check-grain.json
          specgrain next . --json | tee /tmp/next.json

      - name: Assert known lifecycle boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          data=json.load(open("/tmp/next.json",encoding="utf-8"))
          candidate=next(item for item in data["candidates"] if item["node_id"]=="SG-000011")
          if candidate["waiting_on"] != ["SG-000010"]:
              raise SystemExit("unexpected waiting_on: " + repr(candidate["waiting_on"]))
          PY

      - name: Record shaping evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .specgrain/tmp/pregrain-mutation.lock
          mkdir -p docs/evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          def load(name): return json.loads(Path("/tmp/"+name).read_text(encoding="utf-8"))
          draft=load("draft.json"); shape=load("shape.json"); refine=load("refine.json")
          grain=load("grain.json"); check=load("check-grain.json"); nxt=load("next.json")
          candidate=next(item for item in nxt["candidates"] if item["node_id"]=="SG-000011")
          lines=[
            "# P01-S02-T02 — SpecGrain Shaping Evidence","",
            "Task: IN-P01-S02-T02","SpecGrain: SG-000011","Date: 2026-09-20",
            "Canonical baseline: "+os.environ["BASELINE_SHA"],
            "SpecGrain source: TheHalfMoon/SpecGrain@"+os.environ["SPECGRAIN_SHA"],
            "GitHub Actions run: "+os.environ["GITHUB_RUN_ID"],"",
            "## Tool execution","",
            "- draft state: "+draft["state"],
            "- shaped revision: "+shape["revision_digest"],
            "- refine state: "+refine["state"],
            "- grain state: "+grain["state"],
            "- final revision: "+grain["revision_digest"],
            "- project check valid: "+str(check["valid"]).lower(),
            "- next waiting_on: "+",".join(candidate["waiting_on"]),"",
            "The SpecNode was produced by the real pinned SpecGrain CLI; it was not hand-authored.","",
            "## Lifecycle boundary","",
            "Repository delivery truth records SG-000010 DONE through PR #17 and fresh-main CI #117.",
            "SpecGrain next still waits on SG-000010 because the current CLI does not expose completion transitions.",
            "No READY, VERIFIED, CONTROLLED, or WorkPacket state is fabricated.",""
          ]
          Path("docs/evidence/P01_S02_T02_SPECGRAIN_SHAPING_2026-09-20.md").write_text("\n".join(lines),encoding="utf-8")
          PY

      - name: Commit tool-produced state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
            ".specgrain/specs/SG-000011.json",
            "docs/evidence/P01_S02_T02_SPECGRAIN_SHAPING_2026-09-20.md",
          }
          output=subprocess.check_output(["git","status","--porcelain=v1"],text=True)
          changed={line[3:] for line in output.splitlines() if line}
          if changed != allowed:
              raise SystemExit("unexpected changed paths="+repr(sorted(changed))+"; expected="+repr(sorted(allowed)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .specgrain/specs/SG-000011.json docs/evidence/P01_S02_T02_SPECGRAIN_SHAPING_2026-09-20.md
          git commit -m "chore(p01): shape run event evidence finding grain"
          git push origin "HEAD:${GITHUB_REF_NAME}"
