name: p02-s03-t01b-closure-reconcile

on:
  push:
    branches:
      - p02/s03-t01b-closure
    paths:
      - .github/workflows/p02-s03-t01b-closure-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[reconciled]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile canonical frontier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('specs/CURRENT.md')
          s = p.read_text()
          old_row = "| SG-000027 | IN-P02-S03-T01A | Change Intent and proposed graph delta core | DONE (PR #66) | `docs/evidence/P02_S03_T01A_CLOSURE_2026-09-24.md` |\n"
          new_rows = old_row + "| SG-000028 | IN-P02-S03-T01B | Ordered edge/remove/multi-operation Change Intent semantics | DONE (PR #69) | `docs/evidence/P02_S03_T01B_CLOSURE_2026-09-26.md` |\n" + "| SG-000029 | IN-P02-S06-T01A | Semantic reference node contracts | GRAIN / SHAPED (PR #70) | `docs/evidence/P02_S06_T01A_SPECGRAIN_SHAPING_2026-09-26.md` |\n"
          if old_row not in s:
              raise SystemExit('SG-000027 frontier row not found exactly')
          if '| SG-000028 |' not in s:
              s = s.replace(old_row, new_rows, 1)
          old_next = """Next in dependency order:\n\n1. **IN-P02-S03-T01A is complete** through SG-000027 and PR #66. The full `IN-P02-S03-T01` handle remains open for richer graph-operation proposal semantics.\n2. The next eligible action is to shape a bounded dependent Grain under `IN-P02-S03-T01` for edge/remove/multi-operation behavior before implementation authority.\n3. IN-P02-S06-T01, IN-P02-S07-T01, and IN-P02-S08-T01 remain dependency-eligible but require their own SpecGrain shaping.\n4. IN-P02-S04-T01 remains blocked behind the full IN-P02-S03-T01 handle, and IN-P02-S05-T01 behind IN-P02-S04-T01.\n"""
          new_next = """Next in dependency order:\n\n1. **IN-P02-S03-T01A and IN-P02-S03-T01B are complete** through SG-000027/PR #66 and SG-000028/PR #69. The full `IN-P02-S03-T01` handle remains open because both delivered slices intentionally start from already-typed Change Intent input, while the canonical S03 outcome begins from a user request and requires uncertainty/confidence/provenance.\n2. The next required S03 action is to shape `IN-P02-S03-T01C`: a bounded provider-neutral typed user-request / intent-interpretation boundary that feeds the deterministic Change Intent compiler without introducing P03 model/provider routing.\n3. **SG-000029 / IN-P02-S06-T01A is canonically shaped through PR #70** and is independently implementation-ready for semantic reference node contracts. Later S06 relation semantics remain outside SG-000029.\n4. IN-P02-S07-T01 and IN-P02-S08-T01 remain dependency-eligible but require their own SpecGrain shaping.\n5. IN-P02-S04-T01 remains blocked behind the full IN-P02-S03-T01 handle, and IN-P02-S05-T01 behind IN-P02-S04-T01.\n"""
          if old_next not in s:
              raise SystemExit('old dependency-order block not found exactly')
          s = s.replace(old_next, new_next, 1)
          p.write_text(s)
          PY
          rm .github/workflows/p02-s03-t01b-closure-reconcile.yml
          git diff --check
          git diff -- specs/CURRENT.md
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add specs/CURRENT.md .github/workflows/p02-s03-t01b-closure-reconcile.yml
          git commit -m "docs(frontier): close SG-000028 and expose T01C [reconciled]"
          git push origin HEAD:p02/s03-t01b-closure
