name: p02-s05-t01a-shaping

on:
  push:
    branches:
      - p02/s04-t01b-closeout
    paths:
      - .github/workflows/p02-s05-t01a-shaping.yml

permissions:
  contents: write

jobs:
  shape:
    if: ${{ !contains(github.event.head_commit.message, '[shaped]') }}
    runs-on: ubuntu-latest
    env:
      CANONICAL_BASE: 67fe1fac6a7f0b52b08f12fbf3c120f609b0a99e
      SPEC_GRAIN_SOURCE: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
    steps:
      - name: Checkout shaping branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical ancestry
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$CANONICAL_BASE^{commit}"
          test "$(git merge-base "$CANONICAL_BASE" HEAD)" = "$CANONICAL_BASE"

      - name: Install exact SpecGrain source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps "https://github.com/TheHalfMoon/SpecGrain/archive/${SPEC_GRAIN_SOURCE}.zip"
          specgrain --help >/dev/null

      - name: Draft with native SpecGrain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _shaping
          specgrain draft . \
            --title "IN-P02-S05-T01A deterministic Product Graph user-view projections" \
            --outcome "A canonical Product Graph revision can be deterministically projected into bounded human-inspectable Data, Roles, Pages, Workflows, and Assumptions view models with stable ordering, provenance-preserving identities, and no mutation or runtime authority." \
            --rationale "SG-000031 and SG-000032 complete the Question Gate and Assumption Ledger parent, unlocking P02-S05. The smallest useful S05 slice is a provider-neutral read-only projection layer over existing canonical graph/assumption state; interactive UI editing and later designer/developer surfaces remain downstream." \
            --json | tee _shaping/draft.json
          SPEC_ID="$(python -c 'import json; print(json.load(open("_shaping/draft.json"))["spec_id"])')"
          test "$SPEC_ID" = "SG-000033"
          echo "SPEC_ID=$SPEC_ID" >> "$GITHUB_ENV"

      - name: Shape bounded Grain
        shell: bash
        run: |
          set -euo pipefail
          specgrain shape "$SPEC_ID" . \
            --scope-in "Define a closed ProductGraphUserViewsV1 read-only projection contract for the canonical P02-S05 view families: Data, Roles, Pages, Workflows, and Assumptions." \
            --scope-in "Project existing validated Product Graph node/edge semantics into stable view items that preserve semantic node identity, kind/status/name/provenance where available, and only the bounded relationship summaries needed for inspection." \
            --scope-in "Project Assumption Ledger state into inspectable assumption rows with inferred/confirmed/corrected/superseded status, effective statement, immutable origin identity, replacement identity when present, and deterministic invalidation-reference summaries." \
            --scope-in "Canonicalize every view with deterministic ordering and explicit empty collections so equivalent validated input produces byte-equivalent semantic projection output and a stable projection identity." \
            --scope-in "Add focused tests covering all five view families, empty/mixed graphs, stable ordering/identity, assumption lifecycle states, malformed or stale inputs, duplicate/reference handling, provenance preservation, and caller-input immutability." \
            --scope-out "No React/UI components, visual styling, browser interaction, editable inspector, graph mutation, source/Git mutation, persistence/database writes, or live provider/model calls." \
            --scope-out "No capability/security authorization, role enforcement, RLS generation, deployment/publication, billing, credentials, external effects, or automatic invalidation/rerun behavior." \
            --scope-out "No new Product Graph node/edge semantics, P02-S06 relation vocabulary, P02-S07 dataset semantics, P02-S08 completeness semantics, or P03 context/model routing." \
            --scope-out "No attempt to infer missing product semantics; projections expose only validated canonical state and explicit assumption state." \
            --acceptance "The projection contract is closed, bounded, provider-neutral, deterministic, and fails closed on malformed/unvalidated input rather than inventing missing semantics." \
            --acceptance "Data, Roles, Pages, Workflows, and Assumptions projections expose stable semantic identities with deterministic ordering and explicit empty collections." \
            --acceptance "Assumption rows preserve immutable origin identity and accurately represent inferred/confirmed/corrected/superseded state plus replacement/invalidation-reference summaries without executing any invalidation effect." \
            --acceptance "Focused tests prove all five view families, empty and mixed inputs, stable projection identity/order, lifecycle variants, provenance preservation, malformed input rejection, and caller-input immutability." \
            --acceptance "The exact implementation candidate later passes full repository format/lint/typecheck/tests, Diffcipline R2, Alibaba OCR review/accounting where applicable, Jev where available, exact-head CI, and fresh-main CI before closure." \
            --dependency SG-000032 \
            --risk-level medium \
            --recovery "Revert the Product Graph user-view projection module, exports, tests, and evidence. P02-S04 remains closed and IN-P02-S05-T01 returns to not-yet-delivered without affecting graph persistence or semantics." \
            --context-budget 8000 \
            --context-estimate 5800 \
            --change-surface "packages/product-graph/src/user-views.ts" \
            --change-surface "packages/product-graph/src/user-views.test.ts" \
            --change-surface "packages/product-graph/src/index.ts" \
            --change-surface "docs/evidence/**" \
            --change-surface "specs/CURRENT.md" \
            --evidence "Exact base/head/merge-base and changed-file accounting." \
            --evidence "Focused deterministic user-view projection tests plus full repository gates." \
            --evidence "Diffcipline exact-candidate proof, Alibaba OCR accounting/delegated review where applicable, Jev where available, exact-head CI, and post-merge fresh-main CI." \
            --minimality-choice new-code \
            --minimality-rationale "The canonical graph and assumption contracts exist, but there is no user-view projection layer. A single bounded read-only projection module can reuse those contracts without adding UI, persistence, or new graph semantics." \
            --safety-status requirements-defined \
            --safety-requirement "User-view projections are read-only evidence surfaces and never capability, security, billing, publication, deployment, or external-effect authority." \
            --safety-requirement "Projection code must not infer or silently synthesize missing Product Graph semantics; malformed or stale input fails closed." \
            --safety-requirement "Assumption invalidation references remain inspectable data only and never delete, mutate, cancel, or rerun downstream work." \
            --json | tee _shaping/shape.json
          specgrain refine "$SPEC_ID" . --json | tee _shaping/refine.json
          specgrain grain "$SPEC_ID" . --json | tee _shaping/grain.json
          specgrain check . --json | tee _shaping/check.json

      - name: Record SG-000032 closure and SG-000033 shaping
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/evidence/P02_S04_T01B_CLOSURE_2026-09-27.md <<'EOF'
          # P02-S04-T01B closure — SG-000032

          **Task:** `IN-P02-S04-T01B` — assumption lifecycle and invalidation ledger  
          **SpecGrain:** `SG-000032`  
          **Date:** 2026-09-27  
          **Status:** canonically complete through PR #80

          ## Canonical identities

          - implementation base: `7a7f593740c8ab7e569fe79637a284bf2b300f32`
          - exact qualified candidate: `34ce66274ce81026c531281a5531a2061a717724`
          - implementation merge: `67fe1fac6a7f0b52b08f12fbf3c120f609b0a99e`
          - exact-head CI: `36294347297` / #316 — SUCCESS on Ubuntu and Windows
          - exact-candidate qualification: `36294409207` — SUCCESS
          - post-merge fresh-main CI: `36294551847` / #317 — SUCCESS on Ubuntu and Windows

          ## Delivered contract

          SG-000032 adds a closed `AssumptionLedgerEventInputV1` and deterministic `confirm / correct / supersede` replay over the immutable `AssumptionRecordV1` origin. It revalidates canonical origin identity, rejects stale assumption identities and invalid lifecycle transitions, canonicalizes bounded dependent-work/evidence references, and emits stable event, invalidation-manifest, and ledger-revision identities.

          Correction and supersession invalidation manifests are reference-only evidence. They never delete, mutate, cancel, or rerun downstream work and never grant capability, security, billing, publication, deployment, or external-effect authority. Explicit empty invalidation-reference sets remain deterministic and test-covered.

          ## Qualification

          The exact implementation candidate changed three files at `+599/-0`, within the configured R2 hard cap. It passed full Ubuntu/Windows CI, checksum-verified Diffcipline v1.0.0 R2, checksum-verified Alibaba Open Code Review v1.12.7 deterministic delegation accounting/rule resolution, and exact-head host semantic review with zero unresolved material findings.

          Qualification artifact: `sg-000032-exact-candidate-qualification`, artifact ID `10922958254`, digest `sha256:29859b6cfa1f53a3fe960aff2cf70725f5ec71fc0b2cf6ee08a8e6ac1b34baa7`.

          Jev was `NOT_RUN / UNAVAILABLE` on the GitHub-hosted qualification runner. No hosted OCR LLM PASS is claimed. Generic bot summaries are not qualification evidence.

          ## Preserved negative evidence

          Earlier candidate identities exposed Diffcipline size, TypeScript, and lint failures. Competing PR #81 exact head `def79874e0ebfa69eec73764e24329fa2ea08362` failed Ubuntu/Windows lint in CI `36263621158` and was closed unmerged as superseded. All repairs were forward-only; no threshold or acceptance criterion was weakened.

          ## Parent closure

          SG-000031 supplies deterministic Question Gate policy plus immutable inferred `AssumptionRecordV1`. SG-000032 supplies deterministic confirmation/correction/supersession and reference-only invalidation evidence. Together they satisfy the full canonical `IN-P02-S04-T01 — Implement Question Gate and Assumption Ledger` outcome.

          `SG-000032 = DONE / CLOSED_CANONICAL`

          `IN-P02-S04-T01 = DONE / CLOSED_CANONICAL`

          This unlocks `IN-P02-S05-T01 — Build Product Graph user views`.
          EOF

          cat > docs/evidence/P02_S05_T01A_SPECGRAIN_SHAPING_2026-09-27.md <<EOF
          # P02-S05-T01A SpecGrain shaping evidence — 2026-09-27

          **Task:** \`IN-P02-S05-T01A\` — deterministic Product Graph user-view projections  
          **SpecGrain:** \`SG-000033\`  
          **Canonical shaping base:** \`${CANONICAL_BASE}\`  
          **SpecGrain source:** \`TheHalfMoon/SpecGrain@${SPEC_GRAIN_SOURCE}\`  
          **Native shaping run:** \`${GITHUB_RUN_ID}\`

          ## Eligibility

          SG-000032 merged as \`${CANONICAL_BASE}\` through PR #80 and fresh-main CI \`36294551847\` / #317 completed SUCCESS on Ubuntu and Windows. SG-000031 + SG-000032 therefore close parent \`IN-P02-S04-T01\` and unlock \`IN-P02-S05-T01\`.

          ## Bounded outcome

          SG-000033 owns only deterministic read-only projection contracts for the canonical P02-S05 view families: Data, Roles, Pages, Workflows, and Assumptions. It does not add UI components, new graph semantics, persistence, authority, or external effects.

          ## Native SpecGrain execution

          This temporary workflow installs exact SpecGrain source \`${SPEC_GRAIN_SOURCE}\` and executes \`draft -> shape -> refine -> grain -> check\`. It removes itself before persisting the final shaping candidate.

          ## Safety boundary

          User-view projections expose validated canonical state only. They cannot invent missing product semantics, enforce authorization, grant capability authority, or execute Assumption Ledger invalidation references.
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path('specs/CURRENT.md')
          s = p.read_text()
          s = s.replace('**Date:** 2026-09-26', '**Date:** 2026-09-27', 1)
          old_row = '| SG-000032 | IN-P02-S04-T01B | Assumption lifecycle and invalidation ledger | GRAIN / SHAPED | `docs/evidence/P02_S04_T01B_SPECGRAIN_SHAPING_2026-09-26.md` |'
          new_rows = '| SG-000032 | IN-P02-S04-T01B | Assumption lifecycle and invalidation ledger | DONE (PR #80) | `docs/evidence/P02_S04_T01B_CLOSURE_2026-09-27.md` |\n| SG-000033 | IN-P02-S05-T01A | Deterministic Product Graph user-view projections | GRAIN / SHAPED | `docs/evidence/P02_S05_T01A_SPECGRAIN_SHAPING_2026-09-27.md` |'
          if old_row not in s:
              raise SystemExit('CURRENT SG-000032 ledger row missing')
          s = s.replace(old_row, new_rows, 1)

          start = s.index('### P02-S04\n')
          end = s.index('### P02-S06\n')
          replacement = '''### P02-S04\n\nComplete.\n\nThe parent `IN-P02-S04-T01 — Implement Question Gate and Assumption Ledger` is satisfied by the bounded chain:\n\n1. SG-000031 / `IN-P02-S04-T01A` — deterministic Question Gate core plus immutable inferred `AssumptionRecordV1`;\n2. SG-000032 / `IN-P02-S04-T01B` — deterministic confirm/correct/supersede lifecycle plus reference-only invalidation manifests.\n\nSG-000032 exact candidate `34ce66274ce81026c531281a5531a2061a717724` passed exact-head CI `36294347297`, checksum-verified Diffcipline/OCR qualification `36294409207`, merged normally through PR #80 as `67fe1fac6a7f0b52b08f12fbf3c120f609b0a99e`, and fresh-main CI `36294551847` passed on Ubuntu and Windows.\n\n### P02-S05\n\nIn progress. SG-000033 / `IN-P02-S05-T01A` is the active shaped first slice for deterministic read-only Data, Roles, Pages, Workflows, and Assumptions projections over canonical Product Graph / Assumption Ledger state. No UI mutation, persistence, new graph semantics, provider call, or runtime authority belongs in this Grain.\n\n'''
          s = s[:start] + replacement + s[end:]

          start = s.index('## Current dependency-unlocking frontier')
          end = s.index('## Truthfully not run')
          frontier = '''## Current dependency-unlocking frontier\n\nThe active dependency-unlocking unit is:\n\n`SG-000033 / IN-P02-S05-T01A — deterministic Product Graph user-view projections`\n\nP02-S04 is closed canonically after SG-000031 + SG-000032. SG-000033 is the smallest provider-neutral read-only slice of `IN-P02-S05-T01`, covering Data, Roles, Pages, Workflows, and Assumptions projection contracts with deterministic ordering and provenance-preserving semantic identity.\n\nIt must not add UI mutation, new graph semantics, persistence, authorization enforcement, provider/model calls, or external effects. If the full P02-S05 user-facing outcome still requires a later interactive presentation slice after SG-000033, shape that remainder separately rather than widening this Grain.\n\nParallel P02-S06 relation vocabulary and P02-S07 dataset semantics remain separately eligible and must not be bundled into SG-000033.\n\n'''
          s = s[:start] + frontier + s[end:]
          p.write_text(s)
          PY

      - name: Persist closure and native SpecGrain state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p02-s05-t01a-shaping.yml
          git status --short
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add .specgrain docs/evidence specs/CURRENT.md .github/workflows/p02-s05-t01a-shaping.yml
          git commit -m "spec(p02): close assumption ledger and shape graph views [shaped]"
          git push origin HEAD:p02/s04-t01b-closeout
