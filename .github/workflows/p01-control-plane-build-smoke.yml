name: P01 one-shot control-plane build smoke

on:
  push:
    branches:
      - p01/s05-t01-control-plane-store
    paths:
      - .github/workflows/p01-control-plane-build-smoke.yml

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.4.2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build control plane
        run: pnpm --filter @ineractive/control-plane build

      - name: Smoke standalone control plane
        run: pnpm --filter @ineractive/control-plane smoke

      - name: Record candidate head
        if: always()
        shell: bash
        run: |
          echo "candidate_head=${{ github.sha }}"
          git rev-parse HEAD
