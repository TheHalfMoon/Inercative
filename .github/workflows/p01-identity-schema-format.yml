name: P01 one-shot identity schema format repair

on:
  push:
    branches:
      - p01/s02-t01-protocol-identity-revisions
    paths:
      - .github/workflows/p01-identity-schema-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format reconciled files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write             packages/protocol/schema/identity-revision.schema.json             packages/protocol/src/identity-revision.test.ts
          pnpm exec prettier --check             packages/protocol/schema/identity-revision.schema.json             packages/protocol/src/identity-revision.test.ts
          git diff --check
      - name: Commit format repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p01-identity-schema-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/protocol/schema/identity-revision.schema.json             packages/protocol/src/identity-revision.test.ts
          git commit -m "style(p01): format identity revision schema"
          git push origin "HEAD:${GITHUB_REF_NAME}"
