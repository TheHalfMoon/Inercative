name: P01 SpecGrain one-shot framework qualification shape

on:
  push:
    branches:
      - p01/s01-t01-control-plane-framework
    paths:
      - .github/workflows/p01-specgrain-framework-shape.yml

permissions:
  contents: write

jobs:
  shape:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SPECGRAIN_SHA: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
      BASELINE_SHA: a83b9ecca9c49372bed031f6de21e6c03523c07b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact SpecGrain source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps "https://github.com/TheHalfMoon/SpecGrain/archive/${SPECGRAIN_SHA}.zip"
          specgrain --help >/dev/null

      - name: Draft SG-000009
        shell: bash
        run: |
          set -euo pipefail
          specgrain draft .             --title "IN-P01-S01-T01 Qualify control-plane framework"             --outcome "Select and prove the production React framework baseline for the Ineractive control plane using current official-source evidence and a reproducible build/self-host smoke, without prematurely building the product shell."             --rationale "First P01 task after canonical P00 exit; downstream protocol and workspace work depends on a qualified framework baseline."             --json | tee /tmp/draft.json
          test "$(python -c 'import json; print(json.load(open("/tmp/draft.json"))["spec_id"])')" = "SG-000009"

      - name: Shape SG-000009
        shell: bash
        run: |
          set -euo pipefail
          specgrain shape SG-000009 .             --scope-in "Compare current production-grade React control-plane framework candidates using official-source version and capability evidence."             --scope-in "Evaluate Next.js App Router, React Router framework mode, and TanStack Start against Ineractive control-plane requirements."             --scope-in "Select one control-plane framework and record an ADR with explicit tradeoffs and rejected alternatives."             --scope-in "Create a bounded qualification fixture for the selected exact framework/React versions."             --scope-in "Execute deterministic build and self-host HTTP smoke evidence on the repository Node baseline."             --scope-out "Do not build the real project/workspace shell; that remains IN-P01-S03-T01."             --scope-out "Do not change the generated-app compiler target merely because the control plane selects a framework."             --scope-out "Do not add Vercel-only or provider-only deployment assumptions."             --acceptance "Candidate comparison is dated and binds official source/release identities, licenses, Node/React compatibility, and material operational tradeoffs."             --acceptance "The ADR selects one framework based on React 19 support, Node 24 compatibility, server/client boundaries, data/routing model, self-host portability, observability/tooling, security support, and repository alignment."             --acceptance "The selected exact framework version and React version produce a clean production build in a bounded qualification fixture."             --acceptance "The built candidate self-hosts on Node 24 and an HTTP request returns a deterministic expected marker."             --acceptance "No P01-S03 product shell or application feature is introduced."             --acceptance "Exact-head Ubuntu and Windows repository CI pass."             --dependency SG-000001             --dependency SG-000003             --dependency SG-000007             --dependency SG-000008             --risk-level medium             --recovery "Revert SG-000009, the qualification ADR/fixture/evidence, and selected-framework metadata; no external production side effect is authorized."             --context-budget 11000             --context-estimate 6000             --change-surface "docs/adr/**"             --change-surface "docs/evidence/**"             --change-surface "docs/canonical/**"             --change-surface "qualifications/control-plane-framework/**"             --change-surface "specs/CURRENT.md"             --evidence "Official-source framework comparison with exact observed versions/revisions."             --evidence "Selected-candidate production build and self-host HTTP smoke on Node 24."             --evidence "ADR with explicit decision criteria, tradeoffs, and rejected alternatives."             --evidence "Exact-head Ubuntu and Windows repository CI."             --minimality-choice new-code             --minimality-rationale "Use a disposable qualification fixture instead of introducing the real control-plane application before its dependency-ordered shell task."             --safety-status requirements-defined             --safety-requirement "Qualification fixture must not contain secrets, production endpoints, billing calls, or remote provisioning."             --safety-requirement "A framework marketing claim or prior planning preference is not acceptance evidence."             --json | tee /tmp/shape.json

      - name: Refine and promote SG-000009
        shell: bash
        run: |
          set -euo pipefail
          specgrain refine SG-000009 . --json | tee /tmp/refine.json
          specgrain check . --json | tee /tmp/check-refining.json
          specgrain grain SG-000009 . --json | tee /tmp/grain.json
          specgrain check . --json | tee /tmp/check-grain.json
          specgrain next . --json | tee /tmp/next.json

      - name: Record shaping evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .specgrain/tmp/pregrain-mutation.lock
          mkdir -p docs/evidence
          python - <<'PY'
          import json, os
          from pathlib import Path

          def load(name):
              return json.loads(Path("/tmp/" + name).read_text(encoding="utf-8"))

          draft=load("draft.json")
          shape=load("shape.json")
          refine=load("refine.json")
          grain=load("grain.json")
          check=load("check-grain.json")
          nxt=load("next.json")
          candidate=next(item for item in nxt["candidates"] if item["node_id"]=="SG-000009")

          lines=[
              "# P01-S01-T01 — SpecGrain Shaping Evidence",
              "",
              "Task: IN-P01-S01-T01",
              "SpecGrain: SG-000009",
              "Date: 2026-09-20",
              "Canonical baseline: " + os.environ["BASELINE_SHA"],
              "SpecGrain source: TheHalfMoon/SpecGrain@" + os.environ["SPECGRAIN_SHA"],
              "GitHub Actions run: " + os.environ["GITHUB_RUN_ID"],
              "",
              "## Tool execution",
              "",
              "- draft state: " + draft["state"],
              "- shaped revision: " + shape["revision_digest"],
              "- refine state: " + refine["state"],
              "- grain state: " + grain["state"],
              "- final revision: " + grain["revision_digest"],
              "- project check valid: " + str(check["valid"]).lower(),
              "- next eligible: " + str(candidate["eligible"]).lower(),
              "- next waiting_on: " + ",".join(candidate["waiting_on"]),
              "",
              "The SpecNode was produced by the real pinned SpecGrain CLI; it was not hand-authored.",
              "",
              "## Lifecycle boundary",
              "",
              "P00 dependencies are canonically delivered in Git/evidence, but the current SpecGrain CLI",
              "does not expose VERIFIED/CONTROLLED transitions for them. Any waiting_on result caused by",
              "that lifecycle gap is recorded rather than bypassed with fabricated states.",
              "",
          ]
          Path("docs/evidence/P01_S01_T01_SPECGRAIN_SHAPING_2026-09-20.md").write_text("\n".join(lines),encoding="utf-8")
          PY

      - name: Commit tool-produced state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
            ".specgrain/specs/SG-000009.json",
            "docs/evidence/P01_S01_T01_SPECGRAIN_SHAPING_2026-09-20.md",
          }
          output=subprocess.check_output(["git","status","--porcelain=v1"],text=True)
          changed={line[3:] for line in output.splitlines() if line}
          if changed != allowed:
              raise SystemExit("unexpected changed paths=" + repr(sorted(changed)) + "; expected=" + repr(sorted(allowed)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .specgrain/specs/SG-000009.json docs/evidence/P01_S01_T01_SPECGRAIN_SHAPING_2026-09-20.md
          git commit -m "chore(p01): shape control-plane framework qualification"
          git push origin "HEAD:${GITHUB_REF_NAME}"
