name: P01 one-shot workspace shell qualification
# repair: React 19.3 type packages required by Next.js TypeScript build

on:
  push:
    branches:
      - p01/s03-workspace-shell
    paths:
      - .github/workflows/p01-workspace-shell-qualify.yml

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BASELINE_SHA: 9ec10a179ee93e0e4279d806ecb48922e66f06ec
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Refresh workspace lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          git diff --check

      - name: Frozen install from refreshed lockfile
        run: pnpm install --frozen-lockfile

      - name: Format candidate files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write             packages/control-plane             docs/evidence/P01_S03_T01_WORKSPACE_SHELL_2026-09-20.md             specs/CURRENT.md
          pnpm exec prettier --check             packages/control-plane             docs/evidence/P01_S03_T01_WORKSPACE_SHELL_2026-09-20.md             specs/CURRENT.md
          git diff --check

      - name: Focused shell state tests
        run: pnpm exec vitest run packages/control-plane/src/shell-state.test.ts

      - name: Control-plane typecheck
        run: pnpm --filter @ineractive/control-plane run typecheck

      - name: Production standalone build
        run: pnpm --filter @ineractive/control-plane run build

      - name: Standalone HTTP smoke
        run: pnpm --filter @ineractive/control-plane run smoke

      - name: Record qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(node --version)"
          pnpm_version="$(pnpm --version)"
          next_version="$(pnpm --filter @ineractive/control-plane exec next --version)"
          export NODE_VERSION_CAPTURE="$node_version"
          export PNPM_VERSION_CAPTURE="$pnpm_version"
          export NEXT_VERSION_CAPTURE="$next_version"
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("docs/evidence/P01_S03_T01_WORKSPACE_SHELL_2026-09-20.md")
          block = [
              "",
              "## Executed qualification",
              "",
              "GitHub Actions run: `" + os.environ["GITHUB_RUN_ID"] + "`",
              "",
              "- baseline: `" + os.environ["BASELINE_SHA"] + "`",
              "- Node: `" + os.environ["NODE_VERSION_CAPTURE"] + "`",
              "- pnpm: `" + os.environ["PNPM_VERSION_CAPTURE"] + "`",
              "- Next.js: `" + os.environ["NEXT_VERSION_CAPTURE"] + "`",
              "- refreshed root workspace lockfile: EXECUTED",
              "- frozen install from refreshed lockfile: PASS",
              "- focused shell-state tests: PASS",
              "- control-plane typecheck: PASS",
              "- production standalone build: PASS",
              "- real standalone HTTP smoke: PASS",
              "- observed marker: `INERACTIVE_WORKSPACE_SHELL_READY`",
              "",
              "This qualification is branch evidence. Final acceptance still requires exact-head Ubuntu",
              "and Windows repository CI after the one-shot workflow is removed.",
              "",
          ]
          path.write_text(path.read_text(encoding="utf-8") + "\n".join(block), encoding="utf-8")
          PY

      - name: Assert bounded changed paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          output=subprocess.check_output(["git","status","--porcelain=v1"],text=True)
          changed={line[3:] for line in output.splitlines() if line}
          allowed_prefixes=("packages/control-plane/",)
          allowed_exact={
            "pnpm-lock.yaml",
            "docs/evidence/P01_S03_T01_WORKSPACE_SHELL_2026-09-20.md",
            "specs/CURRENT.md",
            ".github/workflows/p01-workspace-shell-qualify.yml",
          }
          unexpected=sorted(
            path for path in changed
            if path not in allowed_exact and not path.startswith(allowed_prefixes)
          )
          if unexpected:
            raise SystemExit("unexpected changed paths="+repr(unexpected))
          print("changed paths="+repr(sorted(changed)))
          PY

      - name: Commit qualification output and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p01-workspace-shell-qualify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/control-plane pnpm-lock.yaml             docs/evidence/P01_S03_T01_WORKSPACE_SHELL_2026-09-20.md             specs/CURRENT.md
          git commit -m "test(p01): qualify workspace shell"
          git push origin "HEAD:${GITHUB_REF_NAME}"
