name: P01 one-shot framework qualification bootstrap

on:
  push:
    branches:
      - p01/s01-t01-control-plane-framework
    paths:
      - .github/workflows/p01-framework-qualification-bootstrap.yml

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install repository formatter
        run: pnpm install --frozen-lockfile

      - name: Format candidate artifacts
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write             docs/adr/ADR-0002-control-plane-framework.md             docs/evidence/P01_S01_T01_FRAMEWORK_SOURCES_2026-09-20.md             specs/CURRENT.md             qualifications/control-plane-framework/next-app/package.json             qualifications/control-plane-framework/next-app/pnpm-workspace.yaml             qualifications/control-plane-framework/next-app/next.config.mjs             qualifications/control-plane-framework/next-app/app/layout.jsx             qualifications/control-plane-framework/next-app/app/page.jsx             qualifications/control-plane-framework/next-app/smoke.mjs             qualifications/control-plane-framework/next-app/README.md

      - name: Generate isolated qualification lockfile
        working-directory: qualifications/control-plane-framework/next-app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm install --lockfile-only

      - name: Frozen install and qualify selected framework
        working-directory: qualifications/control-plane-framework/next-app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm run qualify | tee /tmp/framework-qualification.log
          grep -F '"result":"PASS"' /tmp/framework-qualification.log

      - name: Commit generated lockfile, formatting, and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p01-framework-qualification-bootstrap.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/adr/ADR-0002-control-plane-framework.md             docs/evidence/P01_S01_T01_FRAMEWORK_SOURCES_2026-09-20.md             specs/CURRENT.md             qualifications/control-plane-framework/next-app
          git commit -m "chore(p01): lock qualified framework fixture"
          git push origin "HEAD:${GITHUB_REF_NAME}"
