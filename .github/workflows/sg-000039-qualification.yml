name: sg-000039-qualification

on:
  push:
    branches:
      - evidence/sg-000039-qualification

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 3a4713c47d36722c564f185bc4a8c02ad57da05c
      CANDIDATE_SHA: 54b0ddf358ce8c93c0b8977a8d17e65b4e32b18d
      DIFFCIPLINE_SHA256: a456a35bbfe03c087737118a05176af33604e2b2d1e634f8810bef6762f4a2f0
      OCR_SHA256: 56649575421b8ca3be3cfaededc0a9037ae7cc9ae560f167bf504bfb4054451a
      JEV_SHA256: 1f54c1aec0ca3790d8e4d215aa50c227a758b4cc967dbf90607672ec34cad2a0
      JEV_API_KEY: ${{ secrets.JEV_API_KEY || secrets.TYPESAFE_API_KEY }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Initialize isolated qualification directories
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/sg000039/evidence"
          tools_dir="$RUNNER_TEMP/sg000039/tools"
          mkdir -p "$evidence_dir" "$tools_dir"
          echo "EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          echo "TOOLS_DIR=$tools_dir" >> "$GITHUB_ENV"

      - name: Install canonical repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.4.2
          node --version | tee "$EVIDENCE_DIR/node-version.txt"
          pnpm --version | tee "$EVIDENCE_DIR/pnpm-version.txt"
          pnpm install --frozen-lockfile

      - name: Verify exact identities and diff accounting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          merge_base="$(git merge-base "$BASE_SHA" "$CANDIDATE_SHA")"
          test "$merge_base" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          printf 'base=%s\nhead=%s\nmerge_base=%s\n' "$BASE_SHA" "$CANDIDATE_SHA" "$merge_base" | tee "$EVIDENCE_DIR/identities.txt"
          git diff --stat "$BASE_SHA..$CANDIDATE_SHA" | tee "$EVIDENCE_DIR/diff-stat.txt"
          git diff --numstat "$BASE_SHA..$CANDIDATE_SHA" | tee "$EVIDENCE_DIR/diff-numstat.txt"
          git diff --name-status "$BASE_SHA..$CANDIDATE_SHA" | tee "$EVIDENCE_DIR/diff-files.txt"
          git diff "$BASE_SHA..$CANDIDATE_SHA" -- \
            packages/harness/package.json \
            packages/harness/tsconfig.json \
            packages/harness/src/index.ts \
            packages/harness/src/event-store.ts \
            packages/harness/src/event-store.test.ts \
            pnpm-lock.yaml \
            > "$EVIDENCE_DIR/exact-review.diff"

      - name: Run repository verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          git diff --check "$BASE_SHA..$CANDIDATE_SHA"

      - name: Run checksum-verified Diffcipline R2 proof
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/TheHalfMoon/Diffcipline/releases/download/v1.0.0/diffcipline-x86_64-unknown-linux-gnu' -o "$TOOLS_DIR/diffcipline"
          echo "$DIFFCIPLINE_SHA256  $TOOLS_DIR/diffcipline" | sha256sum --check
          chmod +x "$TOOLS_DIR/diffcipline"
          "$TOOLS_DIR/diffcipline" check --base "$BASE_SHA" --risk R2 --run --json | tee "$EVIDENCE_DIR/diffcipline-proof.json"

      - name: Run checksum-verified Alibaba Open Code Review accounting
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/alibaba/open-code-review/releases/download/v1.12.7/opencodereview-linux-amd64' -o "$TOOLS_DIR/ocr"
          echo "$OCR_SHA256  $TOOLS_DIR/ocr" | sha256sum --check
          chmod +x "$TOOLS_DIR/ocr"
          "$TOOLS_DIR/ocr" --version 2>&1 | tee "$EVIDENCE_DIR/ocr-version.txt"
          "$TOOLS_DIR/ocr" delegate preview --from "$BASE_SHA" --to "$CANDIDATE_SHA" --format json | tee "$EVIDENCE_DIR/ocr-preview.json"
          for path in \
            packages/harness/src/index.ts \
            packages/harness/src/event-store.ts \
            packages/harness/src/event-store.test.ts; do
            safe="$(echo "$path" | tr '/.' '__')"
            "$TOOLS_DIR/ocr" delegate rule --format json "$path" | tee "$EVIDENCE_DIR/ocr-$safe-rules.json"
          done

      - name: Install checksum-verified Jev CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/model-clis/jev/releases/download/v2026.919.0/jev-linux-x86_64' -o "$TOOLS_DIR/jev"
          echo "$JEV_SHA256  $TOOLS_DIR/jev" | sha256sum --check
          chmod +x "$TOOLS_DIR/jev"
          "$TOOLS_DIR/jev" --version 2>&1 | tee "$EVIDENCE_DIR/jev-version.txt"

      - name: Build exact-diff Jev review request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          evidence = pathlib.Path(os.environ['EVIDENCE_DIR'])
          request = {
              'state': {
                  'grain': 'SG-000039 / IN-P03-S01-T01B',
                  'base': os.environ['BASE_SHA'],
                  'candidate': os.environ['CANDIDATE_SHA'],
                  'scope': 'Provider-neutral async append-only EventStore contract over existing EventRecord validation, plus deterministic in-memory reference and stable generic durable-store failure codes. No durable persistence, provider/model calls, network, secrets, lifecycle mutation, capability grants, or release authority.',
                  'diff': (evidence / 'exact-review.diff').read_text(),
              },
              'questions': {
                  'scope_escape': {'type':'noul','instructions':'Does this exact diff escape the declared SG-000039 EventStore scope?','criteria':{'true':'It introduces persistence, external authority, hidden network/provider behavior, lifecycle mutation, or release authority.','false':'It contains only the async EventStore port/reference, package wiring, generic store-failure semantics, and focused tests.'}},
                  'append_only_gap': {'type':'noul','instructions':'Can accepted Event history be overwritten, silently repaired, caller-mutated, or cross-contaminated?','criteria':{'true':'Accepted history can be changed or another Run history can leak.','false':'History is immutable, isolated, and conflicts fail closed.'}},
                  'sequence_gap': {'type':'noul','instructions':'Does sequencing violate zero-based contiguous deterministic replay?','criteria':{'true':'Nonzero first sequence, gaps, regressions, duplicates, or nondeterministic replay can be accepted.','false':'Each Run starts at zero, advances by one, rejects conflicts, and replays deterministically.'}},
                  'validation_bypass': {'type':'noul','instructions':'Can invalid EventRecord or Run identity bypass protocol validation?','criteria':{'true':'Invalid input can be accepted or expose/mutate history.','false':'Append composes validateEventRecord and read requires canonical Run identity.'}},
                  'durable_adapter_mismatch': {'type':'noul','instructions':'Does the public port prevent a future durable/network-backed implementation or force vendor-specific failures through the boundary?','criteria':{'true':'The contract assumes synchronous/in-memory execution or lacks bounded generic storage failure semantics.','false':'Promise-based methods and generic STORE_UNAVAILABLE/STORAGE_CORRUPTION issues allow a durable adapter without a breaking change or vendor leak.'}}
              }
          }
          (evidence / 'jev-request.json').write_text(json.dumps(request, sort_keys=True))
          PY

      - name: Run required Jev semantic review
        id: jev_review
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${JEV_API_KEY:-}" ]; then
            printf 'state=BLOCKED_MISSING_GITHUB_SECRET\nreason=JEV_API_KEY and compatible TYPESAFE_API_KEY are absent\n' | tee "$EVIDENCE_DIR/jev-status.txt"
            exit 1
          fi
          "$TOOLS_DIR/jev" ask "$EVIDENCE_DIR/jev-request.json" \
            --assert 'answers.scope_escape.noul <= 0.5 and answers.append_only_gap.noul <= 0.5 and answers.sequence_gap.noul <= 0.5 and answers.validation_bypass.noul <= 0.5 and answers.durable_adapter_mismatch.noul <= 0.5' \
            | tee "$EVIDENCE_DIR/jev-result.json"
          printf 'state=PASS\n' > "$EVIDENCE_DIR/jev-status.txt"

      - name: Upload exact qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg-000039-final-exact-candidate-qualification
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error

      - name: Enforce required Jev gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.jev_review.outcome }}' = 'success'
