name: P00 SpecGrain one-shot OCR evidence shape

on:
  push:
    branches:
      - p00/s05-t02-ocr-evidence-contract
    paths:
      - .github/workflows/p00-specgrain-ocr-evidence-shape.yml

permissions:
  contents: write

concurrency:
  group: p00-specgrain-ocr-evidence-shape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shape:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SPECGRAIN_SHA: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
      BASELINE_SHA: bdfd53c348d98fb2cacda70ec02fab5729aedd59
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact SpecGrain source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps "https://github.com/TheHalfMoon/SpecGrain/archive/${SPECGRAIN_SHA}.zip"
          python -c "import importlib.metadata; print('specgrain-package-version=' + importlib.metadata.version('specgrain'))"
          specgrain --help >/dev/null

      - name: Draft S05-T02 candidate
        shell: bash
        run: |
          set -euo pipefail
          specgrain draft .             --title "IN-P00-S05-T02 Define OCR review evidence and file-accounting contract"             --outcome "Every OCR-attached change has deterministic exact-revision review evidence that accounts for every changed file, semantic execution or blocker state, rule resolution, findings, and dispositions without granting acceptance authority to OCR."             --rationale "Canonical rolling-wave P00-S05-T02 frontier after SG-000006 deterministic OCR procedure completion."             --json | tee /tmp/specgrain-draft.json
          test "$(python -c 'import json; print(json.load(open("/tmp/specgrain-draft.json"))["spec_id"])')" = "SG-000008"

      - name: Shape S05-T02
        shell: bash
        run: |
          set -euo pipefail
          specgrain shape SG-000008 .             --scope-in "Define a deterministic machine-readable OCR review evidence contract bound to exact base, head, and merge-base revisions."             --scope-in "Require complete changed-file accounting across reviewable, excluded, and separately reviewed material."             --scope-in "Record OCR version/config provenance and deterministic applicable-rule resolution."             --scope-in "Record semantic review execution plus structured findings, or an explicit truthful blocker when semantic review did not run."             --scope-in "Require disposition of every material finding and exact-head invalidation/reconciliation when the candidate changes."             --scope-out "No LLM endpoint/token provisioning."             --scope-out "No fabricated semantic OCR result."             --scope-out "No substitution of CodeRabbit, cubic, Qodo, or another generic bot for designated OCR evidence."             --acceptance "The contract binds exact base, head, merge-base, OCR version, and configuration identity."             --acceptance "Every changed file appears exactly once in deterministic reviewable or excluded accounting, with exclusions carrying a reason."             --acceptance "Material excluded or unsupported files require explicit separate-review accounting rather than disappearing from coverage."             --acceptance "Semantic state distinguishes executed review from NOT RUN/BLOCKED and requires blocker evidence when not executed."             --acceptance "Every material semantic finding has a fixed, accepted-risk, false-positive, deferred-blocking, or unresolved disposition with rationale."             --acceptance "A changed material head invalidates stale semantic evidence unless an explicit deterministic reconciliation proves the reviewed diff is unchanged."             --acceptance "Negative fixtures reject duplicate/missing file accounting, stale head identity, missing blocker evidence, and unresolved material findings."             --dependency SG-000006             --risk-level medium             --recovery "Revert SG-000008 and OCR evidence-contract artifacts; no external review endpoint, secret, or product runtime side effect is introduced."             --context-budget 9000             --context-estimate 4500             --change-surface "docs/engineering/**"             --change-surface "docs/evidence/**"             --change-surface "packages/protocol/**"             --change-surface "specs/CURRENT.md"             --evidence "Contract schema/validator tests including negative file-accounting and blocker fixtures."             --evidence "Exact-head Ubuntu and Windows repository CI."             --evidence "Recorded Alibaba OCR semantic blocker remains NOT RUN unless a scoped endpoint is genuinely provisioned."             --minimality-choice reuse-existing             --minimality-rationale "Extend the existing Ineractive protocol package and canonical OCR procedure rather than introduce a parallel review subsystem."             --safety-status requirements-defined             --safety-requirement "Never convert NOT RUN, BLOCKED, generic-bot status, or agent self-report into semantic OCR PASS."             --safety-requirement "Never expose OCR LLM tokens or endpoint secrets in committed evidence."             --json | tee /tmp/specgrain-shape.json

      - name: Refine and promote S05-T02
        shell: bash
        run: |
          set -euo pipefail
          specgrain refine SG-000008 . --json | tee /tmp/specgrain-refine.json
          specgrain check . --json | tee /tmp/specgrain-check-refining.json
          specgrain grain SG-000008 . --json | tee /tmp/specgrain-grain.json
          specgrain check . --json | tee /tmp/specgrain-check-grain.json
          specgrain next . --json | tee /tmp/specgrain-next.json

      - name: Assert known dependency-model boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          data = json.load(open("/tmp/specgrain-next.json", encoding="utf-8"))
          candidates = {entry["node_id"]: entry for entry in data["candidates"]}
          candidate = candidates["SG-000008"]
          if candidate["eligible"]:
              raise SystemExit("SG-000008 unexpectedly eligible; dependency model changed")
          if candidate["waiting_on"] != ["SG-000006"]:
              raise SystemExit("unexpected waiting_on: " + repr(candidate["waiting_on"]))
          print("known-boundary: SG-000008 waits on SG-000006 because CLI lifecycle completion is not modeled")
          PY

      - name: Record shaping evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .specgrain/tmp/pregrain-mutation.lock
          mkdir -p docs/evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(name):
              return json.loads(Path("/tmp/" + name).read_text(encoding="utf-8"))

          draft = load("specgrain-draft.json")
          shape = load("specgrain-shape.json")
          refine = load("specgrain-refine.json")
          grain = load("specgrain-grain.json")
          check = load("specgrain-check-grain.json")
          nxt = load("specgrain-next.json")
          candidate = next(item for item in nxt["candidates"] if item["node_id"] == "SG-000008")

          lines = [
              "# P00-S05-T02 — SpecGrain Shaping Evidence",
              "",
              "Task: IN-P00-S05-T02",
              "SpecGrain: SG-000008",
              "Date: 2026-09-20",
              "Canonical baseline: " + os.environ["BASELINE_SHA"],
              "SpecGrain source: TheHalfMoon/SpecGrain@" + os.environ["SPECGRAIN_SHA"],
              "GitHub Actions run: " + os.environ["GITHUB_RUN_ID"],
              "",
              "## Tool execution",
              "",
              "Repository-local state was created by the real SpecGrain CLI installed from the exact pinned source revision above.",
              "No SpecNode was hand-authored.",
              "",
              "- draft state: " + draft["state"],
              "- shaped revision: " + shape["revision_digest"],
              "- refine state: " + refine["state"],
              "- grain state: " + grain["state"],
              "- final revision: " + grain["revision_digest"],
              "- project check valid: " + str(check["valid"]).lower(),
              "- next valid: " + str(nxt["valid"]).lower(),
              "- next eligible for SG-000008: " + str(candidate["eligible"]).lower(),
              "- next waiting_on: " + ",".join(candidate["waiting_on"]),
              "",
              "## Known lifecycle boundary",
              "",
              "SpecGrain dependency eligibility currently treats only VERIFIED or CONTROLLED dependencies as satisfied.",
              "The current CLI does not expose lifecycle transitions that can record already-canonical SG-000006 completion in those states.",
              "Repository delivery truth records SG-000006 DONE through PR #5 and committed deterministic OCR evidence.",
              "No READY, VERIFIED, CONTROLLED, or WorkPacket claim is fabricated here.",
              "",
              "## Standing semantic blocker",
              "",
              "Alibaba OCR semantic LLM review remains NOT RUN because no scoped LLM endpoint/token is provisioned.",
              "This Grain defines how that blocker and future exact-head semantic evidence must be represented; it does not invent a semantic review result.",
              "",
          ]
          Path("docs/evidence/P00_S05_T02_SPECGRAIN_SHAPING_2026-09-20.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Commit tool-produced state
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          python - <<'PY'
          import subprocess
          allowed = {
              ".specgrain/specs/SG-000008.json",
              "docs/evidence/P00_S05_T02_SPECGRAIN_SHAPING_2026-09-20.md",
          }
          output = subprocess.check_output(["git", "status", "--porcelain=v1"], text=True)
          changed = {line[3:] for line in output.splitlines() if line}
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected or missing:
              raise SystemExit("unexpected changed paths=" + repr(unexpected) + "; missing expected paths=" + repr(missing))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .specgrain/specs/SG-000008.json docs/evidence/P00_S05_T02_SPECGRAIN_SHAPING_2026-09-20.md
          git commit -m "chore(p00): shape OCR evidence contract grain"
          git push origin "HEAD:${GITHUB_REF_NAME}"
