name: p02-s04-t01b-format-final

on:
  push:
    branches:
      - p02/s04-t01b-assumption-ledger-lifecycle-implementation
    paths:
      - .github/workflows/p02-s04-t01b-format-final.yml

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted-final]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.4.2
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format exact implementation surface
        run: pnpm exec prettier --write packages/product-graph/src/assumption-ledger.ts packages/product-graph/src/assumption-ledger.test.ts packages/product-graph/src/index.ts
      - name: Remove formatter and persist exact candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p02-s04-t01b-format-final.yml
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add packages/product-graph/src/assumption-ledger.ts packages/product-graph/src/assumption-ledger.test.ts packages/product-graph/src/index.ts .github/workflows/p02-s04-t01b-format-final.yml
          git commit -m "style(product-graph): finalize ledger formatting [formatted-final]"
          git push origin HEAD:p02/s04-t01b-assumption-ledger-lifecycle-implementation
