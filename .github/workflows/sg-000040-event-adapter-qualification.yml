name: sg-000040-event-adapter-qualification

on:
  push:
    branches:
      - evidence/sg-000040-event-adapter-qualification

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: fb8cc7cf3e26b25b9ed13841df7d820719210f24
      CANDIDATE_SHA: 7ac2eb285688ab443e561e14d8f4ad6fc088bd7d
      DIFFCIPLINE_SHA256: a456a35bbfe03c087737118a05176af33604e2b2d1e634f8810bef6762f4a2f0
      OCR_SHA256: 56649575421b8ca3be3cfaededc0a9037ae7cc9ae560f167bf504bfb4054451a
      JEV_SHA256: 1f54c1aec0ca3790d8e4d215aa50c227a758b4cc967dbf90607672ec34cad2a0
      JEV_API_KEY: ${{ secrets.JEV_API_KEY || secrets.TYPESAFE_API_KEY }}
    steps:
      - name: Checkout exact adapter candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Initialize evidence and tool directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sg000040-adapter/evidence" "$RUNNER_TEMP/sg000040-adapter/tools"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/sg000040-adapter/evidence" >> "$GITHUB_ENV"
          echo "TOOLS_DIR=$RUNNER_TEMP/sg000040-adapter/tools" >> "$GITHUB_ENV"

      - name: Verify exact identities and repository
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.4.2
          pnpm install --frozen-lockfile
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$BASE_SHA" "$CANDIDATE_SHA")" = "$BASE_SHA"
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          git diff --check "$BASE_SHA..$CANDIDATE_SHA"
          git diff --numstat "$BASE_SHA..$CANDIDATE_SHA" | tee "$EVIDENCE_DIR/diff-numstat.txt"
          git diff "$BASE_SHA..$CANDIDATE_SHA" -- \
            packages/control-plane/package.json \
            packages/control-plane/src/run-event-store.ts \
            packages/control-plane/src/run-event-store.test.ts \
            pnpm-lock.yaml \
            > "$EVIDENCE_DIR/exact-review.diff"

      - name: Run and disposition Diffcipline R3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/TheHalfMoon/Diffcipline/releases/download/v1.0.0/diffcipline-x86_64-unknown-linux-gnu' -o "$TOOLS_DIR/diffcipline"
          echo "$DIFFCIPLINE_SHA256  $TOOLS_DIR/diffcipline" | sha256sum --check
          chmod +x "$TOOLS_DIR/diffcipline"
          set +e
          "$TOOLS_DIR/diffcipline" check --base "$BASE_SHA" --risk R3 --run --json > "$EVIDENCE_DIR/diffcipline-raw.log" 2>&1
          rc=$?
          set -e
          cat "$EVIDENCE_DIR/diffcipline-raw.log"
          DIFFCIPLINE_RC="$rc" python - <<'PY'
          import json, os, pathlib
          evidence = pathlib.Path(os.environ['EVIDENCE_DIR'])
          proof = None
          for line in evidence.joinpath('diffcipline-raw.log').read_text().splitlines():
              line = line.strip()
              if not line.startswith('{'):
                  continue
              try:
                  item = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if item.get('schema') == 'diffcipline.proof/v1':
                  proof = item
          assert proof is not None, 'Diffcipline proof JSON was not captured'
          assert proof['scope_violations'] == [], proof
          assert all(item['state'] == 'PASS' for item in proof['verification']), proof
          assert proof['verdict'] in {'PASS', 'REVIEW'}, proof
          if proof['verdict'] == 'PASS':
              assert int(os.environ['DIFFCIPLINE_RC']) == 0
              disposition = 'PASS'
          else:
              assert int(os.environ['DIFFCIPLINE_RC']) != 0
              allowed = {
                  'dependency manifest changed: packages/control-plane/package.json',
                  'lockfile changed: pnpm-lock.yaml',
              }
              assert set(proof['reasons']) == allowed, proof['reasons']
              disposition = 'EXPECTED_MANIFEST_AND_LOCKFILE_REVIEW'
          evidence.joinpath('diffcipline-proof.json').write_text(json.dumps(proof, sort_keys=True))
          evidence.joinpath('diffcipline-disposition.txt').write_text(
              f"verdict={proof['verdict']}\ndisposition={disposition}\nscope_violations=0\nverification=PASS\n"
          )
          PY

      - name: Run checksum-verified Alibaba Open Code Review
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/alibaba/open-code-review/releases/download/v1.12.7/opencodereview-linux-amd64' -o "$TOOLS_DIR/ocr"
          echo "$OCR_SHA256  $TOOLS_DIR/ocr" | sha256sum --check
          chmod +x "$TOOLS_DIR/ocr"
          "$TOOLS_DIR/ocr" --version 2>&1 | tee "$EVIDENCE_DIR/ocr-version.txt"
          "$TOOLS_DIR/ocr" delegate preview --from "$BASE_SHA" --to "$CANDIDATE_SHA" --format json | tee "$EVIDENCE_DIR/ocr-preview.json"
          for path in \
            packages/control-plane/src/run-event-store.ts \
            packages/control-plane/src/run-event-store.test.ts; do
            safe="$(echo "$path" | tr '/.' '__')"
            "$TOOLS_DIR/ocr" delegate rule --format json "$path" | tee "$EVIDENCE_DIR/ocr-$safe-rules.json"
          done

      - name: Install checksum-verified Jev
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/model-clis/jev/releases/download/v2026.919.0/jev-linux-x86_64' -o "$TOOLS_DIR/jev"
          echo "$JEV_SHA256  $TOOLS_DIR/jev" | sha256sum --check
          chmod +x "$TOOLS_DIR/jev"
          "$TOOLS_DIR/jev" --version 2>&1 | tee "$EVIDENCE_DIR/jev-version.txt"

      - name: Build Jev exact-diff request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          evidence = pathlib.Path(os.environ['EVIDENCE_DIR'])
          request = {
              'state': {
                  'grain': 'SG-000040 / IN-P03-S01-T01C durable EventStore adapter packet',
                  'base': os.environ['BASE_SHA'],
                  'candidate': os.environ['CANDIDATE_SHA'],
                  'scope': 'Project-scoped Supabase EventStore adapter only. It validates EventRecord input/rows, preserves append/replay semantics, maps storage failures to stable generic issue codes, and grants no capability or PASS authority.',
                  'diff': evidence.joinpath('exact-review.diff').read_text(),
              },
              'questions': {
                  'scope_escape': {
                      'type': 'noul',
                      'instructions': 'Does this exact diff materially escape the declared durable EventStore adapter packet?',
                      'criteria': {'true': 'It adds unrelated authority, provider/model behavior, release/deployment semantics, or hidden credential use.', 'false': 'It remains a project-scoped adapter plus tests/package wiring.'}
                  },
                  'validation_bypass': {
                      'type': 'noul',
                      'instructions': 'Can invalid Event input or malformed durable rows bypass protocol validation and be exposed as accepted Event history?',
                      'criteria': {'true': 'Invalid/malformed input can be accepted or exposed.', 'false': 'Input and durable rows are validated and corruption fails closed.'}
                  },
                  'tenant_scope_gap': {
                      'type': 'noul',
                      'instructions': 'Can adapter reads or writes intentionally omit the project boundary or expose cross-project Run history?',
                      'criteria': {'true': 'A durable operation is not project-scoped where required.', 'false': 'Writes carry project_id and reads filter project_id plus run_id; database RLS remains defense in depth.'}
                  },
                  'vendor_leakage': {
                      'type': 'noul',
                      'instructions': 'Can unexpected storage/provider failure details escape through the public EventStore result instead of stable generic semantics?',
                      'criteria': {'true': 'Raw vendor error messages/details become public result content.', 'false': 'Expected conflicts map to stable codes and unknown failures map generically.'}
                  },
                  'authority_widening': {
                      'type': 'noul',
                      'instructions': 'Does successful persistence/read grant capability, external execution, acceptance/PASS, provider, release, or deployment authority?',
                      'criteria': {'true': 'Persistence is elevated into unrelated authority.', 'false': 'The adapter is storage/evidence coordination only.'}
                  }
              }
          }
          evidence.joinpath('jev-request.json').write_text(json.dumps(request, sort_keys=True))
          PY

      - name: Run required Jev semantic review
        id: jev_review
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${JEV_API_KEY:-}" ]; then
            printf 'state=BLOCKED_MISSING_GITHUB_SECRET\nreason=JEV_API_KEY and compatible TYPESAFE_API_KEY are absent\n' | tee "$EVIDENCE_DIR/jev-status.txt"
            exit 1
          fi
          "$TOOLS_DIR/jev" ask "$EVIDENCE_DIR/jev-request.json" \
            --assert 'answers.scope_escape.noul <= 0.5 and answers.validation_bypass.noul <= 0.5 and answers.tenant_scope_gap.noul <= 0.5 and answers.vendor_leakage.noul <= 0.5 and answers.authority_widening.noul <= 0.5' \
            | tee "$EVIDENCE_DIR/jev-result.json"
          printf 'state=PASS\n' > "$EVIDENCE_DIR/jev-status.txt"

      - name: Upload exact qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg-000040-event-adapter-exact-qualification
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error

      - name: Enforce required Jev gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.jev_review.outcome }}' = 'success'
