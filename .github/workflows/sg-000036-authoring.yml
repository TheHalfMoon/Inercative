name: sg-000036-authoring

on:
  push:
    branches:
      - p02/s07-t01c-endpoint-contracts
    paths:
      - .github/workflows/sg-000036-authoring.yml

permissions:
  contents: write

jobs:
  author:
    if: ${{ !contains(github.event.head_commit.message, '[authored]') }}
    runs-on: ubuntu-latest
    env:
      CANONICAL_BASE: 0a13e40b52e735e752e15c5d18ee5a164320df66
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify exact canonical ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$CANONICAL_BASE" HEAD)" = "$CANONICAL_BASE"

      - name: Apply bounded SG-000036 patch
        run: python .github/scripts/sg000036_author.py

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Canonicalize formatting and verify repository
        shell: bash
        run: |
          set -euo pipefail
          pnpm run format
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          git diff --check

      - name: Persist authored candidate and remove temporary authoring files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sg-000036-authoring.yml .github/scripts/sg000036_author.py
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add packages/product-graph/src/domain.ts packages/product-graph/src/domain.test.ts .github/workflows/sg-000036-authoring.yml .github/scripts/sg000036_author.py
          git commit -m "feat(product-graph): add SG-000036 relation endpoint contracts [authored]"
          git push origin HEAD:p02/s07-t01c-endpoint-contracts
