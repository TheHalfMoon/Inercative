name: p02-s01-t01c-format

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'p02/s01-t01c-product-graph-comparison'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format exact comparison source
        run: pnpm exec prettier --write packages/product-graph-lab/src/comparison.ts

      - name: Commit forward-only formatting correction
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p02-s01-t01c-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(p02): format Product Graph comparison"
          git push origin HEAD:${GITHUB_HEAD_REF}
