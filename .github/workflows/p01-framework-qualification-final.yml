# SG-000009 qualification retry: evidence whitespace repair
# SG-000009 qualification retry: explicit standalone tracing root
name: P01 final one-shot framework qualification

on:
  push:
    branches:
      - p01/s01-t01-control-plane-framework
    paths:
      - .github/workflows/p01-framework-qualification-final.yml

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FIXTURE: qualifications/control-plane-framework/next-app
      MARKER: INERACTIVE_CONTROL_PLANE_FRAMEWORK_QUALIFIED
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install repository tooling
        run: pnpm install --frozen-lockfile

      - name: Format candidate source artifacts
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write             docs/adr/ADR-0002-control-plane-framework.md             docs/canonical/CONTROL_PLANE_FRAMEWORK_QUALIFICATION.md             docs/evidence/P01_S01_T01_FRAMEWORK_SOURCES_2026-09-20.md             qualifications/control-plane-framework/next-app/package.json             qualifications/control-plane-framework/next-app/pnpm-workspace.yaml             qualifications/control-plane-framework/next-app/next.config.mjs             qualifications/control-plane-framework/next-app/app/layout.jsx             qualifications/control-plane-framework/next-app/app/page.jsx             qualifications/control-plane-framework/next-app/smoke.mjs             qualifications/control-plane-framework/next-app/README.md

      - name: Generate isolated lockfile and frozen install
        working-directory: qualifications/control-plane-framework/next-app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          test "$(node --version | cut -d. -f1)" = "v24"
          test "$(pnpm --version)" = "12.4.2"
          test "$(pnpm exec next --version)" = "Next.js v16.3.5"
          test "$(node -p "require('react/package.json').version")" = "19.3.0"
          test "$(node -p "require('react-dom/package.json').version")" = "19.3.0"

      - name: Capture tested fixture digest
        shell: bash
        run: |
          set -euo pipefail
          fixture_digest="$(
            find "$FIXTURE" -type f               ! -path '*/node_modules/*'               ! -path '*/.next/*'               -print0               | sort -z               | xargs -0 sha256sum               | sha256sum               | awk '{print $1}'
          )"
          echo "FIXTURE_DIGEST=$fixture_digest" >> "$GITHUB_ENV"

      - name: Production build and standalone HTTP smoke
        working-directory: qualifications/control-plane-framework/next-app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        shell: bash
        run: |
          set -euo pipefail
          pnpm run qualify | tee /tmp/framework-qualification.log
          grep -F '"result":"PASS"' /tmp/framework-qualification.log
          grep -F "$MARKER" app/page.jsx

      - name: Record qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          export QUAL_NODE_VERSION="$(node --version)"
          export QUAL_PNPM_VERSION="$(pnpm --version)"
          export QUAL_NEXT_VERSION="$(cd "$FIXTURE" && pnpm exec next --version)"
          export QUAL_REACT_VERSION="$(cd "$FIXTURE" && node -p "require('react/package.json').version")"
          export QUAL_REACT_DOM_VERSION="$(cd "$FIXTURE" && node -p "require('react-dom/package.json').version")"
          export QUAL_TESTED_HEAD="$(git rev-parse HEAD)"
          export QUAL_LOCK_SHA="$(sha256sum "$FIXTURE/pnpm-lock.yaml" | awk '{print $1}')"
          python - <<'PY'
          import os
          from pathlib import Path

          lines = [
              "# P01-S01-T01 — Control-Plane Framework Qualification Evidence",
              "",
              "**Task:** IN-P01-S01-T01",
              "**SpecGrain:** SG-000009",
              "**Date:** 2026-09-20",
              f"**Qualification run:** {os.environ['GITHUB_RUN_ID']}",
              f"**Tested branch head before evidence commit:** {os.environ['QUAL_TESTED_HEAD']}",
              "",
              "## Exact runtime and fixture",
              "",
              f"- Node: {os.environ['QUAL_NODE_VERSION']}",
              f"- pnpm: {os.environ['QUAL_PNPM_VERSION']}",
              f"- Next.js: {os.environ['QUAL_NEXT_VERSION']}",
              f"- React: {os.environ['QUAL_REACT_VERSION']}",
              f"- React DOM: {os.environ['QUAL_REACT_DOM_VERSION']}",
              f"- fixture content digest: {os.environ['FIXTURE_DIGEST']}",
              f"- fixture lockfile SHA-256: {os.environ['QUAL_LOCK_SHA']}",
              "",
              "## Executed evidence",
              "",
              "- isolated dependency resolution: PASS",
              "- frozen fixture install: PASS",
              "- production Next.js build: PASS",
              "- generated standalone Node server: PASS",
              "- HTTP smoke against standalone server: PASS",
              f"- expected marker {os.environ['MARKER']}: OBSERVED",
              "",
              "## Scope boundary",
              "",
              "The fixture is qualification-only. It creates no production/provider resource and",
              "is not the P01-S03 project/workspace shell.",
              "",
              "The fixture source and lockfile tested in this run are committed by the same",
              "one-shot job. Final SG-000009 acceptance still requires exact-head repository CI",
              "on Ubuntu and Windows after this temporary workflow is removed.",
              "",
          ]
          Path("docs/evidence/P01_S01_T01_FRAMEWORK_QUALIFICATION_2026-09-20.md").write_text(
              "\n".join(lines),
              encoding="utf-8",
          )
          PY
          pnpm exec prettier --write docs/evidence/P01_S01_T01_FRAMEWORK_QUALIFICATION_2026-09-20.md

      - name: Clean ephemeral build artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$FIXTURE/node_modules" "$FIXTURE/.next"

      - name: Commit qualification evidence and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p01-framework-qualification-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/adr/ADR-0002-control-plane-framework.md             docs/canonical/CONTROL_PLANE_FRAMEWORK_QUALIFICATION.md             docs/evidence/P01_S01_T01_FRAMEWORK_SOURCES_2026-09-20.md             docs/evidence/P01_S01_T01_FRAMEWORK_QUALIFICATION_2026-09-20.md             "$FIXTURE"
          git diff --cached --check
          git commit -m "test(p01): prove control-plane framework qualification"
          git push origin "HEAD:${GITHUB_REF_NAME}"
