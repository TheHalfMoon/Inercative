name: sg-000037-authoring

on:
  push:
    branches:
      - p02/s06-t01b-endpoint-contracts

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install canonical repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.4.2
          pnpm install --frozen-lockfile

      - name: Apply bounded SG-000037 patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/sg-000037-author.py
          pnpm exec prettier --write packages/product-graph/src/domain.ts packages/product-graph/src/domain.test.ts

      - name: Run repository verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          git diff --check

      - name: Persist code-only candidate and self-delete authoring assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          rm .github/workflows/sg-000037-authoring.yml .github/scripts/sg-000037-author.py
          git add -A
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' .github/scripts/sg-000037-author.py .github/workflows/sg-000037-authoring.yml packages/product-graph/src/domain.test.ts packages/product-graph/src/domain.ts)"
          test "$changed" = "$expected"
          git commit -m "feat(product-graph): add SG-000037 semantic reference endpoints [authored]"
          git push origin HEAD:p02/s06-t01b-endpoint-contracts
