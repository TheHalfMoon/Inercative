name: P01 one-shot Prettier identity revision fix

on:
  push:
    branches:
      - p01/s02-t01-protocol-identity-revision
    paths:
      - .github/workflows/p01-prettier-identity-revision.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format exact files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write             packages/protocol/src/identity-revision.test.ts             packages/protocol/src/identity-revision.ts
          pnpm exec prettier --check             packages/protocol/src/identity-revision.test.ts             packages/protocol/src/identity-revision.ts
          git diff --check
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p01-prettier-identity-revision.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/protocol/src/identity-revision.test.ts             packages/protocol/src/identity-revision.ts
          git commit -m "style(p01): format protocol identity revision"
          git push origin "HEAD:${GITHUB_REF_NAME}"
