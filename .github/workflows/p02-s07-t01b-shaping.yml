name: p02-s07-t01b-shaping

on:
  push:
    branches:
      - p02/s07-t01a-closeout-t01b-shaping
    paths:
      - .github/workflows/p02-s07-t01b-shaping.yml

permissions:
  contents: write

jobs:
  shape:
    if: ${{ !contains(github.event.head_commit.message, '[shaped]') }}
    runs-on: ubuntu-latest
    env:
      CANONICAL_BASE: 651738db84bcc99aeaf6141b469b476951509007
      SPEC_GRAIN_SOURCE: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
    steps:
      - name: Checkout shaping branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical ancestry
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$CANONICAL_BASE^{commit}"
          test "$(git merge-base "$CANONICAL_BASE" HEAD)" = "$CANONICAL_BASE"

      - name: Install exact SpecGrain source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps "https://github.com/TheHalfMoon/SpecGrain/archive/${SPEC_GRAIN_SOURCE}.zip"
          specgrain --help >/dev/null

      - name: Draft with native SpecGrain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _shaping
          specgrain draft . \
            --title "IN-P02-S07-T01B profile quality seed and synthetic semantic node contracts" \
            --outcome "The Product Graph can represent DataProfile, DataQualityRule, SeedDataset, and SyntheticDataset as closed deterministic metadata nodes with inspectable profile/quality evidence identity and reproducibility/privacy constraints, without profiling or generating data." \
            --rationale "SG-000034 canonically established the four core Dataset identity/provenance nodes. The next bounded S07 slice adds the remaining non-relational V1 dataset metadata concepts before relation/cross-node semantics are introduced in a separate Grain." \
            --json | tee _shaping/draft.json
          SPEC_ID="$(python -c 'import json; print(json.load(open("_shaping/draft.json"))["spec_id"])')"
          test "$SPEC_ID" = "SG-000035"
          echo "SPEC_ID=$SPEC_ID" >> "$GITHUB_ENV"

      - name: Shape bounded Grain
        shell: bash
        run: |
          set -euo pipefail
          specgrain shape "$SPEC_ID" . \
            --scope-in "Add closed Product Graph domain node kinds for DataProfile, DataQualityRule, SeedDataset, and SyntheticDataset through the existing deterministic domain validator." \
            --scope-in "DataProfile metadata must identify the dataset-version observation/provenance context and support inspectable statistics/quality characteristic references without claiming profiling execution occurred." \
            --scope-in "DataQualityRule metadata must express a deterministic, human-inspectable validity/reconciliation/integrity requirement without embedding executable code or granting mutation authority." \
            --scope-in "SeedDataset metadata must preserve deterministic/reproducible development/test intent, target environment identity, representative role/state/edge-case coverage references, provenance, and verification identity." \
            --scope-in "SyntheticDataset metadata must preserve schema/product-semantics and privacy-policy constraint references, deterministic/reproducible generation intent, target environment, provenance, coverage references, and verification identity." \
            --scope-in "Reuse the existing data-classification vocabulary where privacy classification is represented, and add focused deterministic validation tests while preserving all previously qualified domain kinds." \
            --scope-out "No data profiling, statistics calculation, quality-rule execution, record generation, seed insertion, file/database/API read, persistence mutation, Supabase operation, model/provider call, network/secret access, production-data copying, or environment write." \
            --scope-out "No Dataset/DataProfile/DataQualityRule/SeedDataset/SyntheticDataset relation vocabulary or cross-node existence validation; relation semantics remain the next bounded S07 slice." \
            --scope-out "No VectorCorpus/EvalDataset AI-dataset semantics, no ProductCompletenessManifest, no P02-S06 endpoint repair, and no P03 work." \
            --acceptance "DOMAIN_NODE_KINDS and DOMAIN_NODE_KIND_SPECS include exactly the four new profile/quality/seed/synthetic kinds with closed deterministic field schemas while all previously qualified node kinds remain compatible." \
            --acceptance "SeedDataset and SyntheticDataset contracts make reproducibility, target environment, provenance, coverage, and verification intent explicit; SyntheticDataset additionally carries explicit privacy/schema-or-product constraint identity and must not imply copied private production values." \
            --acceptance "DataProfile and DataQualityRule contracts remain metadata only and cannot claim observations/rules were executed merely because nodes exist." \
            --acceptance "Focused tests prove valid examples plus missing-required, unknown-field, wrong-type, invalid privacy-class where reused, deterministic issue ordering, and full canonical domain-validation compatibility." \
            --acceptance "The exact implementation candidate passes repository format/lint/typecheck/tests, Diffcipline R2, checksum-verified Alibaba OCR deterministic accounting/rule resolution where applicable, Jev where actually available, exact-head CI, and fresh-main CI before closure." \
            --dependency SG-000034 \
            --risk-level medium \
            --recovery "Revert the four profile/quality/seed/synthetic node-kind/spec additions, their focused tests, exports, and evidence; canonical dataset-core semantics through SG-000034 remain intact." \
            --context-budget 7000 \
            --context-estimate 5200 \
            --change-surface "packages/product-graph/src/domain.ts" \
            --change-surface "packages/product-graph/src/domain.test.ts" \
            --change-surface "docs/evidence/**" \
            --change-surface "specs/CURRENT.md" \
            --evidence "Exact base/head/merge-base and changed-file accounting." \
            --evidence "Focused metadata-contract tests plus full repository format/lint/typecheck/test suites." \
            --evidence "Diffcipline exact-candidate proof, Alibaba OCR deterministic accounting/rule resolution, exact-head semantic review, Jev where available, and post-merge fresh-main CI." \
            --minimality-choice reuse-existing \
            --minimality-rationale "The current Product Graph domain kind/spec validator is already the canonical metadata contract. A separate profiling or generation runtime in this Grain would duplicate authority and conflate representation with execution." \
            --safety-status requirements-defined \
            --safety-requirement "A profile or quality-rule node is evidence/requirement metadata, never proof that data was inspected or a rule was executed." \
            --safety-requirement "Seed/synthetic metadata never grants write authority and must not copy private production values by default." \
            --safety-requirement "Synthetic/seed reproducibility metadata is not permission to call a model, read a source, or write an environment." \
            --json | tee _shaping/shape.json
          specgrain refine "$SPEC_ID" . --json | tee _shaping/refine.json
          specgrain grain "$SPEC_ID" . --json | tee _shaping/grain.json
          specgrain check . --json | tee _shaping/check.json

      - name: Persist only SpecGrain state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p02-s07-t01b-shaping.yml
          git status --short
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add .specgrain .github/workflows/p02-s07-t01b-shaping.yml
          git commit -m "spec(p02): shape S07 profile quality seed semantics [shaped]"
          git push origin HEAD:p02/s07-t01a-closeout-t01b-shaping