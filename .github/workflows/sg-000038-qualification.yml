name: sg-000038-qualification

on:
  push:
    branches:
      - evidence/sg-000038-qualification

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 3a4713c47d36722c564f185bc4a8c02ad57da05c
      CANDIDATE_SHA: 58255689df74ec11d1ea4e777d392bd6307e37bb
      DIFFCIPLINE_SHA256: a456a35bbfe03c087737118a05176af33604e2b2d1e634f8810bef6762f4a2f0
      OCR_SHA256: 56649575421b8ca3be3cfaededc0a9037ae7cc9ae560f167bf504bfb4054451a
      JEV_SHA256: 1f54c1aec0ca3790d8e4d215aa50c227a758b4cc967dbf90607672ec34cad2a0
      JEV_API_KEY: ${{ secrets.JEV_API_KEY || secrets.TYPESAFE_API_KEY }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Initialize isolated qualification directories
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/sg000038/evidence"
          tools_dir="$RUNNER_TEMP/sg000038/tools"
          mkdir -p "$evidence_dir" "$tools_dir"
          echo "EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          echo "TOOLS_DIR=$tools_dir" >> "$GITHUB_ENV"

      - name: Install canonical repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.4.2
          node --version | tee "$EVIDENCE_DIR/node-version.txt"
          pnpm --version | tee "$EVIDENCE_DIR/pnpm-version.txt"
          pnpm install --frozen-lockfile

      - name: Verify exact identities and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          merge_base="$(git merge-base "$BASE_SHA" "$CANDIDATE_SHA")"
          test "$merge_base" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          printf 'base=%s\nhead=%s\nmerge_base=%s\n' "$BASE_SHA" "$CANDIDATE_SHA" "$merge_base" | tee "$EVIDENCE_DIR/identities.txt"
          git diff --stat "$BASE_SHA..$CANDIDATE_SHA" | tee "$EVIDENCE_DIR/diff-stat.txt"
          git diff --numstat "$BASE_SHA..$CANDIDATE_SHA" | tee "$EVIDENCE_DIR/diff-numstat.txt"
          git diff --name-status "$BASE_SHA..$CANDIDATE_SHA" | tee "$EVIDENCE_DIR/diff-files.txt"
          git diff "$BASE_SHA..$CANDIDATE_SHA" -- packages/protocol/src/index.ts packages/protocol/src/run-lifecycle.ts packages/protocol/src/run-lifecycle.test.ts > "$EVIDENCE_DIR/exact-review.diff"

      - name: Run repository verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          git diff --check "$BASE_SHA..$CANDIDATE_SHA"

      - name: Run checksum-verified Diffcipline R2 proof
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/TheHalfMoon/Diffcipline/releases/download/v1.0.0/diffcipline-x86_64-unknown-linux-gnu' -o "$TOOLS_DIR/diffcipline"
          echo "$DIFFCIPLINE_SHA256  $TOOLS_DIR/diffcipline" | sha256sum --check
          chmod +x "$TOOLS_DIR/diffcipline"
          "$TOOLS_DIR/diffcipline" check --base "$BASE_SHA" --risk R2 --run --json | tee "$EVIDENCE_DIR/diffcipline-proof.json"

      - name: Run checksum-verified Alibaba Open Code Review accounting
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/alibaba/open-code-review/releases/download/v1.12.7/opencodereview-linux-amd64' -o "$TOOLS_DIR/ocr"
          echo "$OCR_SHA256  $TOOLS_DIR/ocr" | sha256sum --check
          chmod +x "$TOOLS_DIR/ocr"
          "$TOOLS_DIR/ocr" --version 2>&1 | tee "$EVIDENCE_DIR/ocr-version.txt"
          "$TOOLS_DIR/ocr" delegate preview --from "$BASE_SHA" --to "$CANDIDATE_SHA" --format json | tee "$EVIDENCE_DIR/ocr-preview.json"
          "$TOOLS_DIR/ocr" delegate rule --format json packages/protocol/src/run-lifecycle.ts | tee "$EVIDENCE_DIR/ocr-run-lifecycle-rules.json"
          "$TOOLS_DIR/ocr" delegate rule --format json packages/protocol/src/run-lifecycle.test.ts | tee "$EVIDENCE_DIR/ocr-run-lifecycle-test-rules.json"
          "$TOOLS_DIR/ocr" delegate rule --format json packages/protocol/src/index.ts | tee "$EVIDENCE_DIR/ocr-index-rules.json"

      - name: Install checksum-verified Jev CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/model-clis/jev/releases/download/v2026.919.0/jev-linux-x86_64' -o "$TOOLS_DIR/jev"
          echo "$JEV_SHA256  $TOOLS_DIR/jev" | sha256sum --check
          chmod +x "$TOOLS_DIR/jev"
          "$TOOLS_DIR/jev" --version 2>&1 | tee "$EVIDENCE_DIR/jev-version.txt"

      - name: Build exact-diff Jev review request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          evidence = pathlib.Path(os.environ['EVIDENCE_DIR'])
          diff = (evidence / 'exact-review.diff').read_text()
          request = {
              'state': {
                  'grain': 'SG-000038 / IN-P03-S01-T01A',
                  'base': os.environ['BASE_SHA'],
                  'candidate': os.environ['CANDIDATE_SHA'],
                  'scope': 'Pure deterministic Run lifecycle and continuation semantics over existing SG-000011 RunRecord. No persistence, provider/model calls, network, secrets, scheduling, retries, capability grants, or wire-schema changes.',
                  'diff': diff,
              },
              'questions': {
                  'scope_escape': {
                      'type': 'noul',
                      'instructions': 'Does this exact diff introduce behavior or authority outside the declared pure SG-000038 lifecycle/continuation scope?',
                      'criteria': {
                          'true': 'Any persistence, provider/model/network/secret/scheduler/retry/capability/permission authority, hidden side effect, or wire-schema mutation is introduced.',
                          'false': 'Only deterministic transition and continuation validation, exports, and focused tests are added.'
                      }
                  },
                  'history_rewrite': {
                      'type': 'noul',
                      'instructions': 'Can the continuation semantics rewrite a terminal parent Run or otherwise lose historical parent state instead of requiring a distinct child Run?',
                      'criteria': {
                          'true': 'Continuation can mutate/reuse the parent identity/state or resume in place.',
                          'false': 'Continuation requires a distinct child identity, exact parentRunId binding, PLANNED child state, and preserves the parent record.'
                      }
                  },
                  'transition_gap': {
                      'type': 'noul',
                      'instructions': 'Does the closed transition table or its validation materially violate SG-000038 acceptance or leave undeclared transitions accidentally allowed?',
                      'criteria': {
                          'true': 'An undeclared transition is allowed, terminal states can return to RUNNING in place, or validation is not closed/deterministic.',
                          'false': 'The table is closed, deterministic, and tests cover the full 6x6 matrix plus terminal closure.'
                      }
                  },
                  'sg000011_regression': {
                      'type': 'noul',
                      'instructions': 'Does this exact diff redefine, weaken, or incompatibly replace SG-000011 RunRecord validation/wire semantics?',
                      'criteria': {
                          'true': 'Existing RunRecord schema/validator semantics are modified or bypassed incompatibly.',
                          'false': 'Lifecycle validation composes the existing validator and leaves the existing wire contract unchanged.'
                      }
                  }
              }
          }
          (evidence / 'jev-request.json').write_text(json.dumps(request, sort_keys=True))
          PY

      - name: Run required Jev semantic review
        id: jev_review
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${JEV_API_KEY:-}" ]; then
            printf 'state=BLOCKED_MISSING_GITHUB_SECRET\nreason=JEV_API_KEY and compatible TYPESAFE_API_KEY are absent\n' | tee "$EVIDENCE_DIR/jev-status.txt"
            exit 1
          fi
          printf 'state=RUN\n' | tee "$EVIDENCE_DIR/jev-status.txt"
          "$TOOLS_DIR/jev" ask "$EVIDENCE_DIR/jev-request.json" \
            --assert 'answers.scope_escape.noul <= 0.5 and answers.history_rewrite.noul <= 0.5 and answers.transition_gap.noul <= 0.5 and answers.sg000011_regression.noul <= 0.5' \
            | tee "$EVIDENCE_DIR/jev-result.json"
          printf 'state=PASS\n' > "$EVIDENCE_DIR/jev-status.txt"

      - name: Upload exact qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg-000038-exact-candidate-qualification
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error

      - name: Enforce required Jev gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.jev_review.outcome }}' = 'success'
