name: P01 one-shot Supabase store bootstrap

on:
  push:
    branches:
      - p01/s05-t01-control-plane-store
    paths:
      - .github/workflows/p01-supabase-store-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SUPABASE_VERSION: "2.117.0"
      SUPABASE_SHA256: "69c05f85b9e47ee706d30f1a6ca8a526b4e337bfd12c7ef1ef522d24e7280d24"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile
      - name: Add exact Supabase JS dependency
        run: pnpm add --filter @ineractive/control-plane --save-exact @supabase/supabase-js@2.116.0
      - name: Install verified Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/supabase.tar.gz             "https://github.com/supabase/cli/releases/download/v${SUPABASE_VERSION}/supabase_${SUPABASE_VERSION}_linux_amd64.tar.gz"
          echo "${SUPABASE_SHA256}  /tmp/supabase.tar.gz" | sha256sum -c -
          mkdir -p /tmp/supabase-cli
          tar -xzf /tmp/supabase.tar.gz -C /tmp/supabase-cli
          /tmp/supabase-cli/supabase --version
          /tmp/supabase-cli/supabase init --help >/tmp/supabase-init-help.txt
          /tmp/supabase-cli/supabase migration new --help >/tmp/supabase-migration-help.txt
      - name: Initialize local control-plane Supabase artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd packages/control-plane
          /tmp/supabase-cli/supabase init
          /tmp/supabase-cli/supabase migration new control_plane_user_project_store
          test -f supabase/config.toml
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*_control_plane_user_project_store.sql' | wc -l)" -eq 1
      - name: Commit bootstrap artifacts and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p01-supabase-store-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/control-plane/package.json pnpm-lock.yaml packages/control-plane/supabase
          git commit -m "chore(p01): bootstrap control-plane Supabase store"
          git push origin "HEAD:${GITHUB_REF_NAME}"
