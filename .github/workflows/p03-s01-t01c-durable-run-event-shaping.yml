name: p03-s01-t01c-durable-run-event-shaping

on:
  push:
    branches:
      - p03/s01-t01c-durable-run-event-shaping
    paths:
      - .github/workflows/p03-s01-t01c-durable-run-event-shaping.yml

permissions:
  contents: write

jobs:
  shape:
    if: ${{ !contains(github.event.head_commit.message, '[shaped]') }}
    runs-on: ubuntu-latest
    env:
      CANONICAL_BASE: 8bb0e36600f610af9af360b32c57b4334af059b7
      SPEC_GRAIN_SOURCE: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
    steps:
      - name: Checkout shaping branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$CANONICAL_BASE" HEAD)" = "$CANONICAL_BASE"

      - name: Install exact SpecGrain source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps "https://github.com/TheHalfMoon/SpecGrain/archive/${SPEC_GRAIN_SOURCE}.zip"
          specgrain --help >/dev/null

      - name: Draft with native SpecGrain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _shaping
          specgrain draft . \
            --title "IN-P03-S01-T01C authenticated durable Run/Event control-plane persistence" \
            --outcome "Ineractive can durably persist project-owned RunRecord and append-only EventRecord history in the authenticated control-plane Supabase domain while preserving SG-000038 lifecycle semantics, SG-000039 event ordering/replay invariants, tenant isolation, editor/viewer authority, and the existing server-only no-service-role credential boundary." \
            --rationale "SG-000038 shapes deterministic Run lifecycle semantics and SG-000039 shapes the provider-neutral append-only EventStore contract/reference behavior, but neither provides durable persistence. P03-S01 requires an event store that survives process/session loss. P01-S05 already established an authenticated control-plane Supabase trust domain with project ownership/membership, RLS, server-only configuration, and explicit separation from generated-application backends. The smallest safe durable step is therefore a project-owned Run/Event adapter in that existing domain rather than a new hidden data plane or privileged service-role store." \
            --json | tee _shaping/draft.json
          SPEC_ID="$(python -c 'import json; print(json.load(open("_shaping/draft.json"))["spec_id"])')"
          test "$SPEC_ID" = "SG-000040"
          echo "SPEC_ID=$SPEC_ID" >> "$GITHUB_ENV"

      - name: Shape bounded Grain
        shell: bash
        run: |
          set -euo pipefail
          specgrain shape "$SPEC_ID" . \
            --scope-in "Add durable control-plane persistence for RunRecord and EventRecord under an existing Ineractive project identity; every persisted Run belongs to exactly one project and every persisted Event belongs to exactly one persisted Run." \
            --scope-in "Extend the existing control-plane Supabase migration surface with RLS-protected Run and Run-event storage that preserves canonical logical identities, Run state/parent binding, exact target RevisionBinding, Event source/target/references, kind, and per-Run sequence without lossy reinterpretation." \
            --scope-in "Reuse the existing verified authenticated actor, server-only control-plane Supabase configuration, publishable-key boundary, and generated-application credential separation; service-role/secret credentials remain forbidden for ordinary store initialization." \
            --scope-in "Define project access so the project owner and editor members may create/advance Runs and append Events, viewer members remain read-only, unrelated authenticated users cannot read or mutate the records, and anonymous access remains denied." \
            --scope-in "Enforce immutable append-only Event history at both adapter and database boundaries: no ordinary event update/delete authority, globally unique Event identity, unique per-Run sequence, zero-based contiguous ordering, and concurrency-safe rejection of gaps/regressions/duplicate positions without silent repair." \
            --scope-in "Persist Run lifecycle changes only when they satisfy the canonical SG-000038 transition contract; persistence success cannot widen lifecycle semantics, and a failed/forbidden transition cannot partially mutate durable state." \
            --scope-in "Define deterministic per-Run ordered reads/replay through the SG-000039 EventStore boundary and round-trip tests proving stored records preserve exact protocol meaning." \
            --scope-out "No generated-application Supabase table, credential, migration, RLS policy, or service-role authority; no cross-use of generated-app backend configuration in the Ineractive control plane." \
            --scope-out "No model/provider/tool routing, capability grants, scheduler/retry execution, artifact store, budget governor, memory, browser/runtime orchestration, release/deployment, observability export, or P02 work." \
            --scope-out "No new acceptance/PASS authority from database presence, no direct model-generated production SQL execution, and no claim that table persistence proves runtime success or external side effects." \
            --scope-out "No arbitrary deletion or mutation of accepted Event history. Explicit project deletion may cascade owned Run/Event rows as part of the existing user-owned project lifecycle, but this is not an event rewrite mechanism." \
            --acceptance "A migration creates project-owned Run and Run-event persistence with explicit keys/constraints and RLS enabled on every newly exposed table; anonymous access is denied and tenant isolation is enforced." \
            --acceptance "Owner/editor/viewer tests prove owner and editor mutation authority, viewer read-only behavior, unrelated-user isolation, and no privilege escalation through membership or record identifiers." \
            --acceptance "Event append semantics remain zero-based, contiguous, append-only, immutable, and concurrency-safe; duplicate identity/sequence, gaps, regressions, and conflicting concurrent appends fail closed without changing previously accepted history." \
            --acceptance "Run persistence preserves exact RunRecord identity/target/state/parent semantics and rejects lifecycle updates that violate SG-000038; forbidden transitions are atomic non-mutations." \
            --acceptance "The control-plane adapter uses the existing server-only verified actor/publishable-key boundary and rejects service-role/secret/generated-app configuration exactly as P01-S05 requires." \
            --acceptance "Protocol round-trip tests prove durable Run/Event records preserve exact logical identities, RevisionBinding values, event source/target/references/kind/sequence, and deterministic ascending replay through the SG-000039 EventStore boundary." \
            --acceptance "Implementation of SG-000038, SG-000039, and this durable adapter is required before parent IN-P03-S01-T01 can be claimed complete; shaping alone is not implementation proof." \
            --acceptance "Any implementation candidate must pass repository format/lint/typecheck/tests, truthful Diffcipline proof at the security-sensitive risk tier, checksum-verified Alibaba Open Code Review, required credentialed Jev semantic review, exact-head CI, normal merge, and fresh-main CI before closure." \
            --dependency SG-000014 \
            --dependency SG-000039 \
            --risk-level high \
            --recovery "Revert only the new Run/Event control-plane migration, adapter, policy tests, and integration wiring; SG-000014 project storage, SG-000038 lifecycle shaping, SG-000039 provider-neutral EventStore shaping, and existing project data remain intact." \
            --context-budget 11000 \
            --context-estimate 8200 \
            --change-surface "packages/control-plane/supabase/migrations/**" \
            --change-surface "packages/control-plane/src/**" \
            --change-surface "packages/control-plane/**/*.test.ts" \
            --change-surface "packages/harness/**" \
            --change-surface "docs/evidence/**" \
            --change-surface "specs/CURRENT.md" \
            --evidence "Exact base/head/merge-base and complete migration/adapter/test changed-file accounting." \
            --evidence "RLS/privilege/tenant-isolation tests, Run lifecycle atomicity tests, append concurrency/conflict tests, protocol round-trip tests, and full repository verification." \
            --evidence "Diffcipline security-sensitive proof, Alibaba OCR evidence, credentialed Jev semantic review, exact-head semantic review, and post-merge fresh-main CI." \
            --minimality-choice reuse-existing \
            --minimality-rationale "Reuse the P01-S05 authenticated control-plane Supabase trust domain, SG-000038 lifecycle semantics, and SG-000039 EventStore contract. Add only the durable project-owned adapter and database enforcement needed to close persistence; do not create a second data plane or absorb artifacts/budgets/providers." \
            --safety-status requirements-defined \
            --safety-requirement "No service-role or generated-application credential may become ambient control-plane authority; all ordinary access remains authenticated, project-scoped, server-only, and RLS-constrained." \
            --safety-requirement "Event history is immutable and append-only under concurrency; database and adapter layers must both fail closed rather than silently repair, overwrite, reorder, or cross-bind events." \
            --safety-requirement "Database persistence does not grant capability, prove external execution, or create acceptance/PASS authority; it records typed state/evidence only." \
            --json | tee _shaping/shape.json
          specgrain refine "$SPEC_ID" . --json | tee _shaping/refine.json
          specgrain grain "$SPEC_ID" . --json | tee _shaping/grain.json
          specgrain check . --json | tee _shaping/check.json

      - name: Persist only SpecGrain state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p03-s01-t01c-durable-run-event-shaping.yml
          git status --short
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add .specgrain .github/workflows/p03-s01-t01c-durable-run-event-shaping.yml
          git commit -m "spec(p03): shape durable Run/Event persistence [shaped]"
          git push origin HEAD:p03/s01-t01c-durable-run-event-shaping
