name: p02-s03-t01c-shaping

on:
  push:
    branches:
      - p02/s03-t01c-user-request-interpretation-shaping
    paths:
      - .github/workflows/p02-s03-t01c-shaping.yml

permissions:
  contents: write

jobs:
  shape:
    if: ${{ !contains(github.event.head_commit.message, '[shaped]') }}
    runs-on: ubuntu-latest
    env:
      CANONICAL_BASE: 6ec4fbeb8aa4141623c35bf924b860a906ee26d6
      SPEC_GRAIN_SOURCE: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
    steps:
      - name: Checkout shaping branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical ancestry
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$CANONICAL_BASE^{commit}"
          test "$(git merge-base "$CANONICAL_BASE" HEAD)" = "$CANONICAL_BASE"

      - name: Install exact SpecGrain source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps "https://github.com/TheHalfMoon/SpecGrain/archive/${SPEC_GRAIN_SOURCE}.zip"
          specgrain --help >/dev/null

      - name: Draft with native SpecGrain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _shaping
          specgrain draft . \
            --title "IN-P02-S03-T01C user-request intent interpretation boundary" \
            --outcome "A raw user change request plus one typed provider-neutral interpretation can be validated, identity-bound, and deterministically compiled through the existing Change Intent compiler into a proposed Product Graph delta while preserving confidence, uncertainty, and provenance and performing no source mutation or provider call." \
            --rationale "SG-000027 and SG-000028 complete deterministic Change Intent proposal semantics but intentionally begin from already-typed ChangeIntent input. The canonical P02-S03 outcome begins from a user request. This final bounded slice adds only the provider-neutral request/interpretation contract and deterministic bridge; model/provider routing remains P03 authority." \
            --json | tee _shaping/draft.json
          SPEC_ID="$(python -c 'import json; print(json.load(open("_shaping/draft.json"))["spec_id"])')"
          test "$SPEC_ID" = "SG-000030"
          echo "SPEC_ID=$SPEC_ID" >> "$GITHUB_ENV"

      - name: Shape bounded Grain
        shell: bash
        run: |
          set -euo pipefail
          specgrain shape "$SPEC_ID" . \
            --scope-in "Define a closed UserChangeRequestV1 contract with exact Product Graph base revision, bounded raw user text, deterministic request identity, and explicit request provenance metadata." \
            --scope-in "Define a closed IntentInterpretationV1 contract bound to the exact request identity and base revision, carrying a bounded ordered ChangeIntent operation set plus explicit confidence, uncertainty notes, and interpretation provenance." \
            --scope-in "Implement deterministic validation and a bridge that converts a valid request/interpretation pair into the existing ChangeIntentV1 contract and delegates proposal construction to compileChangeIntent without mutating canonical graph state." \
            --scope-in "Add focused positive/negative tests for request identity binding, base-revision binding, confidence bounds, uncertainty/provenance validation, operation forwarding, deterministic proposal identity, and rejection of stale/mismatched interpretations." \
            --scope-in "Export the request/interpretation contracts and bridge through the existing @ineractive/product-graph public surface without adding a runtime dependency." \
            --scope-out "No LLM/model/provider invocation, provider routing, prompt construction, tool execution, retrieval, CLM/Jev decision routing, or model-generated interpretation implementation; those remain P03 concerns." \
            --scope-out "No Question Gate or Assumption Ledger policy; P02-S04 remains the consumer of interpretation confidence/uncertainty once this parent S03 handle closes." \
            --scope-out "No source mutation, Git mutation, database write, network access, credential use, capability grant, deployment, external effect, UI, or backend compiler behavior." \
            --scope-out "No new graph-operation semantics beyond SG-000028 and no semantic-reference relation work from P02-S06." \
            --acceptance "UserChangeRequestV1 and IntentInterpretationV1 have closed deterministic schemas, stable identities, exact base/request binding, bounded text/metadata, and fail closed on malformed, stale, mismatched, or out-of-range input." \
            --acceptance "A valid interpretation is translated without semantic widening into the existing ChangeIntentV1 operation vocabulary; compileUserRequestInterpretation delegates to compileChangeIntent and returns the same deterministic proposed graph delta semantics without accepting it as canonical truth." \
            --acceptance "Confidence, uncertainty, and provenance remain inspectable proposal metadata only: they cannot grant capability, bypass domain validation, suppress validation issues, or trigger an external effect." \
            --acceptance "Focused tests cover deterministic identity, request/base mismatch, malformed provenance/uncertainty/confidence, operation forwarding, domain-validation propagation, and no mutation of the request, interpretation, or base graph." \
            --acceptance "The exact candidate passes full repository format/lint/typecheck/tests, Diffcipline R2, Alibaba OCR deterministic/delegated review where applicable, Jev where available, exact-head CI, and post-merge fresh-main CI before closure." \
            --dependency SG-000028 \
            --risk-level medium \
            --recovery "Revert the request-intent boundary module, exports, tests, and evidence. SG-000027 and SG-000028 deterministic Change Intent behavior remains intact and IN-P02-S04 stays blocked." \
            --context-budget 7600 \
            --context-estimate 5600 \
            --change-surface "packages/product-graph/src/request-intent.ts" \
            --change-surface "packages/product-graph/src/request-intent.test.ts" \
            --change-surface "packages/product-graph/src/index.ts" \
            --change-surface "docs/evidence/**" \
            --change-surface "specs/CURRENT.md" \
            --evidence "Exact base/head/merge-base and changed-file accounting." \
            --evidence "Focused request/interpretation identity-binding and deterministic bridge tests plus full repository gates." \
            --evidence "Diffcipline exact-candidate proof, Alibaba OCR accounting/delegated review where applicable, Jev where available, exact-head CI, and post-merge fresh-main CI." \
            --minimality-choice reuse-existing \
            --minimality-rationale "The existing ChangeIntentV1 and compileChangeIntent implementation already owns graph-operation semantics and proposal construction. The smallest missing layer is a typed request/interpretation boundary and adapter; duplicating a parser, router, or proposal engine would violate phase ownership." \
            --safety-status requirements-defined \
            --safety-requirement "Raw user text and interpretation metadata are untrusted proposal input and never grant capability, authorization, trust, or execution authority." \
            --safety-requirement "An interpretation must be cryptographically/deterministically identity-bound to the exact request and Product Graph base revision; stale or mismatched interpretations fail closed." \
            --safety-requirement "The bridge must preserve existing Change Intent/domain validation and cannot silently drop uncertainty, validation issues, or unsupported operations." \
            --json | tee _shaping/shape.json
          specgrain refine "$SPEC_ID" . --json | tee _shaping/refine.json
          specgrain grain "$SPEC_ID" . --json | tee _shaping/grain.json
          specgrain check . --json | tee _shaping/check.json

      - name: Persist only SpecGrain state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p02-s03-t01c-shaping.yml
          git status --short
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add .specgrain .github/workflows/p02-s03-t01c-shaping.yml
          git commit -m "spec(p02): shape S03 user-request interpretation boundary [shaped]"
          git push origin HEAD:p02/s03-t01c-user-request-interpretation-shaping
