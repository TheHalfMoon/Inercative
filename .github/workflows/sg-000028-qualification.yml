name: sg-000028-qualification

on:
  push:
    branches:
      - evidence/sg-000028-qualification

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 4ce66697b907ce67828fc255348052366a1fa64a
      CANDIDATE_SHA: 1c2005b70fedf971bfffa9495788a70340c169fd
      DIFFCIPLINE_SHA256: a456a35bbfe03c087737118a05176af33604e2b2d1e634f8810bef6762f4a2f0
      OCR_SHA256: 56649575421b8ca3be3cfaededc0a9037ae7cc9ae560f167bf504bfb4054451a
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Initialize qualification evidence directories
        shell: bash
        run: mkdir -p _qualification .tools

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm 12.4.2
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.4.2
          pnpm --version

      - name: Install frozen dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify exact Git identities
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "$head" = "$CANDIDATE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          merge_base="$(git merge-base "$BASE_SHA" "$CANDIDATE_SHA")"
          test "$merge_base" = "$BASE_SHA"
          printf 'base=%s\nhead=%s\nmerge_base=%s\n' "$BASE_SHA" "$CANDIDATE_SHA" "$merge_base" > _qualification/identities.txt
          git diff --stat "$BASE_SHA..$CANDIDATE_SHA" | tee _qualification/diff-stat.txt
          git diff --numstat "$BASE_SHA..$CANDIDATE_SHA" | tee _qualification/diff-numstat.txt
          git diff --name-status "$BASE_SHA..$CANDIDATE_SHA" | tee _qualification/diff-files.txt

      - name: Download and verify Diffcipline v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/TheHalfMoon/Diffcipline/releases/download/v1.0.0/diffcipline-x86_64-unknown-linux-gnu' -o .tools/diffcipline
          echo "$DIFFCIPLINE_SHA256  .tools/diffcipline" | sha256sum --check
          chmod +x .tools/diffcipline
          printf 'release=v1.0.0\nasset=diffcipline-x86_64-unknown-linux-gnu\nsha256=%s\n' "$DIFFCIPLINE_SHA256" > _qualification/diffcipline-tool.txt

      - name: Run Diffcipline R2 exact-candidate proof
        shell: bash
        run: |
          set -euo pipefail
          .tools/diffcipline check --base "$BASE_SHA" --risk R2 --run --json | tee _qualification/diffcipline-proof.json

      - name: Download and verify Alibaba OCR v1.12.7
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/alibaba/open-code-review/releases/download/v1.12.7/opencodereview-linux-amd64' -o .tools/ocr
          echo "$OCR_SHA256  .tools/ocr" | sha256sum --check
          chmod +x .tools/ocr
          printf 'release=v1.12.7\nasset=opencodereview-linux-amd64\nsha256=%s\n' "$OCR_SHA256" > _qualification/ocr-tool.txt

      - name: Run OCR deterministic accounting and rule resolution
        shell: bash
        run: |
          set -euo pipefail
          .tools/ocr delegate preview --from "$BASE_SHA" --to "$CANDIDATE_SHA" --format json | tee _qualification/ocr-preview.json
          .tools/ocr delegate rule --format json packages/product-graph/src/change-intent.ts packages/product-graph/src/index.ts | tee _qualification/ocr-rules.json
          git diff "$BASE_SHA..$CANDIDATE_SHA" -- packages/product-graph/src/change-intent.test.ts > _qualification/excluded-test-review.diff

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg-000028-exact-candidate-qualification
          path: _qualification/
          if-no-files-found: error
