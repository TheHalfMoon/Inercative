name: P00 SpecGrain one-shot shape

on:
  push:
    branches:
      - p00/s04-t03-provenance-admission
    paths:
      - .github/workflows/p00-specgrain-shape.yml

permissions:
  contents: write

concurrency:
  group: p00-specgrain-shape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shape:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SPECGRAIN_SHA: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
      BASELINE_SHA: bf635e34643b4e87e11bcfcc0892eb64aeae8196
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact SpecGrain source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps "https://github.com/TheHalfMoon/SpecGrain/archive/${SPECGRAIN_SHA}.zip"
          python -c "import importlib.metadata; print('specgrain-package-version=' + importlib.metadata.version('specgrain'))"
          specgrain --help >/dev/null

      - name: Draft T03 candidate
        shell: bash
        run: |
          set -euo pipefail
          specgrain draft . --title "IN-P00-S04-T03 Add provenance validation and notice inventory" --outcome "Donor import admission validates canonical provenance records and produces a deterministic notice inventory before donor product code can enter the repository." --rationale "Canonical rolling-wave P00-S04-T03 frontier after SG-000005 completion." --json | tee /tmp/specgrain-draft.json
          test "$(python -c 'import json; print(json.load(open("/tmp/specgrain-draft.json"))["spec_id"])')" = "SG-000007"

      - name: Shape T03
        shell: bash
        run: |
          set -euo pipefail
          specgrain shape SG-000007 .             --scope-in "Add deterministic import-admission validation over canonical donor import records."             --scope-in "Add deterministic notice inventory generation and checking for admitted records."             --scope-in "Add negative fixtures for incomplete, blocked, and notice-invalid records."             --scope-in "Record the bounded source-import checklist and evidence required before donor product-code import."             --scope-out "No donor product-code import."             --scope-out "No P01 product or runtime implementation."             --scope-out "No automatic legal compatibility conclusion beyond explicit repository policy checks."             --acceptance "Invalid or incomplete donor import records fail admission deterministically."             --acceptance "Blocked dependency closure prevents admission."             --acceptance "A record that requires NOTICE material cannot pass without a non-empty notice reference."             --acceptance "Notice inventory output is deterministic, deduplicated, and stable for the same valid records."             --acceptance "An empty current notice inventory is accepted only when zero donor records are admitted."             --acceptance "Focused tests and exact-head repository CI pass."             --dependency SG-000005             --risk-level medium             --recovery "Revert SG-000007, provenance admission/inventory code, generated inventory, and evidence; no external side effects or donor imports are permitted in this Grain."             --context-budget 9000             --context-estimate 4500             --change-surface "packages/provenance/**"             --change-surface "docs/canonical/**"             --change-surface "docs/evidence/**"             --change-surface "third_party/**"             --evidence "Focused Vitest results covering valid admission and negative incomplete/blocked/notice fixtures."             --evidence "Deterministic notice-inventory fixture/output and exact changed-file accounting."             --evidence "Exact-head Ubuntu and Windows repository CI."             --minimality-choice new-code             --minimality-rationale "Extend the existing Ineractive-owned provenance package without introducing a new runtime dependency."             --safety-status requirements-defined             --safety-requirement "Fail closed on unknown, incomplete, conflicting, or blocked rights/provenance state."             --safety-requirement "Do not import donor product code during this Grain."             --json | tee /tmp/specgrain-shape.json

      - name: Refine and promote T03
        shell: bash
        run: |
          set -euo pipefail
          specgrain refine SG-000007 . --json | tee /tmp/specgrain-refine.json
          specgrain check . --json | tee /tmp/specgrain-check-refining.json
          specgrain grain SG-000007 . --json | tee /tmp/specgrain-grain.json
          specgrain check . --json | tee /tmp/specgrain-check-grain.json
          specgrain next . --json | tee /tmp/specgrain-next.json

      - name: Assert known dependency-model boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          data = json.load(open("/tmp/specgrain-next.json", encoding="utf-8"))
          candidates = {entry["node_id"]: entry for entry in data["candidates"]}
          candidate = candidates["SG-000007"]
          if candidate["eligible"]:
              raise SystemExit("SG-000007 unexpectedly eligible; dependency model changed")
          if candidate["waiting_on"] != ["SG-000005"]:
              raise SystemExit("unexpected waiting_on: " + repr(candidate["waiting_on"]))
          print("known-boundary: SG-000007 waits on SG-000005 because CLI lifecycle completion is not modeled")
          PY

      - name: Record shaping evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .specgrain/tmp/pregrain-mutation.lock
          mkdir -p docs/evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(name):
              return json.loads(Path("/tmp/" + name).read_text(encoding="utf-8"))

          draft = load("specgrain-draft.json")
          shape = load("specgrain-shape.json")
          refine = load("specgrain-refine.json")
          grain = load("specgrain-grain.json")
          check = load("specgrain-check-grain.json")
          nxt = load("specgrain-next.json")
          candidate = next(item for item in nxt["candidates"] if item["node_id"] == "SG-000007")

          lines = [
              "# P00-S04-T03 — SpecGrain Shaping Evidence",
              "",
              "Task: IN-P00-S04-T03",
              "SpecGrain: SG-000007",
              "Date: 2026-09-20",
              "Canonical baseline: " + os.environ["BASELINE_SHA"],
              "SpecGrain source: TheHalfMoon/SpecGrain@" + os.environ["SPECGRAIN_SHA"],
              "GitHub Actions run: " + os.environ["GITHUB_RUN_ID"],
              "",
              "## Tool execution",
              "",
              "Repository-local state was created by the real SpecGrain CLI installed from the exact pinned source revision above.",
              "No SpecNode was hand-authored.",
              "",
              "- draft state: " + draft["state"],
              "- shaped revision: " + shape["revision_digest"],
              "- refine state: " + refine["state"],
              "- grain state: " + grain["state"],
              "- final revision: " + grain["revision_digest"],
              "- project check valid: " + str(check["valid"]).lower(),
              "- next valid: " + str(nxt["valid"]).lower(),
              "- next eligible for SG-000007: " + str(candidate["eligible"]).lower(),
              "- next waiting_on: " + ",".join(candidate["waiting_on"]),
              "",
              "## Known lifecycle boundary",
              "",
              "SpecGrain dependency eligibility currently treats only VERIFIED or CONTROLLED dependencies as satisfied.",
              "The current CLI does not expose lifecycle transitions that can record already-canonical SG-000005 completion in those states.",
              "Repository delivery truth records SG-000005 DONE through PR #10, exact-head CI, and fresh-main CI.",
              "No READY, VERIFIED, CONTROLLED, or WorkPacket claim is fabricated here.",
              "",
              "## Scope boundary",
              "",
              "- no donor product code imported;",
              "- no P01 implementation;",
              "- no external side effects;",
              "- implementation remains bounded to SG-000007 after this generated state is reviewed.",
              "",
          ]
          Path("docs/evidence/P00_S04_T03_SPECGRAIN_SHAPING_2026-09-20.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Commit tool-produced state
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          python - <<'PY'
          import subprocess
          allowed = {
              ".specgrain/specs/SG-000007.json",
              "docs/evidence/P00_S04_T03_SPECGRAIN_SHAPING_2026-09-20.md",
          }
          output = subprocess.check_output(["git", "status", "--porcelain=v1"], text=True)
          changed = {line[3:] for line in output.splitlines() if line}
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected or missing:
              raise SystemExit("unexpected changed paths=" + repr(unexpected) + "; missing expected paths=" + repr(missing))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .specgrain/specs/SG-000007.json docs/evidence/P00_S04_T03_SPECGRAIN_SHAPING_2026-09-20.md
          git commit -m "chore(p00): shape provenance validation grain"
          git push origin "HEAD:${GITHUB_REF_NAME}"
