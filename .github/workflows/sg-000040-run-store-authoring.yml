name: sg-000040-run-store-authoring

on:
  push:
    branches:
      - p03/s01-t01c-durable-run-store

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 626e279c16decc8e00400a5adf1564396a3ad32b
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: p03/s01-t01c-durable-run-store
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies and format bounded packet
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            packages/control-plane/src/run-store.ts \
            packages/control-plane/src/run-store.test.ts

      - name: Verify repository
        shell: bash
        run: |
          set -euo pipefail
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          git diff --check "$BASE_SHA..HEAD"

      - name: Enforce bounded product surface
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(packages/control-plane/src/run-store.ts|packages/control-plane/src/run-store.test.ts|.github/workflows/sg-000040-run-store-authoring.yml)$'
          paths="$(git diff --name-only "$BASE_SHA"; git ls-files --others --exclude-standard)"
          if printf '%s\n' "$paths" | sed '/^$/d' | grep -Ev "$allowed"; then
            echo 'Unexpected SG-000040 RunStore path detected.' >&2
            exit 1
          fi
          additions="$(git diff --numstat "$BASE_SHA" | awk '{a += $1} END {print a + 0}')"
          echo "bounded_additions=$additions"
          test "$additions" -le 600

      - name: Persist verified candidate and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TheHalfMoon'
          git config user.email 'alshehriofficial@gmail.com'
          git add packages/control-plane/src/run-store.ts packages/control-plane/src/run-store.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'test(control-plane): normalize durable RunStore candidate'
          fi
          git rm .github/workflows/sg-000040-run-store-authoring.yml
          git commit -m 'chore(authoring): remove SG-000040 RunStore workflow'
          git push origin HEAD:p03/s01-t01c-durable-run-store
