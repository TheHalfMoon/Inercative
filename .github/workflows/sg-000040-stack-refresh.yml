name: sg-000040-stack-refresh

on:
  push:
    branches:
      - stack/p03-s01-t01c-durable-run-event
    paths:
      - .github/workflows/sg-000040-stack-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stack branch
        uses: actions/checkout@v4
        with:
          ref: stack/p03-s01-t01c-durable-run-event
          fetch-depth: 0

      - name: Merge exact async SG-000039 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git fetch origin p03/s01-t01b-event-store-implementation
          test "$(git rev-parse origin/p03/s01-t01b-event-store-implementation)" = "47dde035178b9528d0bd634f124e00c7654ce2db"
          git merge --no-ff --no-edit origin/p03/s01-t01b-event-store-implementation

      - name: Remove temporary refresh workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sg-000040-stack-refresh.yml
          git add .github/workflows/sg-000040-stack-refresh.yml
          git commit -m "chore(stack): remove temporary SG-000040 refresh"
          git push origin HEAD:stack/p03-s01-t01c-durable-run-event
