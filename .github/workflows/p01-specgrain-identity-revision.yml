name: P01 SpecGrain one-shot identity/revision shape

on:
  push:
    branches:
      - p01/s02-t01-protocol-identity-revision
    paths:
      - .github/workflows/p01-specgrain-identity-revision.yml

permissions:
  contents: write

jobs:
  shape:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SPECGRAIN_SHA: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
      BASELINE_SHA: cf0fa70c8f065033ad0bb4087c76b5d57dd3b6ce
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact SpecGrain source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps "https://github.com/TheHalfMoon/SpecGrain/archive/${SPECGRAIN_SHA}.zip"
          specgrain --help >/dev/null
      - name: Draft SG-000010
        shell: bash
        run: |
          set -euo pipefail
          specgrain draft .             --title "IN-P01-S02-T01 Implement protocol identity and revision primitives"             --outcome "Ineractive has a minimal provider-neutral public protocol foundation for stable opaque identities and immutable revision references, with deterministic runtime validation and machine-readable schemas."             --rationale "First protocol task after canonical SG-000009 framework qualification."             --json | tee /tmp/draft.json
          test "$(python -c 'import json; print(json.load(open("/tmp/draft.json"))["spec_id"])')" = "SG-000010"
      - name: Shape SG-000010
        shell: bash
        run: |
          set -euo pipefail
          specgrain shape SG-000010 .             --scope-in "Define provider-neutral stable opaque protocol identity primitives."             --scope-in "Define immutable Git SHA and SHA-256 revision reference primitives."             --scope-in "Define a typed identity-plus-revision reference for exact-state binding."             --scope-in "Add deterministic parsers/validators and machine-readable JSON Schema."             --scope-in "Expose only the earned identity/revision public API from @ineractive/protocol."             --scope-out "Do not define Run, Event, Evidence, or Finding schemas; those remain IN-P01-S02-T02."             --scope-out "Do not define ModelTask, DecisionTask, CapabilityRequest, or CapabilityGrant."             --scope-out "Do not build the workspace shell or persist protocol objects."             --acceptance "Protocol IDs are opaque, namespace-qualified, canonical, and reject whitespace/malformed/unknown namespace input."             --acceptance "Git revisions require exact 40-hex SHA identity and SHA-256 revisions require exact 64-hex digest identity."             --acceptance "IdentityRevisionRef cannot be constructed unless both identity and revision validate."             --acceptance "Round-trip parse/serialize is deterministic and canonical."             --acceptance "The public protocol package exports only the identity/revision surface earned by this Grain."             --acceptance "Focused tests plus exact-head Ubuntu and Windows repository CI pass."             --dependency SG-000009             --risk-level medium             --recovery "Revert SG-000010 and identity/revision protocol exports/schema/tests; no external or persisted data migration is authorized."             --context-budget 8500             --context-estimate 4200             --change-surface "packages/protocol/**"             --change-surface "docs/canonical/**"             --change-surface "docs/evidence/**"             --change-surface "specs/CURRENT.md"             --evidence "Positive and negative unit tests for identity, revision, and exact-state reference parsing."             --evidence "Machine-readable schema and public-export accounting."             --evidence "Exact-head Ubuntu and Windows repository CI."             --minimality-choice reuse-existing             --minimality-rationale "Promote the existing @ineractive/protocol placeholder into the smallest earned public protocol surface without adding dependencies."             --safety-status requirements-defined             --safety-requirement "Identity strings never grant authority or capability by themselves."             --safety-requirement "Revision references must be immutable exact identities; branch names, floating tags, and mutable labels are rejected."             --json | tee /tmp/shape.json
      - name: Refine and promote SG-000010
        shell: bash
        run: |
          set -euo pipefail
          specgrain refine SG-000010 . --json | tee /tmp/refine.json
          specgrain check . --json | tee /tmp/check-refining.json
          specgrain grain SG-000010 . --json | tee /tmp/grain.json
          specgrain check . --json | tee /tmp/check-grain.json
          specgrain next . --json | tee /tmp/next.json
      - name: Assert known lifecycle boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          data=json.load(open("/tmp/next.json",encoding="utf-8"))
          candidate=next(item for item in data["candidates"] if item["node_id"]=="SG-000010")
          if candidate["waiting_on"] != ["SG-000009"]:
              raise SystemExit("unexpected waiting_on: " + repr(candidate["waiting_on"]))
          print("known-boundary: SG-000010 waits on SG-000009 because CLI completion transitions are not modeled")
          PY
      - name: Record shaping evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .specgrain/tmp/pregrain-mutation.lock
          mkdir -p docs/evidence
          python - <<'PY'
          import json, os
          from pathlib import Path
          def load(name):
              return json.loads(Path("/tmp/"+name).read_text(encoding="utf-8"))
          draft=load("draft.json"); shape=load("shape.json"); refine=load("refine.json")
          grain=load("grain.json"); check=load("check-grain.json"); nxt=load("next.json")
          candidate=next(item for item in nxt["candidates"] if item["node_id"]=="SG-000010")
          lines=[
              "# P01-S02-T01 — SpecGrain Shaping Evidence","",
              "Task: IN-P01-S02-T01","SpecGrain: SG-000010","Date: 2026-09-20",
              "Canonical baseline: "+os.environ["BASELINE_SHA"],
              "SpecGrain source: TheHalfMoon/SpecGrain@"+os.environ["SPECGRAIN_SHA"],
              "GitHub Actions run: "+os.environ["GITHUB_RUN_ID"],"",
              "## Tool execution","",
              "- draft state: "+draft["state"],
              "- shaped revision: "+shape["revision_digest"],
              "- refine state: "+refine["state"],
              "- grain state: "+grain["state"],
              "- final revision: "+grain["revision_digest"],
              "- project check valid: "+str(check["valid"]).lower(),
              "- next waiting_on: "+",".join(candidate["waiting_on"]),"",
              "The SpecNode was produced by the real pinned SpecGrain CLI; it was not hand-authored.","",
              "## Lifecycle boundary","",
              "Repository delivery truth records SG-000009 DONE through PR #15 and fresh-main CI #108.",
              "SpecGrain next still waits on SG-000009 because the current CLI does not expose completion transitions.",
              "No READY/VERIFIED/CONTROLLED/WorkPacket state is fabricated.",""
          ]
          Path("docs/evidence/P01_S02_T01_SPECGRAIN_SHAPING_2026-09-20.md").write_text("\n".join(lines),encoding="utf-8")
          PY
      - name: Commit tool-produced state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
            ".specgrain/specs/SG-000010.json",
            "docs/evidence/P01_S02_T01_SPECGRAIN_SHAPING_2026-09-20.md",
          }
          output=subprocess.check_output(["git","status","--porcelain=v1"],text=True)
          changed={line[3:] for line in output.splitlines() if line}
          if changed != allowed:
              raise SystemExit("unexpected changed paths="+repr(sorted(changed))+"; expected="+repr(sorted(allowed)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .specgrain/specs/SG-000010.json docs/evidence/P01_S02_T01_SPECGRAIN_SHAPING_2026-09-20.md
          git commit -m "chore(p01): shape protocol identity revision grain"
          git push origin "HEAD:${GITHUB_REF_NAME}"
