name: p02-s01-t01a-shape

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  shape:
    if: github.event.pull_request.head.ref == 'p02/s01-t01a-structured-product-graph'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned SpecGrain
        run: python -m pip install "git+https://github.com/TheHalfMoon/SpecGrain.git@5de7d6499bb0a9e3a191fc0934399cf099d1980a"

      - name: Shape bounded Grain
        shell: bash
        run: |
          set -euo pipefail
          specgrain draft . \
            --title "IN-P02-S01-T01A Prototype canonical structured Product Graph document" \
            --outcome "A private deterministic structured-document Product Graph prototype proves canonical normalization, round-trip, and bounded query semantics without selecting the production v1 representation." \
            | tee /tmp/draft.txt
          specgrain shape SG-000015 . \
            --scope-in "Implement one private canonical structured-document Product Graph prototype with explicit graph, node, and edge identity." \
            --scope-in "Canonicalize node/edge ordering and nested JSON object keys so semantic revisions and serialization are insertion-order stable." \
            --scope-in "Provide one representative Product Graph fixture plus focused round-trip and bounded query tests." \
            --scope-out "No normalized relational prototype or representation comparison." \
            --scope-out "No public Product Graph v1 contract, graph database, production persistence, migration, or remote side effect." \
            --acceptance "Structured-document persistence round-trips to the same canonical semantic graph." \
            --acceptance "Equivalent insertion-order permutations produce identical canonical serialization and semantic revision." \
            --acceptance "Node lookup, outgoing-edge lookup, and one-hop slice queries are deterministic on the representative fixture." \
            --acceptance "Focused tests, Diffcipline R1 exact-candidate proof, Alibaba OCR accounting/review, and exact-head Ubuntu/Windows repository CI are recorded before merge." \
            --dependency SG-000013 \
            --dependency SG-000014 \
            --risk-level medium \
            --recovery "Revert SG-000015 and the private structured prototype; no public contract or external state is changed." \
            --context-budget 6000 \
            --context-estimate 2800 \
            --change-surface "packages/product-graph-lab/**" \
            --change-surface "docs/evidence/**" \
            --change-surface "specs/CURRENT.md" \
            --evidence "Focused structured-document prototype tests for canonicalization, round-trip, revision stability, and queries." \
            --evidence "Diffcipline R1 exact-candidate PASS plus Alibaba OCR exact-diff accounting/review." \
            --evidence "Exact-head Ubuntu and Windows repository CI." \
            --minimality-choice new-code \
            --minimality-rationale "Use one private dependency-free prototype rather than selecting production storage or introducing a database dependency." \
            --safety-status requirements-defined \
            --safety-requirement "Keep the prototype private and non-authoritative; do not expose it as the public Product Graph v1 contract." \
            | tee /tmp/shape.txt
          specgrain refine SG-000015 . | tee /tmp/refine.txt
          specgrain grain SG-000015 . | tee /tmp/grain.txt
          specgrain check . | tee /tmp/check.txt
          specgrain next . | tee /tmp/next.txt

      - name: Record shaping evidence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence
          {
            echo "# P02-S01-T01A — SpecGrain Shaping Evidence"
            echo
            echo "**Task:** IN-P02-S01-T01A"
            echo "**SpecGrain:** SG-000015"
            echo "**Date:** 2026-09-21"
            echo "**Canonical baseline:** ec1a8209c8f6164b41b55e77e5d41db5856b14e9"
            echo "**SpecGrain source:** TheHalfMoon/SpecGrain@5de7d6499bb0a9e3a191fc0934399cf099d1980a"
            echo "**GitHub Actions run:** ${GITHUB_RUN_ID}"
            echo
            echo "## Tool execution"
            echo
            echo '~~~text'
            cat /tmp/draft.txt /tmp/shape.txt /tmp/refine.txt /tmp/grain.txt /tmp/check.txt /tmp/next.txt
            echo '~~~'
            echo
            echo "The SpecNode was produced by the pinned SpecGrain CLI. No lifecycle or verification state beyond the observed CLI output is claimed."
            echo
            echo "## Decomposition correction"
            echo
            echo "This Grain supersedes the oversized unmerged SG-000015 candidate preserved in closed PR #22. The correction narrows T01 to one independently verifiable structured-document prototype so repository Diffcipline limits remain authoritative."
          } > docs/evidence/P02_S01_T01A_SPECGRAIN_SHAPING_2026-09-21.md
          rm .github/workflows/p02-s01-t01a-shape.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(p02): reshape structured Product Graph grain"
          git push origin HEAD:${GITHUB_HEAD_REF}
