name: sg-000039-qualification-v2

on:
  push:
    branches:
      - evidence/sg-000039-qualification-v2

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 3a4713c47d36722c564f185bc4a8c02ad57da05c
      CANDIDATE_SHA: 54b0ddf358ce8c93c0b8977a8d17e65b4e32b18d
      DIFFCIPLINE_SHA256: a456a35bbfe03c087737118a05176af33604e2b2d1e634f8810bef6762f4a2f0
      OCR_SHA256: 56649575421b8ca3be3cfaededc0a9037ae7cc9ae560f167bf504bfb4054451a
      JEV_SHA256: 1f54c1aec0ca3790d8e4d215aa50c227a758b4cc967dbf90607672ec34cad2a0
      JEV_API_KEY: ${{ secrets.JEV_API_KEY || secrets.TYPESAFE_API_KEY }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Initialize evidence directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sg000039/evidence" "$RUNNER_TEMP/sg000039/tools"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/sg000039/evidence" >> "$GITHUB_ENV"
          echo "TOOLS_DIR=$RUNNER_TEMP/sg000039/tools" >> "$GITHUB_ENV"

      - name: Install and verify repository
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@12.4.2
          pnpm install --frozen-lockfile
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$BASE_SHA" "$CANDIDATE_SHA")" = "$BASE_SHA"
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          git diff --check "$BASE_SHA..$CANDIDATE_SHA"
          git diff --numstat "$BASE_SHA..$CANDIDATE_SHA" | tee "$EVIDENCE_DIR/diff-numstat.txt"
          git diff "$BASE_SHA..$CANDIDATE_SHA" -- packages/harness pnpm-lock.yaml > "$EVIDENCE_DIR/exact-review.diff"

      - name: Run and disposition Diffcipline R2 REVIEW truthfully
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/TheHalfMoon/Diffcipline/releases/download/v1.0.0/diffcipline-x86_64-unknown-linux-gnu' -o "$TOOLS_DIR/diffcipline"
          echo "$DIFFCIPLINE_SHA256  $TOOLS_DIR/diffcipline" | sha256sum --check
          chmod +x "$TOOLS_DIR/diffcipline"
          set +e
          "$TOOLS_DIR/diffcipline" check --base "$BASE_SHA" --risk R2 --run --json > "$EVIDENCE_DIR/diffcipline-proof.json"
          rc=$?
          set -e
          cat "$EVIDENCE_DIR/diffcipline-proof.json"
          python - <<'PY'
          import json, os, pathlib
          proof = json.loads((pathlib.Path(os.environ['EVIDENCE_DIR']) / 'diffcipline-proof.json').read_text())
          assert proof['verdict'] == 'REVIEW', proof
          assert proof['scope_violations'] == [], proof
          assert all(item['state'] == 'PASS' for item in proof['verification']), proof
          reasons = set(proof['reasons'])
          expected = {
              'dependency manifest changed: packages/harness/package.json',
              'lockfile changed: pnpm-lock.yaml',
          }
          assert reasons == expected, (reasons, expected)
          (pathlib.Path(os.environ['EVIDENCE_DIR']) / 'diffcipline-disposition.txt').write_text(
              'verdict=REVIEW\ndisposition=EXPECTED_MANIFEST_AND_LOCKFILE_REVIEW\n'
              'hard_failure=false\nscope_violations=0\nverification=PASS\n'
          )
          PY
          test "$rc" -ne 0

      - name: Run checksum-verified Alibaba Open Code Review accounting
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/alibaba/open-code-review/releases/download/v1.12.7/opencodereview-linux-amd64' -o "$TOOLS_DIR/ocr"
          echo "$OCR_SHA256  $TOOLS_DIR/ocr" | sha256sum --check
          chmod +x "$TOOLS_DIR/ocr"
          "$TOOLS_DIR/ocr" --version 2>&1 | tee "$EVIDENCE_DIR/ocr-version.txt"
          "$TOOLS_DIR/ocr" delegate preview --from "$BASE_SHA" --to "$CANDIDATE_SHA" --format json | tee "$EVIDENCE_DIR/ocr-preview.json"
          for path in packages/harness/src/index.ts packages/harness/src/event-store.ts packages/harness/src/event-store.test.ts; do
            safe="$(echo "$path" | tr '/.' '__')"
            "$TOOLS_DIR/ocr" delegate rule --format json "$path" | tee "$EVIDENCE_DIR/ocr-$safe-rules.json"
          done

      - name: Install checksum-verified Jev CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/model-clis/jev/releases/download/v2026.919.0/jev-linux-x86_64' -o "$TOOLS_DIR/jev"
          echo "$JEV_SHA256  $TOOLS_DIR/jev" | sha256sum --check
          chmod +x "$TOOLS_DIR/jev"
          "$TOOLS_DIR/jev" --version 2>&1 | tee "$EVIDENCE_DIR/jev-version.txt"

      - name: Build exact-diff Jev request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          evidence = pathlib.Path(os.environ['EVIDENCE_DIR'])
          request = {
            'state': {
              'grain': 'SG-000039 / IN-P03-S01-T01B',
              'base': os.environ['BASE_SHA'],
              'candidate': os.environ['CANDIDATE_SHA'],
              'scope': 'Provider-neutral async append-only EventStore plus deterministic in-memory reference and bounded generic storage failure semantics. No durable persistence or authority.',
              'diff': (evidence / 'exact-review.diff').read_text(),
            },
            'questions': {
              'scope_escape': {'type':'noul','instructions':'Does the exact diff escape the declared EventStore scope?','criteria':{'true':'It adds persistence, network/provider authority, lifecycle mutation, or hidden side effects.','false':'It adds only the EventStore contract/reference, package wiring and tests.'}},
              'append_only_gap': {'type':'noul','instructions':'Can accepted history be overwritten, caller-mutated, reordered, or cross-contaminated?','criteria':{'true':'Accepted history can change or leak across Runs.','false':'History is immutable and isolated; conflicts fail closed.'}},
              'sequence_gap': {'type':'noul','instructions':'Can non-contiguous or nondeterministic sequencing be accepted?','criteria':{'true':'Gaps/regressions/duplicates or nondeterministic replay are possible.','false':'Per-Run sequencing is zero-based, contiguous and deterministic.'}},
              'durable_boundary': {'type':'noul','instructions':'Does the public port prevent a later durable async adapter?','criteria':{'true':'The contract assumes synchronous/in-memory execution or vendor-specific failures.','false':'Promise methods plus generic storage failure codes support durable adapters.'}}
            }
          }
          (evidence / 'jev-request.json').write_text(json.dumps(request, sort_keys=True))
          PY

      - name: Run required Jev semantic review
        id: jev
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${JEV_API_KEY:-}" ]; then
            printf 'state=BLOCKED_MISSING_GITHUB_SECRET\nreason=JEV_API_KEY and compatible TYPESAFE_API_KEY are absent\n' | tee "$EVIDENCE_DIR/jev-status.txt"
            exit 1
          fi
          "$TOOLS_DIR/jev" ask "$EVIDENCE_DIR/jev-request.json" \
            --assert 'answers.scope_escape.noul <= 0.5 and answers.append_only_gap.noul <= 0.5 and answers.sequence_gap.noul <= 0.5 and answers.durable_boundary.noul <= 0.5' \
            | tee "$EVIDENCE_DIR/jev-result.json"
          printf 'state=PASS\n' > "$EVIDENCE_DIR/jev-status.txt"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg-000039-v2-exact-qualification
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error

      - name: Enforce Jev hard gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.jev.outcome }}' = 'success'
