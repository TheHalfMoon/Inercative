name: sg-000039-authoring

on:
  push:
    branches:
      - p03/s01-t01b-event-store-implementation
    paths:
      - .github/workflows/sg-000039-authoring.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: p03/s01-t01b-event-store-implementation
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - name: Apply bounded SG-000039 repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path('packages/harness/src/event-store.test.ts')
          test_text = test_path.read_text()
          test_text = test_text.replace(
              'import { formatLogicalIdentity } from "@ineractive/protocol";',
              'import { formatLogicalIdentity, type LogicalIdentity } from "@ineractive/protocol";',
              1,
          )
          test_text = test_text.replace(
              'function event(runId: typeof RUN_A | typeof RUN_B, sequence: number, suffix: string) {',
              'function event(runId: LogicalIdentity<"run">, sequence: number, suffix: string) {',
              1,
          )
          test_path.write_text(test_text)

          store_path = Path('packages/harness/src/event-store.ts')
          store_text = store_path.read_text()
          old = '    const runId = parseLogicalIdentityForKind("run", runIdInput);\n'
          new = '    const runId =\n      typeof runIdInput === "string" ? parseLogicalIdentityForKind("run", runIdInput) : null;\n'
          assert old in store_text
          store_path.write_text(store_text.replace(old, new, 1))
          PY

      - name: Normalize workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Format bounded SG-000039 files
        run: pnpm exec prettier --write packages/harness/package.json packages/harness/tsconfig.json packages/harness/src/index.ts packages/harness/src/event-store.ts packages/harness/src/event-store.test.ts pnpm-lock.yaml

      - name: Verify repository
        shell: bash
        run: |
          set -euo pipefail
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          git diff --check

      - name: Persist verified candidate and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          rm .github/workflows/sg-000039-authoring.yml
          git add -A
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/sg-000039-authoring.yml|pnpm-lock.yaml|packages/harness/package.json|packages/harness/tsconfig.json|packages/harness/src/index.ts|packages/harness/src/event-store.ts|packages/harness/src/event-store.test.ts) ;;
              *) echo "Unexpected authoring path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git commit -m "test(harness): qualify SG-000039 reference store"
          git push origin HEAD:p03/s01-t01b-event-store-implementation
