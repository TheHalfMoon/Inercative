name: p02-s06-t01b-endpoint-shaping

on:
  push:
    branches:
      - p02/s06-t01b-endpoint-shaping
    paths:
      - .github/workflows/p02-s06-t01b-endpoint-shaping.yml

permissions:
  contents: write

jobs:
  shape:
    if: ${{ !contains(github.event.head_commit.message, '[shaped]') }}
    runs-on: ubuntu-latest
    env:
      CANONICAL_BASE: 0a13e40b52e735e752e15c5d18ee5a164320df66
      SPEC_GRAIN_SOURCE: 5de7d6499bb0a9e3a191fc0934399cf099d1980a
    steps:
      - name: Checkout shaping branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$CANONICAL_BASE" HEAD)" = "$CANONICAL_BASE"

      - name: Install exact SpecGrain source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps "https://github.com/TheHalfMoon/SpecGrain/archive/${SPEC_GRAIN_SOURCE}.zip"
          specgrain --help >/dev/null

      - name: Draft with native SpecGrain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _shaping
          specgrain draft . \
            --title "IN-P02-S06-T01B semantic reference relation endpoint contracts" \
            --outcome "The Product Graph can represent Component, Feature, ProductRevision, and DeploymentTarget as closed deterministic metadata nodes, providing typed endpoints required by canonical semantic-reference relations without widening existing relations or granting runtime authority." \
            --rationale "SG-000029 established DesignSystemRevisionRef, SkillRef, ExplorationBranch, and Release. Canonical S06 relations BOUND_TO, MAY_USE, FORKS, PROMOTES, and TARGETS require Component, Feature, ProductRevision, and DeploymentTarget endpoints that are not yet present in the qualified domain-v1 vocabulary." \
            --json | tee _shaping/draft.json
          SPEC_ID="$(python -c 'import json; print(json.load(open("_shaping/draft.json"))["spec_id"])')"
          test "$SPEC_ID" = "SG-000037"
          echo "SPEC_ID=$SPEC_ID" >> "$GITHUB_ENV"

      - name: Shape bounded Grain
        shell: bash
        run: |
          set -euo pipefail
          specgrain shape "$SPEC_ID" . \
            --scope-in "Add a closed Component Product Graph node contract for a reusable UI/product primitive using inspectable metadata only; its existence must not imply a DesignSystemRevision binding." \
            --scope-in "Add a closed Feature Product Graph node contract for a user-visible capability using inspectable metadata only; its existence must not imply SkillRef execution or tool capability." \
            --scope-in "Add a closed ProductRevision Product Graph node contract for immutable/inspectable product revision identity and provenance metadata; its existence must not grant source mutation, release, or deployment authority." \
            --scope-in "Add a closed DeploymentTarget Product Graph node contract for target identity/type/environment/provenance metadata; its existence must not grant credentials, network access, deployment permission, or provider authority." \
            --scope-in "Extend only the existing deterministic Product Graph node validator and focused tests; preserve all previously qualified node and edge semantics unchanged." \
            --scope-out "No BOUND_TO, MAY_USE, FORKS, PROMOTES, TARGETS edge kinds or endpoint pairs; no cross-node existence rules; no relation widening." \
            --scope-out "No component rendering, skill execution, branch mutation, source writes, release creation, deployment, provider calls, network access, secret handling, persistence/Supabase mutation, or P03 work." \
            --scope-out "No S07 DataSource/Field work, dataset relation work, ProductCompletenessManifest, VectorCorpus, or EvalDataset work." \
            --acceptance "DOMAIN_NODE_KINDS and DOMAIN_NODE_KIND_SPECS include Component, Feature, ProductRevision, and DeploymentTarget with closed deterministic metadata schemas while all previously qualified node and edge semantics remain compatible." \
            --acceptance "Component and Feature metadata cannot be interpreted as DesignSystemRevision binding, SkillRef execution, capability admission, or runtime proof." \
            --acceptance "ProductRevision metadata cannot grant source mutation, release, promotion, or deployment authority merely because the node exists." \
            --acceptance "DeploymentTarget metadata cannot contain or grant secret/network/deployment capability and cannot be interpreted as proof that a provider target is reachable or authorized." \
            --acceptance "Focused tests prove valid examples plus missing-required, unknown-field, wrong-type, deterministic issue ordering, and full canonical domain-validation compatibility." \
            --acceptance "The exact implementation candidate must pass repository format/lint/typecheck/tests, Diffcipline at the truthful risk tier, checksum-verified Alibaba Open Code Review, required credentialed Jev semantic review, exact-head CI, normal merge, and fresh-main CI before closure." \
            --dependency SG-000029 \
            --risk-level medium \
            --recovery "Revert the Component, Feature, ProductRevision, and DeploymentTarget node-kind/spec additions and their focused tests; SG-000029 semantic reference nodes remain intact." \
            --context-budget 7000 \
            --context-estimate 4700 \
            --change-surface "packages/product-graph/src/domain.ts" \
            --change-surface "packages/product-graph/src/domain.test.ts" \
            --change-surface "docs/evidence/**" \
            --change-surface "specs/CURRENT.md" \
            --evidence "Exact base/head/merge-base and changed-file accounting." \
            --evidence "Focused endpoint metadata-contract tests plus full repository format/lint/typecheck/test suites." \
            --evidence "Diffcipline proof, Alibaba OCR evidence, credentialed Jev semantic review, exact-head semantic review, and post-merge fresh-main CI." \
            --minimality-choice reuse-existing \
            --minimality-rationale "The smallest safe S06 continuation is to add only the four missing endpoint node contracts required by already-canonical reference relations. Relation semantics remain a later independently reviewable Grain." \
            --safety-status requirements-defined \
            --safety-requirement "Metadata node existence never grants capability, credential, network, source-mutation, release, or deployment authority." \
            --safety-requirement "Component and Feature remain descriptive Product Graph semantics until explicit qualified relations are added later." \
            --safety-requirement "DeploymentTarget stores no secret material and is not proof of provider reachability or authorization." \
            --json | tee _shaping/shape.json
          specgrain refine "$SPEC_ID" . --json | tee _shaping/refine.json
          specgrain grain "$SPEC_ID" . --json | tee _shaping/grain.json
          specgrain check . --json | tee _shaping/check.json

      - name: Persist only SpecGrain state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p02-s06-t01b-endpoint-shaping.yml
          git status --short
          git config user.name "TheHalfMoon"
          git config user.email "alshehriofficial@gmail.com"
          git add .specgrain .github/workflows/p02-s06-t01b-endpoint-shaping.yml
          git commit -m "spec(p02): shape S06 reference relation endpoints [shaped]"
          git push origin HEAD:p02/s06-t01b-endpoint-shaping
