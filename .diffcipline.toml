# Ineractive Diffcipline policy.
#
# Tool: TheHalfMoon/Diffcipline v1.0.0 (immutable release).
# CLI provenance: release asset diffcipline-x86_64-pc-windows-msvc.exe, SHA-256
# 5fee721d3837ab86f2c36003d02ca67ebac793ff8dadcdb3b7eea074690e57a8, verified against
# the published SHA256SUMS for tag v1.0.0 (release commit 5cb1c77340b75649f6168e0e8f66479ea047ea96).
#
# Proof semantics (Diffcipline PROOF-CONTRACT v1):
#   PASS   = every configured hard requirement observed and satisfied.
#   REVIEW = no hard failure, but judgment or optional evidence remains.
#   FAIL   = a hard requirement or verification command failed.
#   64     = usage/execution error; no verdict.
#   NOT RUN is never PASS.
#
# Verification commands mirror the repository's own baseline gates
# (docs/engineering/TOOLCHAIN.md §3). `pnpm run check` is the exact CI gate set
# (format:check + lint + typecheck + test). Commands execute only with explicit --run.

version = 1

[policy]
# Bounded change surface for a single Grain. Deliberately tight; P00 units are small.
max_changed_files = 16
max_added_lines = 600
# Dependency manifests, lockfiles, and untracked files always require human review.
# A lockfile change is a reviewable change, never a side effect (TOOLCHAIN.md §7).
dependency_manifest_changes = "review"
lockfile_changes = "review"
untracked_files = "review"
# Forbidden surfaces: never in scope for an ordinary bounded Grain.
# Workflow/ruleset changes, secrets, and VCS internals are out of band.
# Supported patterns are intentionally narrow: exact paths, directory-recursive
# "dir/**" suffixes, and leading filename-suffix patterns such as "*.pem".
forbidden_surfaces = [".github/workflows/**", ".git/**", "secrets/**", "*.pem", "*.key", ".env"]

[verification]
# Default: the full deterministic baseline gate set the CI workflow executes.
commands = ["pnpm run check"]

# R0 — non-behavioral (docs, comments, formatting, metadata).
r0_commands = ["pnpm run format:check"]

# R1 — local behavior (isolated deterministic helper/UI; no persistence or trust boundary).
r1_commands = ["pnpm run format:check", "pnpm run lint", "pnpm run typecheck", "pnpm run test"]

# R2 — shared behavior (workspace contracts, public API, build/infra behavior, new dependency).
r2_commands = ["pnpm run check"]

# R3 — critical boundary (authorization, secrets, migrations, production/sandbox security).
# Passing the baseline alone is never sufficient for R3; it additionally requires the
# review/proof obligations in docs/canonical/QUALITY_AND_REVIEW.md and AGENTS.md.
r3_commands = ["pnpm run check"]
